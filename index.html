// LG.registerGame / LG.games / LG.categories。見 docs/02-architecture.md §4
(() => {
  const LG = globalThis.LG;

  LG.categories = [
    { id: 'table', name: { zh: '桌遊', en: 'Table Games' } },
    { id: 'poker-table', name: { zh: '撲克桌遊', en: 'Poker Table Games' } },
    { id: 'slots', name: { zh: '老虎機', en: 'Slots' } },
    { id: 'poker-room', name: { zh: '撲克室', en: 'Poker Room' } },
  ];
  /** id → def */
  LG.games = {};

  const DEFAULT_DENOMS = [10, 25, 50, 100, 500, 1000];

  /**
   * 註冊遊戲。必填：id, category, name{zh,en}, create(ctx)。
   * 選填擴充：countdown（真實模式倒數秒數，預設 15，用於進場說明）、demo（示範遊戲）。
   */
  LG.registerGame = function registerGame(def) {
    if (!def || !def.id || typeof def.create !== 'function') throw Error('registerGame: 需要 id 與 create(ctx)');
    if (!LG.categories.some((c) => c.id === def.category)) throw Error(`registerGame(${def.id}): 未知分類 ${def.category}`);
    if (LG.games[def.id]) LG.debug('registerGame: 覆寫', def.id);
    const d = {
      order: 99, summary: '', houseEdge: [], variants: [],
      limits: { real: { min: 50, max: 5000 }, practice: { min: 10, max: 100000 } },
      ...def,
    };
    if (!d.denoms && d.category !== 'slots') d.denoms = DEFAULT_DENOMS;
    LG.games[d.id] = d;
    return d;
  };

  /** 依分類（可省略）取遊戲清單，依 order、id 排序 */
  LG.gameList = function gameList(category) {
    return Object.values(LG.games)
      .filter((g) => !category || g.category === category)
      .sort((a, b) => (a.order - b.order) || a.id.localeCompare(b.id));
  };

  /** def.houseEdge 中 best:true 的一筆；沒有就取 edge 最小值 */
  LG.bestEdge = function bestEdge(def) {
    const list = (def && def.houseEdge) || [];
    if (!list.length) return null;
    return list.find((x) => x.best) || [...list].sort((a, b) => a.edge - b.edge)[0];
  };

  /** 依模式與變體算出限注 {min,max}（variant.limits 覆寫 def.limits） */
  LG.limitsFor = function limitsFor(def, mode, variantId) {
    const key = mode === 'real' ? 'real' : 'practice';
    const base = (def.limits && def.limits[key]) || { min: 10, max: 100000 };
    const v = (def.variants || []).find((x) => x.id === variantId);
    const over = v && v.limits && v.limits[key];
    return { ...base, ...(over || {}) };
  };
})();


/* ==== src/core/31-tutorial.js ==== */
// LG.tutorial — 教學步驟引擎（底部工作表）。見 docs/02-architecture.md §5、docs/06-tutorial-guide.md
//
// step = { id, section:'layout'|'flow'|'payout'|'strategy', title, body(html), highlight:[selector]|null,
//          setup(instance)?, action:{label, check(instance) → true | false | '提示字串'}? }
// 有 action 的步驟：check 通過前「下一步」鎖住（點了會顯示提示）。
// 前進時 progress.markStep；最後一步按鈕「完成！去練習模式」→ onFinish()。
(() => {
  const LG = globalThis.LG;
  const { el, term } = LG.ui;

  const SECTIONS = [
    { id: 'layout', zh: '桌面', en: 'Layout' },
    { id: 'flow', zh: '流程', en: 'Flow' },
    { id: 'payout', zh: '賠率', en: 'Payout' },
    { id: 'strategy', zh: '策略', en: 'Strategy' },
  ];

  let active = null;

  /**
   * @param {{gameId:string, steps:Array, root?:Element, instance?:object, onFinish?:Function, mount?:Element}} o
   * @returns {{go(i), next(), prev(), index():number, stop(), el:Element}}
   */
  function run({ gameId, steps, root, instance, onFinish, mount }) {
    stop();
    steps = (steps || []).filter(Boolean);
    const N = steps.length;
    const host = mount || document.querySelector('.lg-tutor-slot') || document.body;
    let i = 0, timer = 0, passed = false, dead = false;

    const tabs = el('div.lg-tutor__tabs', { role: 'tablist' });
    const secBtns = SECTIONS.map((s) => {
      const first = steps.findIndex((st) => st.section === s.id);
      const b = el('button', { type: 'button', class: 'lg-tutor__tab', dataset: { tutorSection: s.id }, html: term(s.zh, s.en), disabled: first < 0 });
      b.addEventListener('click', () => { if (first >= 0) go(first); });
      tabs.appendChild(b);
      return b;
    });
    const count = el('span.lg-tutor__count');
    const bar = el('div.lg-tutor__bar', [el('span')]);
    const title = el('h3.lg-tutor__title');
    const body = el('div.lg-tutor__body');
    const action = el('div.lg-tutor__action');
    const prevB = el('button', { type: 'button', class: 'lg-btn lg-btn--ghost', dataset: { tutor: 'prev' }, html: '上一步 <i class="en">Back</i>' });
    const nextB = el('button', { type: 'button', class: 'lg-btn lg-btn--primary', dataset: { tutor: 'next' } });
    const minB = el('button', { type: 'button', class: 'lg-tutor__min', 'aria-label': '收起/展開教學', text: '▾' });
    const sheet = el('div.lg-tutor', { role: 'region', 'aria-label': '教學 Tutorial' }, [
      el('div.lg-tutor__top', [tabs, minB]),
      el('div.lg-tutor__head', [title, count]),
      bar,
      el('div.lg-tutor__scroll', [body, action]),
      el('div.lg-tutor__nav', [prevB, nextB]),
    ]);
    prevB.addEventListener('click', () => prev());
    nextB.addEventListener('click', () => next());
    minB.addEventListener('click', () => {
      sheet.classList.toggle('is-min');
      minB.textContent = sheet.classList.contains('is-min') ? '▴' : '▾';
    });
    host.appendChild(sheet);
    document.body.classList.add('lg-has-tutor');

    function evalCheck() {
      const st = steps[i];
      if (!st || !st.action) return true;
      let r;
      try { r = st.action.check ? st.action.check(instance) : true; }
      catch (e) { console.error('[tutorial] check', st.id, e); r = false; }
      return r;
    }

    function paintAction() {
      const st = steps[i];
      if (!st.action) { action.hidden = true; action.innerHTML = ''; nextB.classList.remove('is-locked'); nextB.removeAttribute('aria-disabled'); return; }
      action.hidden = false;
      const r = evalCheck();
      if (r === true) passed = true;
      action.classList.toggle('is-done', passed);
      const hint = passed ? '✓ 完成！<i class="en">Done</i>' : (typeof r === 'string' ? r : '完成上面的動作後即可下一步');
      action.innerHTML = `<div class="lg-tutor__todo"><span class="lg-tutor__badge">${passed ? '✓' : '試試看'}</span> ${st.action.label}</div><div class="lg-tutor__hint">${hint}</div>`;
      nextB.classList.toggle('is-locked', !passed);
      if (passed) nextB.removeAttribute('aria-disabled'); else nextB.setAttribute('aria-disabled', 'true');
    }

    function paint() {
      const st = steps[i];
      sheet.dataset.step = st.id || String(i);
      sheet.dataset.index = String(i);
      sheet.dataset.section = st.section || '';
      title.innerHTML = st.title || '';
      body.innerHTML = st.body || '';
      count.textContent = `${i + 1} / ${N}`;
      bar.firstChild.style.width = `${((i + 1) / N) * 100}%`;
      secBtns.forEach((b, k) => b.classList.toggle('is-active', SECTIONS[k].id === st.section));
      prevB.disabled = i === 0;
      nextB.innerHTML = i === N - 1 ? '完成！去練習模式 <i class="en">Practice</i>' : '下一步 <i class="en">Next</i>';
      nextB.dataset.last = i === N - 1 ? '1' : '0';
      paintAction();
    }

    function go(k) {
      if (dead || !N) return;
      i = Math.max(0, Math.min(N - 1, k));
      passed = false;
      clearInterval(timer);
      const st = steps[i];
      LG.ui.highlight(null);
      if (st.setup) {
        try { st.setup(instance); } catch (e) { console.error('[tutorial] setup', st.id, e); }
      }
      paint();
      // 等 DOM 更新後再高亮
      requestAnimationFrame(() => { if (!dead && steps[i] === st) LG.ui.highlight(st.highlight || null); });
      if (st.action) timer = setInterval(() => { if (!passed) paintAction(); }, 250);
      const sc = sheet.querySelector('.lg-tutor__scroll');
      if (sc) sc.scrollTop = 0;
    }

    function next() {
      if (dead) return;
      const st = steps[i];
      if (st.action && !passed) {
        paintAction();
        if (!passed) {
          nextB.classList.remove('is-shake'); void nextB.offsetWidth; nextB.classList.add('is-shake');
          const r = evalCheck();
          LG.ui.toast(typeof r === 'string' ? r : `先完成：${st.action.label}`, { type: 'warn' });
          return;
        }
      }
      LG.progress.markStep(gameId, i, N);
      if (i === N - 1) {
        LG.ui.toast('教學完成！<i class="en">Tutorial complete</i>');
        const fin = onFinish;
        stop();
        if (fin) fin();
        return;
      }
      go(i + 1);
    }
    function prev() { if (i > 0) go(i - 1); }

    const onKey = (ev) => {
      if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
      if (document.querySelector('.lg-modal-backdrop')) return;
      if (ev.key === 'ArrowRight') next(); else if (ev.key === 'ArrowLeft') prev();
    };
    document.addEventListener('keydown', onKey);

    function stopThis() {
      if (dead) return;
      dead = true;
      clearInterval(timer);
      document.removeEventListener('keydown', onKey);
      LG.ui.highlight(null);
      sheet.remove();
      document.body.classList.remove('lg-has-tutor');
      if (active === ctl) active = null;
    }

    const ctl = { go, next, prev, index: () => i, steps, el: sheet, stop: stopThis, root };
    active = ctl;
    if (N) go(0);
    return ctl;
  }

  function stop() { if (active) active.stop(); }

  /** 檢查步驟是否符合寫作規範（≥12 步、四段、≥3 action）→ {ok, problems[]}；遊戲測試可用 */
  function lint(steps, { minSteps = 12, minActions = 3 } = {}) {
    const problems = [];
    if (steps.length < minSteps) problems.push(`步數 ${steps.length} < ${minSteps}`);
    SECTIONS.forEach((s) => { if (!steps.some((x) => x.section === s.id)) problems.push(`缺少段落 ${s.id}`); });
    const acts = steps.filter((x) => x.action).length;
    if (acts < minActions) problems.push(`action 步 ${acts} < ${minActions}`);
    steps.forEach((x, k) => {
      if (!x.title) problems.push(`第 ${k + 1} 步缺 title`);
      if (!('highlight' in x)) problems.push(`第 ${k + 1} 步（${x.id}）未設定 highlight（無高亮請寫 null）`);
    });
    // 段落順序必須 layout → flow → payout → strategy
    const order = steps.map((x) => SECTIONS.findIndex((s) => s.id === x.section));
    for (let k = 1; k < order.length; k++) if (order[k] < order[k - 1]) { problems.push('段落順序應為 layout → flow → payout → strategy'); break; }
    return { ok: problems.length === 0, problems };
  }

  LG.tutorial = { run, stop, lint, SECTIONS, current: () => active };
})();


/* ==== src/core/32-modes.js ==== */
// LG.modes — 三模式框架：建立遊戲頁（topbar/modebar/variantbar/stage）、ctx、真實模式進場/離場、破產覆蓋層。
// 見 docs/02-architecture.md §4.1–4.2、docs/03-ui-spec.md §2、§7
(() => {
  const LG = globalThis.LG;
  const { el, term, toast } = LG.ui;
  const { fmt, round2 } = LG.money;

  const MODE_INFO = {
    tutorial: { zh: '教學', en: 'Tutorial' },
    practice: { zh: '練習', en: 'Practice' },
    real: { zh: '真實', en: 'Real' },
  };

  let cur = null;

  const balText = (b) => fmt(b, { cents: Math.round(b * 100) % 100 !== 0 });
  const limitsText = (l) => `${fmt(l.min, { cents: l.min < 1 })} – ${fmt(l.max).replace('RM ', '')}`;

  function sessionHtml(s) {
    const mins = s.endedAt && s.startedAt ? Math.max(1, Math.round((s.endedAt - s.startedAt) / 60000)) : null;
    const cls = s.net > 0 ? 'lg-win' : s.net < 0 ? 'lg-lose' : '';
    return `<dl class="lg-kv">
      <dt>局數 <i class="en">Rounds</i></dt><dd>${s.rounds}</dd>
      <dt>總下注 <i class="en">Wagered</i></dt><dd>${fmt(s.wagered)}</dd>
      <dt>淨輸贏 <i class="en">Net</i></dt><dd class="${cls}">${LG.money.fmtSigned(s.net)}</dd>
      <dt>最大單局贏 <i class="en">Biggest win</i></dt><dd>${LG.money.fmtSigned(s.maxWin)}</dd>
      <dt>最大單局輸 <i class="en">Biggest loss</i></dt><dd>${LG.money.fmtSigned(s.maxLoss)}</dd>
      ${mins ? `<dt>時間 <i class="en">Time</i></dt><dd>${mins} 分鐘</dd>` : ''}
    </dl>`;
  }

  function showSummary(s) {
    LG.ui.modal({
      title: '本次真實模式摘要 <i class="en">Session summary</i>',
      body: sessionHtml(s) + '<p class="lg-muted">真實模式的輸贏已寫入統計。記得：設好預算，輸完就走。</p>',
      className: 'lg-modal--summary',
    });
  }

  /** 建立 ctx 並掛載遊戲頁 */
  function open(gameId, mode, variant, app) {
    const def = LG.games[gameId];
    if (!def) throw Error('unknown game ' + gameId);
    if (cur && cur.gameId === gameId && cur.mode === mode && cur.variant === variant && cur.page.isConnected) return cur.ctx;
    const continuing = !!(cur && cur.mode === 'real' && mode === 'real' && cur.gameId === gameId);
    const summary = teardown({ keepSession: continuing });
    app = app || document.getElementById('app');

    const isReal = mode === 'real', isPractice = mode === 'practice', isTutorial = mode === 'tutorial';
    const variants = def.variants || [];
    const vDef = variants.find((v) => v.id === variant) || null;
    const limits = LG.limitsFor(def, mode, variant);
    const R = LG.router;

    // ---------------------------------------------------------- 版面
    const balance = el('div.lg-balance', { 'aria-label': '餘額 Balance' });
    const menuB = el('button', { type: 'button', class: 'lg-topbar__menu', 'aria-label': '選單 Menu', dataset: { action: 'menu' }, text: '⋯' });
    const topbar = el('header.lg-topbar', [
      el('a.lg-topbar__back', { href: '#/', 'aria-label': '回首頁', html: '← 首頁' }),
      el('div.lg-topbar__title', { html: `<b>${def.name.zh}</b> <i class="en">${def.name.en}</i>` }),
      balance, menuB,
    ]);
    const seg = el('nav.lg-seg', { 'aria-label': '模式 Mode' }, ['tutorial', 'practice', 'real'].map((m) =>
      el('a', { class: ['lg-seg__btn', m === mode && 'is-active'], href: R.href(gameId, m, variant), dataset: { mode: m }, 'aria-current': m === mode ? 'page' : null, html: term(MODE_INFO[m].zh, MODE_INFO[m].en) })));
    const hintB = el('button', { type: 'button', class: 'lg-switch', role: 'switch', dataset: { action: 'hints' }, html: '<span class="lg-switch__knob"></span>提示 <i class="en">Hints</i>' });
    const modebar = el('div.lg-modebar', [seg, isPractice ? hintB : null,
      isReal ? el('span.lg-modebar__limits', { html: `限注 ${limitsText(limits)}` }) : null]);
    const variantbar = variants.length > 1 ? el('nav.lg-variantbar', { 'aria-label': '變體 Variant' }, [
      el('span.lg-variantbar__k', { text: '變體' }),
      ...variants.map((v) => el('a', { class: ['lg-variantbar__btn', v.id === variant && 'is-active'], href: R.href(gameId, mode, v.id), dataset: { variant: v.id }, html: term(v.name.zh, v.name.en) })),
    ]) : null;
    const bannerEl = el('div.lg-dealer-banner', { 'aria-live': 'polite' });
    const cdEl = el('div.lg-countdown', { 'aria-live': 'off' });
    const pauseB = isReal ? el('button', { type: 'button', class: 'lg-btn lg-btn--sm lg-btn--ghost lg-pause', dataset: { action: 'pause' }, html: '暫停 <i class="en">Pause</i>' }) : null;
    const section = el('section.lg-game', { dataset: { game: gameId, mode, variant: variant || '' } });
    const windowBar = el('div.lg-window-bar');
    const stage = el('div.lg-stage', [el('div.lg-stage-top', [bannerEl, cdEl, pauseB]), section, windowBar]);
    const strategy = el('aside.lg-strategy', { hidden: true, 'aria-label': '提示 Hints' });
    const tutorSlot = el('div.lg-tutor-slot');
    const page = el('div', { class: ['lg-page', 'lg-page--game', `is-${mode}`], dataset: { game: gameId, mode } },
      [topbar, modebar, variantbar, el('div.lg-game-wrap', [stage, strategy]), tutorSlot]);
    app.replaceChildren(page);
    document.title = `${def.name.zh} ${def.name.en} · 賭場遊戲練習場`;
    window.scrollTo && window.scrollTo(0, 0);
    LG.ui.dealer.clear();

    // ---------------------------------------------------------- 狀態
    const st = {
      gameId, mode, variant, def, page, section, alive: true, timers: new Set(), offs: [],
      win: null, pending: null, paused: false, broke: false, lastNet: null, strategyHtml: null, practiceWarned: false,
    };
    let readyResolve;
    const ready = new Promise((r) => { readyResolve = r; });

    const paintBalance = () => {
      const b = LG.bank.balance();
      balance.textContent = balText(b);
      balance.dataset.balance = String(b);
    };
    paintBalance();
    st.offs.push(LG.events.on('bank:change', paintBalance));

    const hintsOn = () => isPractice && !!LG.store.peek().settings.hints;
    const paintHints = () => {
      hintB.setAttribute('aria-checked', hintsOn() ? 'true' : 'false');
      hintB.classList.toggle('is-on', hintsOn());
      const show = hintsOn() && st.strategyHtml !== null && st.strategyHtml !== '';
      strategy.hidden = !show;
      page.classList.toggle('has-strategy', show);
    };
    hintB.addEventListener('click', () => {
      LG.store.update((s) => { s.settings.hints = !s.settings.hints; });
      paintHints();
      LG.events.emit('hints:change', { gameId, hints: hintsOn() });
    });

    const later = (fn, ms) => {
      const id = setTimeout(() => { st.timers.delete(id); if (st.alive) fn(); }, LG.ms(ms));
      st.timers.add(id);
      return id;
    };

    // ---------------------------------------------------------- 真實模式：暫停 / 破產
    function runPending() {
      if (!st.alive || st.paused || st.broke || !st.pending) return;
      const f = st.pending; st.pending = null;
      f();
    }
    if (pauseB) {
      pauseB.addEventListener('click', () => {
        st.paused = !st.paused;
        pauseB.innerHTML = st.paused ? '繼續 <i class="en">Resume</i>' : '暫停 <i class="en">Pause</i>';
        pauseB.classList.toggle('is-on', st.paused);
        if (st.paused) toast('已暫停：本局結束後不會自動開下一局');
        else later(runPending, 300);
      });
    }

    function brokeOverlay() {
      LG.stats.session.markBroke();
      const s = LG.stats.session.current() || { rounds: 0, wagered: 0, net: 0, maxWin: 0, maxLoss: 0 };
      const ov = el('div.lg-broke', { role: 'dialog', 'aria-modal': 'true' }, [
        el('div.lg-broke__box', [
          el('h2', { html: '籌碼用完 <i class="en">Out of chips</i>' }),
          el('p', { html: `餘額 ${balText(LG.bank.balance())} 低於本桌最低注 ${fmt(limits.min)}。` }),
          el('div', { html: sessionHtml(s) }),
          el('p.lg-muted', { text: '真實賭場裡，這就是今晚結束的時候。' }),
          el('div.lg-broke__actions', [
            el('a', { class: 'lg-btn lg-btn--ghost', href: '#/', html: '回首頁 <i class="en">Home</i>' }),
            el('button', {
              type: 'button', class: 'lg-btn lg-btn--primary', dataset: { action: 'reset-bank' }, html: '重置籌碼 RM 1,000',
              on: { click: () => { LG.bank.reset(); ov.remove(); st.broke = false; toast('籌碼已重置為 RM 1,000'); later(runPending, 300); } },
            }),
          ]),
        ]),
      ]);
      page.appendChild(ov);
    }

    // ---------------------------------------------------------- ctx
    const ctx = {
      gameId, def, mode, variant, variantDef: vDef,
      bank: LG.bank, stats: LG.stats,
      limits, denoms: def.denoms || [10, 25, 50, 100, 500, 1000],
      limitsText: limitsText(limits),
      get hints() { return hintsOn(); },
      isReal, isPractice, isTutorial,
      root: section,
      /** 真實模式進場 modal 按「開始」後 resolve（其他模式立即 resolve） */
      ready,
      /** 此 instance 仍掛載中？（非同步流程中用來提早結束） */
      alive: () => st.alive,

      /** 練習/教學：resultPanel；真實：只 payoutFlash(net)。net 省略時用最近一次 recordRound 的 net */
      explain(o = {}) {
        if (!st.alive) return null;
        const net = typeof o.net === 'number' ? o.net : st.lastNet;
        if (isReal) { LG.ui.payoutFlash(net ?? 0); return null; }
        return LG.ui.resultPanel({ ...o, net: typeof net === 'number' ? net : undefined });
      },

      dealer: {
        say(zh, en) { if (st.alive) LG.ui.dealer.say(zh, en, { speak: isReal && !!LG.store.peek().settings.speak }); },
        clear() { LG.ui.dealer.clear(); },
      },

      /**
       * 下注時段。真實：「請下注」→ 倒數 seconds 秒 →「停止下注」→ bets.lock() → onClose。
       * 練習/教學：「請下注」+ 顯示「發牌 Deal」按鈕（放在 [data-deal-slot] 或 .lg-actions，否則桌面下方），按下 → onClose。
       * @param {{seconds?:number, onClose:Function, bets?:LG.Bets, label?:string, validate?:() => true|string, onTick?:Function}} o
       *  bets：練習模式按「發牌」前先 bets.validate()；兩種模式關閉時自動 bets.lock()。
       *  onClose({auto, ok, validation})：真實模式倒數結束 auto=true；ok=false 代表下注不合法（遊戲自行處理）。
       * @returns {{cancel(), close(), isOpen():boolean}}
       */
      bettingWindow(o = {}) {
        if (st.win) st.win.cancel();
        const seconds = o.seconds ?? def.countdown ?? 15;
        let closed = false, cd = null, btn = null;
        const h = {
          cancel() { closed = true; if (cd) cd.cancel(); if (btn) btn.remove(); if (st.win === h) st.win = null; },
          close() { fire(false); },
          isOpen: () => !closed,
        };
        const fire = (auto) => {
          if (closed || !st.alive) return;
          const validation = o.bets ? o.bets.validate() : { ok: true, errors: [], zh: '' };
          h.cancel();
          ctx.dealer.say('停止下注', 'No more bets');
          if (o.bets) o.bets.lock();
          if (o.onClose) o.onClose({ auto, ok: validation.ok, validation });
        };
        st.win = h;
        if (isReal) {
          ready.then(() => {
            if (closed || !st.alive) return;
            ctx.dealer.say('請下注', 'Place your bets');
            cd = LG.ui.countdown(seconds, { onTick: o.onTick, onDone: () => fire(true) });
          });
        } else {
          ctx.dealer.say('請下注', 'Place your bets');
          btn = el('button', { type: 'button', class: 'lg-btn lg-btn--primary lg-deal', dataset: { action: 'deal' }, html: o.label || '發牌 <i class="en">Deal</i>' });
          btn.addEventListener('click', () => {
            if (o.validate) { const r = o.validate(); if (r !== true) { toast(typeof r === 'string' ? r : '還不能發牌', { type: 'warn' }); return; } }
            if (o.bets) { const v = o.bets.validate(); if (!v.ok) { toast(v.zh, { type: 'warn' }); return; } }
            fire(false);
          });
          const slot = section.querySelector('[data-deal-slot]') || section.querySelector('.lg-actions') || windowBar;
          slot.prepend(btn);
        }
        return h;
      },

      /** 統一寫統計：教學不記；練習記 stats；真實記 stats + session */
      recordRound(r = {}) {
        st.lastNet = round2(r.net || 0);
        if (isTutorial || !st.alive) return;
        LG.stats.record(gameId, r);
        if (isReal) LG.stats.session.record(r);
      },

      /** 餘額 < 最低注：真實 → 「籌碼用完」覆蓋層（暫停自動下一局）；練習 → 提示可重置。回傳是否破產 */
      checkBroke() {
        if (isTutorial || !st.alive) return false;
        if (LG.bank.balance() >= limits.min - 1e-9) { st.practiceWarned = false; return false; }
        if (isReal) {
          if (!st.broke) { st.broke = true; brokeOverlay(); }
          return true;
        }
        if (!st.practiceWarned) {
          st.practiceWarned = true;
          LG.ui.modal({
            title: '籌碼不足 <i class="en">Low balance</i>',
            body: `<p>餘額 ${balText(LG.bank.balance())} 低於最低注 ${fmt(limits.min)}。練習模式可以隨時重置。</p>`,
            actions: [
              { label: '稍後', id: 'later' },
              { label: '重置籌碼 RM 1,000', id: 'reset-bank', primary: true, onClick: () => { LG.bank.reset(); st.practiceWarned = false; } },
            ],
          });
        }
        return true;
      },

      /** 下一局：真實 → 3 秒後自動（暫停/破產時延後）；練習/教學 → 立即呼叫 */
      nextRound(fn) {
        if (!st.alive) return;
        if (!isReal) { fn(); return; }
        st.pending = fn;
        if (st.paused || st.broke) return;
        later(runPending, 3000);
      },

      setVariant(id) { LG.router.go(R.href(gameId, mode, id)); },

      /** 練習模式提示面板（策略表等）；提示關閉或非練習模式時隱藏。null 清除 */
      strategyPanel(html) {
        st.strategyHtml = html ?? null;
        strategy.innerHTML = '';
        if (html !== null && html !== undefined) {
          strategy.appendChild(el('h3.lg-strategy__title', { html: '提示 <i class="en">Hints</i>' }));
          const body = el('div.lg-strategy__body');
          if (typeof html === 'string') body.innerHTML = html; else body.appendChild(html);
          strategy.appendChild(body);
        }
        paintHints();
      },

      /** Promise：LG.ms(ms) 後 resolve；instance 卸載後永不 resolve（流程自然停止） */
      wait(ms) { return new Promise((res) => { later(res, ms); }); },
      /** setTimeout(fn, LG.ms(ms))，卸載時自動清除 */
      later,
      /** LG.events.on，卸載時自動解除 */
      on(name, fn) { const off = LG.events.on(name, fn); st.offs.push(off); return off; },
    };
    st.ctx = ctx;
    cur = st;
    paintHints();

    // 選單
    menuB.addEventListener('click', () => {
      const s = LG.stats.get(gameId);
      const speak = !!LG.store.peek().settings.speak;
      LG.ui.modal({
        title: '選單 <i class="en">Menu</i>',
        body: `<h3>${def.name.zh}統計 <i class="en">Stats</i></h3>
          <dl class="lg-kv"><dt>局數</dt><dd>${s.rounds}</dd><dt>總下注</dt><dd>${fmt(s.wagered)}</dd>
          <dt>淨輸贏</dt><dd>${LG.money.fmtSigned(s.net)}</dd><dt>贏 / 輸 / 和</dt><dd>${s.wins} / ${s.losses} / ${s.pushes}</dd></dl>`,
        actions: [
          { id: 'speak', label: speak ? '關閉語音口令' : '開啟語音口令（真實模式）', onClick: () => { LG.store.update((x) => { x.settings.speak = !x.settings.speak; }); toast(LG.store.peek().settings.speak ? '已開啟語音口令' : '已關閉語音口令'); } },
          { id: 'reset-bank', label: '重置籌碼', onClick: () => { LG.ui.confirm('把籌碼重置為 RM 1,000？進度與統計不受影響。').then((ok) => { if (ok) { LG.bank.reset(); toast('籌碼已重置為 RM 1,000'); } }); } },
          { id: 'close', label: '關閉', primary: true },
        ],
      });
    });

    // ---------------------------------------------------------- 建立遊戲
    try {
      st.instance = def.create(ctx) || {};
      st.instance.mount && st.instance.mount(section);
      if (!section.dataset.ready) section.dataset.ready = '1';
      st.instance.onModeChange && st.instance.onModeChange(mode);
      if (variant && st.instance.onVariantChange) st.instance.onVariantChange(variant);
    } catch (e) {
      console.error('[LG.modes] 建立遊戲失敗', gameId, e);
      section.appendChild(el('div.lg-error', { text: '遊戲載入失敗：' + (e && e.message) }));
    }

    if (isTutorial && st.instance) {
      let steps = [];
      try { steps = (st.instance.tutorialSteps && st.instance.tutorialSteps()) || []; } catch (e) { console.error('[LG.modes] tutorialSteps', e); }
      LG.tutorial.run({
        gameId, steps, root: section, instance: st.instance, mount: tutorSlot,
        onFinish: () => LG.router.go(R.href(gameId, 'practice', variant)),
      });
    }

    if (isReal) {
      if (!continuing) LG.stats.session.start(gameId);
      if (continuing) readyResolve();
      else {
        st.entry = LG.ui.modal({
          title: '真實模式 <i class="en">Real mode</i>',
          body: `<p>真實模式：限注 <b>${limitsText(limits)}</b>，倒數 <b>${def.countdown ?? 15} 秒</b>，不會有解說。</p>
            <ul class="lg-list"><li>荷官說 <b>No more bets</b> 後，籌碼不能再碰。</li><li>結果只顯示輸贏金額。</li><li>籌碼用完就結束（可手動重置）。</li></ul>`,
          dismissable: false,
          actions: [
            { id: 'real-back', label: '回練習', onClick: () => { LG.router.go(R.href(gameId, 'practice', variant)); } },
            { id: 'real-start', label: '開始 <i class="en">Start</i>', primary: true, onClick: () => { readyResolve(); } },
          ],
        });
      }
    } else readyResolve();

    LG.events.emit('mode:change', { gameId, mode, variant });
    if (summary && summary.rounds > 0) showSummary(summary);
    return ctx;
  }

  /** 卸載目前遊戲；回傳真實模式 session 摘要（若有） */
  function teardown({ keepSession = false } = {}) {
    if (!cur) return null;
    const c = cur;
    cur = null;
    c.alive = false;
    c.timers.forEach((t) => clearTimeout(t));
    c.offs.forEach((off) => off());
    if (c.win) c.win.cancel();
    if (c.entry) c.entry.close();
    LG.tutorial.stop();
    try { c.instance && c.instance.unmount && c.instance.unmount(); } catch (e) { console.error('[LG.modes] unmount', c.gameId, e); }
    LG.ui.clearOverlays();
    if (c.mode === 'real' && !keepSession) return LG.stats.session.end();
    return null;
  }

  /** 離開遊戲頁（回首頁）；離開真實模式時顯示 session 摘要 */
  function close() {
    const s = teardown();
    if (s && s.rounds > 0) showSummary(s);
  }

  LG.modes = {
    MODE_INFO,
    open,
    close,
    current: () => (cur ? { gameId: cur.gameId, mode: cur.mode, variant: cur.variant } : null),
    ctx: () => (cur ? cur.ctx : null),
    instance: () => (cur ? cur.instance : null),
  };
})();


/* ==== src/core/33-router.js ==== */
// LG.router — hash 路由。#/ 首頁；#/game/<id>/<mode>[/<variant>]。見 docs/02-architecture.md §6
(() => {
  const LG = globalThis.LG;
  const MODES = ['tutorial', 'practice', 'real'];
  let current = null;
  let started = false;

  function parse(hash) {
    const h = String(hash || '').replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
    if (parts[0] === 'game' && parts[1]) {
      return { name: 'game', id: parts[1], mode: MODES.includes(parts[2]) ? parts[2] : 'practice', variant: parts[3] || null };
    }
    return { name: 'home' };
  }

  function href(id, mode, variant) {
    if (!id) return '#/';
    return `#/game/${encodeURIComponent(id)}/${mode || 'practice'}${variant ? '/' + encodeURIComponent(variant) : ''}`;
  }

  function render() {
    const route = parse(globalThis.location.hash);
    const app = document.getElementById('app');
    if (route.name === 'game') {
      const def = LG.games[route.id];
      if (!def) {
        LG.ui.toast(`找不到遊戲：${LG.ui.esc(route.id)}`);
        go('#/');
        return;
      }
      const vs = def.variants || [];
      if (vs.length && !vs.some((v) => v.id === route.variant)) route.variant = vs[0].id;
      if (!vs.length) route.variant = null;
      current = route;
      LG.home && LG.home.unmount && LG.home.unmount();
      LG.modes.open(route.id, route.mode, route.variant, app);
    } else {
      current = route;
      LG.modes.close();
      LG.home.render(app);
    }
    LG.events.emit('route:change', { route });
  }

  /** 導向 hash（字串）或 {id, mode, variant} */
  function go(to, mode, variant) {
    const h = typeof to === 'string' && (to.startsWith('#') || to === '') ? (to || '#/') : href(to, mode, variant);
    if (globalThis.location.hash === h) render();
    else globalThis.location.hash = h;
  }

  LG.router = {
    MODES,
    parse,
    href,
    go,
    current: () => current,
    start() {
      if (started) return;
      started = true;
      globalThis.addEventListener('hashchange', render);
      render();
    },
    render,
  };
})();

// 啟動：偵測 reduced motion、localStorage 提示、啟動路由。見 docs/02-architecture.md §1
(() => {
  const LG = globalThis.LG;
  const doc = globalThis.document;

  function boot() {
    const app = doc.getElementById('app');
    if (!app || LG.booted) return;
    LG.booted = true;
    try {
      const mq = globalThis.matchMedia && globalThis.matchMedia('(prefers-reduced-motion: reduce)');
      LG.reducedMotion = !!(mq && mq.matches) || !!LG.store.peek().settings.reducedMotion;
    } catch { LG.reducedMotion = false; }
    if (!LG.store.persistent) setTimeout(() => LG.ui.toast('此瀏覽器無法使用 localStorage：進度不會保存', { ms: 4000 }), 300);
    LG.router.start();
  }

  if (!doc || globalThis.LG_NO_AUTOSTART) return;
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
  LG.boot = boot;
})();

// ============================================================================
// 示範遊戲「猜大小 Hi-Lo」（id: _demo）— 遊戲代理的參考範本，整合階段刪除。
//
// 規則：荷官抽一張牌（每次獨立抽，等於無限副牌）。
//   8 以上（8, 9, 10, J, Q, K, A；7/13）→「大 Hi」贏，賠 4:5（0.8 倍）
//   7 以下（2–7；6/13）              →「小 Lo」贏，賠 11:10（1.1 倍）
//   兩邊的莊家優勢都是 1/13 × 0.4 ≈ 3.08%（機率高的一邊賠得少）。
//
// 這個檔案示範：
//   1. registerGame 的 def 欄位（含 variants、countdown、logic 供單元測試）
//   2. create(ctx) → instance：mount / unmount / tutorialSteps / demo
//   3. 一局流程：ctx.bettingWindow → 扣款 → 發牌 → 結算 → ctx.recordRound → ctx.explain → ctx.nextRound
//   4. LG.Bets + LG.ui.chipTray + LG.ui.betLayer + LG.ui.betBar 的接法
//   5. 練習模式提示（ctx.hints / 'hints:change' / ctx.strategyPanel）
//   6. 咪牌變體（LG.ui.squeezeable）
//   7. 教學 14 步（四段、3 個 action）
// ============================================================================
(() => {
  const { ui, money } = LG;
  const { el, term } = ui;
  const { fmt, round2 } = money;

  // ---------------------------------------------------------------- 規則常數（集中管理）
  const RANKS = '23456789TJQKA';
  const SUITS = 'SHDC';
  const HI_MIN = 8;                     // 牌值 ≥ 8 為「大」
  const PAYS = { hi: 0.8, lo: 1.1 };    // 淨賠倍數
  const T = {                           // 文案集中：中文 / 英文 / 賠率
    hi: { zh: '大', en: 'Hi', odds: '4:5', rule: '8 以上' },
    lo: { zh: '小', en: 'Lo', odds: '11:10', rule: '7 以下' },
  };

  // ---------------------------------------------------------------- 純邏輯（可在 Node 單元測試）
  const rankValue = (r) => RANKS.indexOf(r) + 2;           // 2..14（A = 14）
  const outcomeOf = (card) => (rankValue(card.rank) >= HI_MIN ? 'hi' : 'lo');
  const cardLabel = (c) => `${c.rank === 'T' ? '10' : c.rank}${ui.SUIT[c.suit].symbol}`;

  function drawCard() {
    const rank = LG.rng.pick([...RANKS]);
    const suit = LG.rng.pick([...SUITS]);
    return { rank, suit, id: rank + suit };
  }

  /**
   * 結算。entries = bets.entries()（[[spotId, stake]]）
   * @returns {{outcome, wagered, returned, net, lines:[{spot, stake, result, pay, formula}]}}
   *   returned = 拿回金額（含本金），net = returned − wagered
   */
  function settle(entries, card) {
    const outcome = outcomeOf(card);
    let wagered = 0, returned = 0;
    const lines = entries.map(([spot, stake]) => {
      wagered += stake;
      if (spot === outcome) {
        const pay = round2(stake * PAYS[spot]);
        returned += stake + pay;
        return { spot, stake, result: 'win', pay,
          formula: `${T[spot].zh} ${fmt(stake)} × ${PAYS[spot]} = +${fmt(pay)}（拿回 ${fmt(stake + pay)}）` };
      }
      return { spot, stake, result: 'lose', pay: -stake, formula: `${T[spot].zh} ${fmt(stake)} → −${fmt(stake)}` };
    });
    wagered = round2(wagered); returned = round2(returned);
    return { outcome, wagered, returned, net: round2(returned - wagered), lines };
  }

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: '_demo',
    category: 'table',
    order: 99,
    demo: true,                                   // 擴充欄位：首頁標「示範」
    name: { zh: '猜大小', en: 'Hi-Lo (Demo)' },
    summary: '抽一張牌，猜 8 以上還是 7 以下。框架示範用。',
    houseEdge: [
      { bet: { zh: '大', en: 'Hi' }, edge: 3.08, best: true },
      { bet: { zh: '小', en: 'Lo' }, edge: 3.08 },
    ],
    limits: { real: { min: 25, max: 500 }, practice: { min: 10, max: 100000 } },
    denoms: [10, 25, 50, 100, 500, 1000],
    countdown: 10,                                // 擴充欄位：真實模式倒數秒數（進場說明用）
    variants: [
      { id: 'classic', name: { zh: '標準', en: 'Classic' } },
      { id: 'squeeze', name: { zh: '咪牌', en: 'Squeeze' } },
    ],
    logic: { settle, outcomeOf, rankValue, PAYS },  // 擴充欄位：給單元測試用

    create(ctx) {
      // ---- 狀態（每次 create 都是新的；切換模式/變體會重新 create）
      const state = { phase: 'idle', card: null, staked: 0, rounds: 0 };
      const bets = new LG.Bets({
        min: ctx.limits.min, max: ctx.limits.max,
        labels: { hi: '大 Hi', lo: '小 Lo' },
      });
      let root, tableEl, cardSlot, hintEl, tray, layer, bar;

      // ---- 桌面：一次建好，之後只更新牌區與籌碼堆
      function spot(id) {
        return el('div.lg-spot.demo-spot', { dataset: { bet: id } }, [
          el('span.lg-spot__zh', { text: T[id].zh }),
          el('span.lg-spot__en', { text: T[id].en }),
          el('span.lg-spot__odds', { text: T[id].odds }),
          el('span.demo-spot__rule', { text: T[id].rule }),
        ]);
      }
      function buildTable() {
        tableEl = el('div.lg-table.demo-table', [
          el('div.lg-table__label', { text: 'Dealer 荷官' }),
          cardSlot = el('div.lg-hand.demo-cardslot', { dataset: { role: 'card' } }),
          el('div.demo-rule', { html: `8 以上 = 大 <i class="en">Hi</i> · 7 以下 = 小 <i class="en">Lo</i>` }),
          el('div.demo-spots', [spot('hi'), spot('lo')]),
        ]);
        const actions = el('div.lg-actions', { dataset: { dealSlot: '' } }); // 框架把「發牌 Deal」按鈕放這裡
        const chips = el('div');
        const barEl = el('div');
        hintEl = el('div.lg-hint.demo-hint', { hidden: true });
        root.append(tableEl, hintEl, actions, chips, barEl);

        tray = ui.chipTray(chips, { denoms: ctx.denoms, selected: ctx.isReal ? 25 : 10 });
        layer = ui.betLayer(tableEl, { bets, chipTray: tray, gameId: ctx.gameId });
        bar = ui.betBar(barEl, { bets, layer });
        showCard(null);
      }

      /** 牌區：null = 蓋著的空位 */
      function showCard(card, { faceDown = false } = {}) {
        cardSlot.innerHTML = '';
        const c = ui.card(card, { faceDown: faceDown || !card, size: 'lg' });
        cardSlot.appendChild(c);
        return c;
      }
      function markSpots(outcome) {
        tableEl.querySelectorAll('[data-bet]').forEach((s) => {
          s.classList.toggle('is-win', !!outcome && s.dataset.bet === outcome);
          s.classList.toggle('is-lose', !!outcome && s.dataset.bet !== outcome);
        });
      }

      // ---- 練習提示
      function paintHints() {
        hintEl.hidden = !ctx.hints;
        hintEl.innerHTML = '提示：大、小的莊家優勢一樣（3.08%）。大比較常中，但只賠 0.8 倍。<b>不要兩邊同時押</b>——一定虧。';
      }

      // ---- 一局流程
      function startRound() {
        if (!ctx.alive()) return;
        state.phase = 'betting';
        markSpots(null);
        showCard(null);
        // 真實：倒數 → No more bets；練習/教學：顯示「發牌」按鈕。關閉時框架會 bets.lock()
        ctx.bettingWindow({ bets, onClose: onNoMoreBets });
      }

      async function onNoMoreBets({ ok, validation }) {
        if (!ok) {
          // 真實模式倒數結束但沒下注 / 不合法 → 這局不發牌，解鎖等下一局
          bets.unlock();
          if (bets.total() > 0) ui.toast(validation.zh, { type: 'warn' });
          ctx.nextRound(startRound);
          return;
        }
        // No more bets 後籌碼才真正離手：扣款
        state.staked = bets.total();
        ctx.bank.debit(state.staked);
        state.phase = 'dealing';
        ctx.dealer.say('發牌', 'Dealing');
        const card = drawCard();
        await revealCard(card);
        if (!ctx.alive()) return;           // 使用者中途離開
        finishRound(card);
      }

      function revealCard(card) {
        const cEl = showCard(card, { faceDown: true });
        if (ctx.variant === 'squeeze') {
          ctx.dealer.say('請開牌', 'Card please');
          return new Promise((resolve) => ui.squeezeable(cEl, card, { onRevealed: () => resolve() }));
        }
        return ctx.wait(350).then(() => ui.flip(cEl, card));
      }

      function finishRound(card) {
        state.card = card;
        const r = settle(bets.entries(), card);
        ctx.bank.credit(r.returned);          // 拿回（含本金）
        state.staked = 0;
        markSpots(r.outcome);
        ctx.dealer.say(`${cardLabel(card)}，${T[r.outcome].zh}！`, `${T[r.outcome].en} wins`);

        ctx.recordRound({ wagered: r.wagered, net: r.net, outcome: r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'push' });
        ctx.explain({                          // 練習/教學 → resultPanel；真實 → 只閃金額
          hand: `荷官抽到 <b>${cardLabel(card)}</b>（牌值 ${rankValue(card.rank)}）`,
          result: `${T[r.outcome].zh} <i class="en">${T[r.outcome].en.toUpperCase()} WINS</i>`,
          formula: r.lines.map((l) => l.formula).join('<br>') + `<br>淨 <b>${money.fmtSigned(r.net)}</b>`,
          why: `${rankValue(card.rank)} ${r.outcome === 'hi' ? '≥ 8 所以是大' : '≤ 7 所以是小'}。`
            + (r.outcome === 'hi' ? '大比較常出現（7/13），所以只賠 0.8 倍。' : '小比較少出現（6/13），所以賠 1.1 倍。'),
        });

        state.rounds += 1;
        state.phase = 'settled';
        bets.unlock();
        bets.clear();                          // 上一注已存進 bets.last → 「重複上注」可用
        ctx.checkBroke();                      // 真實模式餘額 < 最低注 → 覆蓋層（nextRound 會等重置）
        ctx.nextRound(startRound);             // 真實：3 秒後；練習/教學：立即
      }

      // ---- 教學用：instance.demo.* 讓 step.setup 擺出示範狀態
      const demo = {
        showCard(id) { showCard({ rank: id[0], suit: id[1], id }); },
        showBanner(zh, en) { ctx.dealer.say(zh, en); },
        ensureBetting() { if (state.phase !== 'betting') startRound(); },
      };

      // ---- 教學步驟（14 步：layout 4、flow 4、payout 3、strategy 3；action 3 個）
      function tutorialSteps() {
        return [
          // ===== layout 桌面

            highlight: ['.demo-spots'] },
          { id: 'strategy-budget', section: 'strategy', title: '預算',
            body: '<p>今晚只帶 RM 500，輸完就走。上一局的結果不會影響下一張牌。</p>',
            highlight: ['.lg-topbar .lg-balance'] },

      }

      // ---- instance
      return {
        bets,                                   // 教學 action.check 讀取
        state,
        tray: () => tray,
        demo,
        mount(el0) {
          root = el0;
          buildTable();
          paintHints();
          ctx.on('hints:change', paintHints);   // ctx.on 會在卸載時自動解除
          if (ctx.isPractice) {
            ctx.strategyPanel(ui.table([['注', '賠率', '優勢'], ['大 Hi', '4:5', '3.08%'], ['小 Lo', '11:10', '3.08%']], { caption: '兩邊優勢相同' }));
          }
          root.dataset.ready = '1';
          startRound();
        },
        unmount() {
          // 局中離開：退回已扣的注金（ctx.later/wait 的計時器由框架清除）
          if (state.staked > 0) { ctx.bank.credit(state.staked); state.staked = 0; }
          if (layer) layer.destroy();
          if (bar) bar.destroy();
        },
        tutorialSteps,
      };
    },
  });
})();

(() => {

  const B = LG.baccarat;

  // ---------------------------------------------------------------- 文案 / 常數（集中管理）

      tiger: { zh: '老虎', en: 'TIGER', odds: '12:1 / 20:1', rule: '莊 6 點贏（2 張 / 3 張）' },
      bigTiger: { zh: '大老虎', en: 'BIG TIGER', odds: '50:1', rule: '莊 3 張 6 點贏' },
      smallTiger: { zh: '小老虎', en: 'SMALL TIGER', odds: '22:1', rule: '莊 2 張 6 點贏' },
      tigerTie: { zh: '老虎和', en: 'TIGER TIE', odds: '35:1', rule: '6 點和局' },
      tigerPair: { zh: '老虎對', en: 'TIGER PAIR', odds: '4 / 20 / 100:1', rule: '單對 / 雙對 / 同點雙對' },
    },
    b6note: { zh: '莊 6 點贏只賠一半', en: 'Banker wins on 6 pays 1/2' },
    outcome: {
      P: { zh: '閒贏', en: 'Player wins', big: 'PLAYER WINS' },
      B: { zh: '莊贏', en: 'Banker wins', big: 'BANKER WINS' },
      T: { zh: '和局', en: 'Tie', big: 'TIE' },
    },
    call: {
      bets: ['請下注', 'Place your bets'],
      dealing: ['發牌', 'Dealing'],
      squeeze: ['請開牌', 'Card please'],
      shuffle: ['洗牌', 'Shuffling'],
      natural: ['天牌', 'Natural'],
      pDraw: ['閒補牌', 'Player draws'],
      bDraw: ['莊補牌', 'Banker draws'],
    },
    hint: {
      comm: '建議：押<b>莊</b>（優勢最低 1.06%）。和、對子是高風險旁注。',
      nocomm: '建議：免佣桌押<b>閒</b>（1.24%）或<b>莊</b>（1.46%）——莊 6 點贏只賠一半，所以閒反而略優。旁注都是高風險。',
      risk: '高風險',
    },
    road: {
      title: '路單 <i class="en">Roadmap</i> · 珠盤路 <i class="en">Bead Plate</i>',
      note: '只是紀錄，不能預測',
    },
    // 教學互動題：answer = 正確選項
    quiz: {
      commission: { q: '押莊 RM 100 贏了（抽 5% 佣），拿回多少（含本金）？', options: ['RM 190', 'RM 195', 'RM 200'], answer: 'RM 195',
        wrong: '再算一次：RM 100 × 0.95 = RM 95 淨贏，加上本金 RM 100' },
      super6: { q: '免佣桌押莊 RM 100，莊以 6 點贏，拿回多少（含本金）？', options: ['RM 150', 'RM 195', 'RM 200'], answer: 'RM 150',
        wrong: '莊 6 點贏只賠一半：RM 100 × 0.5 = RM 50，加本金 RM 100' },
      tie: { q: '押閒 RM 100 + 和 RM 10，開出和局，淨輸贏是多少？', options: ['−RM 20', '+RM 80', '+RM 90'], answer: '+RM 80',
        wrong: '和局時閒注退回（RM 0），和注 RM 10 × 8 = +RM 80' },
    },
  };

  /** 莊家優勢（docs/05-game-rules/00-common.md §4） */
  const EDGE = {
    bankerComm: 1.06, player: 1.24, bankerNoComm: 1.46, tie: 14.36, pair: 10.36,
    super6: 29.98, tiger: 7.66, bigTiger: 6.03, smallTiger: 5.36, tigerTie: 9.9, tigerPair: 8.9,
  };
  const SPOT_EDGE = {
    tie: EDGE.tie, playerPair: EDGE.pair, bankerPair: EDGE.pair, super6: EDGE.super6, tiger: EDGE.tiger,
    bigTiger: EDGE.bigTiger, smallTiger: EDGE.smallTiger, tigerTie: EDGE.tigerTie, tigerPair: EDGE.tigerPair,
  };

  /** 旁注列（依變體）；對子與和在所有變體都有 */
  const SIDES = {
    classic: [], squeeze: [], super6: ['super6'],
    tiger: ['tiger', 'bigTiger', 'smallTiger', 'tigerTie', 'tigerPair'],
  };
  const noComm = (v) => v === 'super6' || v === 'tiger';
  /** 此變體所有下注格 */
  const spotsFor = (v) => ['bankerPair', 'playerPair', 'tie', 'banker', 'player', ...(SIDES[v] || [])];

  /** 真實模式每格限額（規格 §8：主注 50–5,000；和 10–500；對子/老虎/Super 6 旁注 10–1,000） */
  const REAL_RULES = {
    player: { min: 50, max: 5000 }, banker: { min: 50, max: 5000 }, tie: { min: 10, max: 500 },
    playerPair: { min: 10, max: 1000 }, bankerPair: { min: 10, max: 1000 }, super6: { min: 10, max: 1000 },
    tiger: { min: 10, max: 1000 }, bigTiger: { min: 10, max: 1000 }, smallTiger: { min: 10, max: 1000 },
    tigerTie: { min: 10, max: 1000 }, tigerPair: { min: 10, max: 1000 },
  };

  // ---------------------------------------------------------------- 純邏輯（單元測試用 def.logic）
  const cardLabel = (c) => `${c.rank === 'T' ? '10' : c.rank}${ui.SUIT[c.suit].symbol}`;
  const handText = (cards) => cards.map(cardLabel).join(' ');

  /** 建立下注模型。mode: 'real' → spotRules；其他 → 每格 limits.min–limits.max */
  function makeBets(mode, limits = { min: 10, max: 100000 }) {
    const labels = {};
    for (const [id, s] of Object.entries(T.spots)) labels[id] = `${s.zh} ${s.en}`;
    if (mode === 'real') return new LG.Bets({ min: 0, max: Infinity, spotRules: REAL_RULES, labels });
    return new LG.Bets({ min: 0, max: Infinity, perSpotMin: limits.min, perSpotMax: limits.max, labels });
  }

  /** 莊第三張的規則文字（莊兩張點數 b2） */
  function bankerRuleText(b2) {
    return ['一律補', '一律補', '一律補', '閒第三張不是 8 就補', '閒第三張 2–7 補', '閒第三張 4–7 補', '閒第三張 6–7 補', '停'][b2] || '停';
  }

  /** 補牌理由（繁中句子陣列）— 練習「為什麼」與教學用 */
  function drawReason(coup) {
    const p2 = B.total(coup.player.slice(0, 2));
    const b2 = B.total(coup.banker.slice(0, 2));
    const out = [];
    if (coup.natural) {
      const who = [p2 >= 8 ? `閒 ${p2}` : '', b2 >= 8 ? `莊 ${b2}` : ''].filter(Boolean).join('、');
      out.push(`${who} 點是天牌 <i class="en">Natural</i>，雙方都不補牌。`);
      return out;
    }
    out.push(p2 <= 5 ? `閒兩張 ${p2} 點 → 補牌（閒 0–5 補）。` : `閒兩張 ${p2} 點 → 停牌（閒 6–7 停）。`);
    const drew = coup.banker.length === 3;
    if (coup.player.length === 2) {
      out.push(`閒沒補牌，莊兩張 ${b2} 點 → ${drew ? '補牌（莊 0–5 補）' : '停牌（莊 6–7 停）'}。`);
    } else {
      const x = B.point(coup.player[2]);
      out.push(`莊兩張 ${b2} 點、閒第三張 ${x} 點 → 查表「莊 ${b2}：${bankerRuleText(b2)}」→ ${drew ? '補牌' : '停牌'}。`);
    }
    return out;
  }

  /** 單條賠付算式：贏寫淨贏與拿回，push 寫退回，輸寫 −本金 */
  function lineFormula(l) {
    const nm = l.name.zh;
    if (l.result === 'win') return `${nm} ${fmt(l.stake)} × ${l.odds} = ${fmtSigned(l.pay)}（拿回 ${fmt(l.returned)}）`;
    if (l.result === 'push') return `${nm} ${fmt(l.stake)} 和局退回 <i class="en">Push</i> → RM 0（拿回 ${fmt(l.stake)}）`;
    return `${nm} ${fmt(l.stake)} 輸 → ${fmtSigned(-l.stake)}`;
  }

  /** ctx.explain 的四段內容 */
  function describe(coup, r) {
    const o = T.outcome[coup.outcome];
    const pairs = [coup.playerPair && '閒對子', coup.bankerPair && '莊對子'].filter(Boolean);
    const hand = `閒 <b>${coup.pTotal}</b>（${handText(coup.player)}） vs 莊 <b>${coup.bTotal}</b>（${handText(coup.banker)}）`
      + (pairs.length ? `<br>${pairs.join('、')}` : '');
    const notes = [coup.natural && '天牌', coup.bankerWinsWith6 && `莊以 6 點贏（${coup.bankerCards} 張）`].filter(Boolean);
    const result = `${o.zh} <i class="en">${o.big}</i>${notes.length ? `（${notes.join('，')}）` : ''}`;
    const formula = r.lines.map(lineFormula).join('<br>') + `<br>淨 <b>${fmtSigned(r.net)}</b>`;
    const cmp = coup.outcome === 'T' ? `閒 ${coup.pTotal} = 莊 ${coup.bTotal}，和局：莊/閒主注退回。`
      : `${coup.outcome === 'P' ? `閒 ${coup.pTotal} > 莊 ${coup.bTotal}` : `莊 ${coup.bTotal} > 閒 ${coup.pTotal}`}，${o.zh}。`;
    const lineWhy = r.lines.filter((l) => l.spot !== 'player' && l.spot !== 'banker').map((l) => `${l.name.zh}：${l.why}。`);
    const why = [...drawReason(coup), cmp, ...lineWhy].join('<br>');
    return { hand, result, formula, why };
  }

  /** 珠盤路格位：由上而下、由左而右（6 行）。至少 minCols 欄。→ [{col,row,entry|null}] */
  function beadCells(history, { rows = 6, minCols = 12 } = {}) {
    const cols = Math.max(minCols, Math.ceil(history.length / rows) + 1);
    const out = [];
    for (let i = 0; i < cols * rows; i++) out.push({ col: Math.floor(i / rows), row: i % rows, entry: history[i] || null });
    return out;
  }

  /** 路單紀錄一筆 */
  const roadEntry = (coup) => ({ o: coup.outcome, pp: coup.playerPair, bp: coup.bankerPair, p: coup.pTotal, b: coup.bTotal });

  /** 教學示範用的路單（固定，不是預測） */
  const DEMO_ROAD = 'B P P T B B P B P B B P T P B B P P B'.split(' ').map((o, i) => ({ o, pp: i === 4, bp: i === 9, p: 0, b: 0 }));

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: 'baccarat',
    category: 'table',
    order: 1,
    name: T.name,
    summary: T.summary,
    houseEdge: [
      { bet: { zh: '莊（抽 5% 佣）', en: 'Banker' }, edge: EDGE.bankerComm, best: true },
      { bet: { zh: '閒', en: 'Player' }, edge: EDGE.player },
      { bet: { zh: '莊（免佣 Super 6 / 老虎，6 點贏賠一半）', en: 'Banker (no commission)' }, edge: EDGE.bankerNoComm },
      { bet: { zh: '和 8:1', en: 'Tie' }, edge: EDGE.tie },
      { bet: { zh: '閒對 / 莊對 11:1', en: 'Pair' }, edge: EDGE.pair },
      { bet: { zh: 'Super 6 12:1', en: 'Super 6' }, edge: EDGE.super6 },
      { bet: { zh: '老虎', en: 'Tiger' }, edge: EDGE.tiger, approx: true },
      { bet: { zh: '大老虎', en: 'Big Tiger' }, edge: EDGE.bigTiger, approx: true },
      { bet: { zh: '小老虎', en: 'Small Tiger' }, edge: EDGE.smallTiger, approx: true },
      { bet: { zh: '老虎和', en: 'Tiger Tie' }, edge: EDGE.tigerTie, approx: true },
      { bet: { zh: '老虎對', en: 'Tiger Pair' }, edge: EDGE.tigerPair, approx: true },
    ],
    limits: { real: { min: 50, max: 5000 }, practice: { min: 10, max: 100000 } },
    denoms: [10, 25, 50, 100, 500, 1000],
    countdown: 15,
    variants: [
      { id: 'classic', name: { zh: '傳統', en: 'Commission' } },
      { id: 'super6', name: { zh: '免佣', en: 'Super 6' } },
      { id: 'tiger', name: { zh: '老虎', en: 'Tiger' } },
      { id: 'squeeze', name: { zh: '咪牌', en: 'Squeeze' } },
    ],
    logic: {
      T, EDGE, SPOT_EDGE, SIDES, REAL_RULES, spotsFor, noComm, makeBets, drawReason, bankerRuleText,
      lineFormula, describe, beadCells, roadEntry, cardLabel,
    },

    create(ctx) {
      const variant = SIDES[ctx.variant] ? ctx.variant : 'classic';
      const isSqueeze = variant === 'squeeze';
      const state = {
        phase: 'idle', rounds: 0, staked: 0, road: [], last: null,
        shown: { player: [], banker: [] }, squeezers: new Set(), quiz: {}, demoSqueezed: false,
        shoe: null,
      };
      const bets = makeBets(ctx.mode, ctx.limits);
      let root, tableEl, hintEl, tray, layer, bar, roadEl, roadCount;
      const spotEls = new Map();
      const hands = {};

      function newShoe() {
        state.shoe = LG.cards.newShoe(8, { cutCard: 14 });
        B.burnStart(state.shoe);
      }
      newShoe();

      // ---------------------------------------------------------- 桌面
      function spotEl(id) {
        const s = T.spots[id];
        const main = id === 'player' || id === 'banker';
        const odds = id === 'banker' && !noComm(variant) ? s.oddsComm : s.odds;
        const kids = [
          el('span.lg-spot__zh', { text: s.zh }),
          el('span.lg-spot__en', { text: s.en }),
          el('span.lg-spot__odds', { text: odds }),
        ];
        if (s.rule) kids.push(el('span.bac-spot__rule', { text: s.rule }));
        if (id === 'banker' && noComm(variant)) {
          kids.push(el('span.bac-note', { html: `${T.b6note.en}<br><small>${T.b6note.zh}</small>` }));
        }
        if (SPOT_EDGE[id]) kids.push(el('span.bac-risk', { text: `${T.hint.risk} · 優勢 ${SPOT_EDGE[id]}%` }));
        const e = el('div', { class: ['lg-spot', 'bac-spot', `bac-spot--${id}`, main && 'bac-spot--main'], dataset: { bet: id } }, kids);
        spotEls.set(id, e);
        return e;
      }

      function handEl(side) {
        const s = T.side[side];
        const total = el('span.lg-hand__total.bac-hand__total', { dataset: { role: `${side}-total` }, text: '–' });
        const cards = el('div.lg-hand.bac-hand__cards');
        const box = el('div', { class: ['bac-hand', s.cls], dataset: { side } }, [
          el('div.bac-hand__head', [el('span.bac-hand__name', { html: `${s.zh} <i class="en">${s.en.toUpperCase()}</i>` }), total]),
          cards,
        ]);
        hands[side] = { box, cards, total };
        return box;
      }

      function buildTable() {
        const sides = SIDES[variant];
        roadEl = el('div.bac-bead', { dataset: { role: 'bead' } });
        roadCount = el('span.bac-road__count');
        tableEl = el('div.lg-table.bac-table', { dataset: { variant } }, [
          el('div.lg-table__label', { html: '荷官 <i class="en">Dealer</i>' }),
          el('div.bac-cards', [handEl('banker'), handEl('player')]),
          el('div.bac-pairs', [spotEl('bankerPair'), spotEl('playerPair')]),
          el('div.bac-main.lg-table__line', [spotEl('tie'), spotEl('banker'), spotEl('player')]),
          sides.length ? el('div', { class: ['bac-sides', `bac-sides--${sides.length}`] }, sides.map(spotEl)) : null,
          el('div.bac-road', [
            el('div.bac-road__head', [el('span.bac-road__title', { html: T.road.title }), roadCount]),
            el('div.bac-road__scroll', [roadEl]),
            el('div.bac-road__note', { text: `${T.road.note}（紅 = 莊、藍 = 閒、綠 = 和；小點 = 對子）` }),
          ]),
        ]);
        hintEl = el('div.lg-hint.bac-hint', { hidden: true });
        const actions = el('div.lg-actions', { dataset: { dealSlot: '' } });
        const chips = el('div');
        const barEl = el('div');
        root.append(tableEl, hintEl, actions, chips, barEl);
        tray = ui.chipTray(chips, { denoms: ctx.denoms, selected: ctx.isReal ? 50 : 10 });
        layer = ui.betLayer(tableEl, { bets, chipTray: tray, gameId: ctx.gameId });
        bar = ui.betBar(barEl, { bets, layer });
        bets.subscribe(() => { if (state.phase === 'betting' && bets.total() > 0) clearMarks(); });
      }

      // ---------------------------------------------------------- 牌區
      function clearHands() {
        state.squeezers.forEach((h) => h.destroy());
        state.squeezers.clear();
        for (const side of ['player', 'banker']) {
          hands[side].cards.innerHTML = '';
          hands[side].box.classList.remove('is-winner');
          state.shown[side] = [];
        }
        paintTotals();
      }
      function paintTotals() {
        for (const side of ['player', 'banker']) {
          const list = state.shown[side];
          hands[side].total.textContent = list.length ? String(B.total(list)) : '–';
          hands[side].total.dataset.total = list.length ? String(B.total(list)) : '';
        }
      }
      function addCard(side, card, { faceDown = true, third = false } = {}) {
        const e = ui.card(card, { faceDown, size: 'md' });
        if (third) e.classList.add('bac-card--third');
        hands[side].cards.appendChild(e);
        if (!faceDown) { state.shown[side].push(card); paintTotals(); }
        return e;
      }
      function revealed(side, card) { state.shown[side].push(card); paintTotals(); }

      function clearMarks() {
        spotEls.forEach((e) => e.classList.remove('is-win', 'is-lose'));
        for (const side of ['player', 'banker']) hands[side].box.classList.remove('is-winner');
      }
      function markSpots(coup, r) {
        const winMain = { P: 'player', B: 'banker', T: 'tie' }[coup.outcome];
        spotEls.forEach((e, id) => {
          const line = r.lines.find((l) => l.spot === id);
          e.classList.toggle('is-win', line ? line.result === 'win' : id === winMain);
          e.classList.toggle('is-lose', !!line && line.result === 'lose');
        });
        if (coup.outcome !== 'T') hands[winMain].box.classList.add('is-winner');
      }

      // ---------------------------------------------------------- 路單（珠盤路）
      function paintRoad() {
        roadEl.innerHTML = '';
        for (const c of beadCells(state.road)) {
          const x = c.entry;
          const cell = el('div', { class: ['bac-bead__c', x && `is-${x.o}`], dataset: x ? { outcome: x.o } : {} });
          if (x) {
            cell.textContent = { B: '莊', P: '閒', T: '和' }[x.o];
            if (x.bp) cell.appendChild(el('span.bac-bead__bp', { title: '莊對 Banker pair' }));
            if (x.pp) cell.appendChild(el('span.bac-bead__pp', { title: '閒對 Player pair' }));
          }
          roadEl.appendChild(cell);
        }
        const n = (o) => state.road.filter((x) => x.o === o).length;
        roadCount.innerHTML = `莊 ${n('B')} · 閒 ${n('P')} · 和 ${n('T')}`;
        const sc = roadEl.parentElement;
        if (sc && state.road.length) { try { sc.scrollLeft = sc.scrollWidth; } catch { /* */ } }
      }

      // ---------------------------------------------------------- 練習提示
      function paintHints() {
        const on = !!ctx.hints;
        hintEl.hidden = !on;
        hintEl.innerHTML = noComm(variant) ? T.hint.nocomm : T.hint.comm;
        tableEl.classList.toggle('bac-hints-on', on);
      }
      function edgeTable() {
        const rows = [['注 <i class="en">Bet</i>', '賠率', '優勢']];
        if (noComm(variant)) rows.push(['閒 Player', '1:1', `${EDGE.player}%`], ['莊 Banker', '1:1（6 點贏 0.5:1）', `${EDGE.bankerNoComm}%`]);
        else rows.push(['莊 Banker', '0.95:1', `<b>${EDGE.bankerComm}%</b>`], ['閒 Player', '1:1', `${EDGE.player}%`]);
        rows.push(['和 Tie', '8:1', `${EDGE.tie}%`], ['對子 Pair', '11:1', `${EDGE.pair}%`]);
        if (variant === 'super6') rows.push(['Super 6', '12:1', `${EDGE.super6}%`]);
        if (variant === 'tiger') {
          for (const id of SIDES.tiger) rows.push([`${T.spots[id].zh} ${T.spots[id].en}`, T.spots[id].odds, `≈${SPOT_EDGE[id]}%`]);
        }
        return ui.table(rows, { caption: '莊家優勢 <i class="en">House edge</i>（越低越划算）' });
      }
      function thirdCardTable() {
        return ui.table([
          ['莊兩張', '閒沒補牌', '閒有補牌（看閒第三張）'],
          ['0–2', '補', '一律補'], ['3', '補', '閒第三張 ≠ 8 補'], ['4', '補', '閒第三張 2–7 補'],
          ['5', '補', '閒第三張 4–7 補'], ['6', '停', '閒第三張 6–7 補'], ['7', '停', '停'],
        ], { caption: '莊補第三張 <i class="en">Banker third card</i>（8–9 天牌不補）' });
      }
      const html = (node) => (node && node.outerHTML) || '';

      // ---------------------------------------------------------- 一局流程
      function startRound() {
        if (!ctx.alive()) return;
        state.phase = 'betting';
        ctx.bettingWindow({ bets, onClose: onNoMoreBets });
      }

      async function onNoMoreBets({ ok, validation }) {
        if (!ok) {
          bets.unlock();
          if (bets.total() > 0) ui.toast(validation.zh, { type: 'warn' });
          ctx.nextRound(startRound);
          return;
        }
        state.staked = bets.total();
        ctx.bank.debit(state.staked);
        state.phase = 'dealing';
        clearMarks();
        clearHands();
        if (state.shoe.needsShuffle()) {
          ctx.dealer.say(...T.call.shuffle);
          newShoe();
          state.road = [];
          paintRoad();
          await ctx.wait(700);
          if (!ctx.alive()) return;
        }
        ctx.dealer.say(...T.call.dealing);
        const coup = B.dealCoup(state.shoe);
        const done = isSqueeze ? await playSqueeze(coup) : await playNormal(coup);
        if (!done || !ctx.alive()) return;
        await callCoup(coup);
        if (!ctx.alive()) return;
        finishRound(coup);
      }

      /** 一般發牌：閒、莊、閒、莊逐張翻開，再依規則補第三張 */
      async function playNormal(coup) {
        const seq = [['player', coup.player[0]], ['banker', coup.banker[0]], ['player', coup.player[1]], ['banker', coup.banker[1]]];
        for (const [side, c] of seq) {
          const e = addCard(side, c);
          await ctx.wait(220);
          if (!ctx.alive()) return false;
          await ui.flip(e, c);
          if (!ctx.alive()) return false;
          revealed(side, c);
        }
        if (coup.natural) { ctx.dealer.say(...T.call.natural); await ctx.wait(600); }
        for (const side of ['player', 'banker']) {
          const c = coup[side][2];
          if (!c) continue;
          ctx.dealer.say(...(side === 'player' ? T.call.pDraw : T.call.bDraw));
          await ctx.wait(450);
          if (!ctx.alive()) return false;
          const e = addCard(side, c, { third: true });
          await ctx.wait(200);
          await ui.flip(e, c);
          if (!ctx.alive()) return false;
          revealed(side, c);
        }
        return true;
      }

      /** 咪牌時把牌區捲進畫面（按「發牌」後畫面通常在下方） */
      function showCards() {
        const box = tableEl.querySelector('.bac-cards');
        if (box && box.scrollIntoView) { try { box.scrollIntoView({ block: 'center' }); } catch { /* */ } }
      }
      /** 咪牌：牌蓋著發，玩家用 squeezeable 掀；全部掀完才繼續 */
      function squeeze(side, c, e) {
        return new Promise((resolve) => {
          const h = ui.squeezeable(e, c, {
            onRevealed: () => { state.squeezers.delete(h); revealed(side, c); resolve(); },
          });
          state.squeezers.add(h);
        });
      }
      async function playSqueeze(coup) {
        state.phase = 'squeeze';
        const seq = [['player', coup.player[0]], ['banker', coup.banker[0]], ['player', coup.player[1]], ['banker', coup.banker[1]]];
        const els = [];
        for (const [side, c] of seq) {
          els.push([side, c, addCard(side, c)]);
          await ctx.wait(180);
          if (!ctx.alive()) return false;
        }
        ctx.dealer.say(...T.call.squeeze);
        showCards();
        await Promise.all(els.map(([side, c, e]) => squeeze(side, c, e)));
        if (!ctx.alive()) return false;
        if (coup.natural) { ctx.dealer.say(...T.call.natural); await ctx.wait(600); }
        for (const side of ['player', 'banker']) {
          const c = coup[side][2];
          if (!c) continue;
          const [zh, en] = side === 'player' ? T.call.pDraw : T.call.bDraw;
          const e = addCard(side, c, { third: true });
          ctx.dealer.say(`${zh}，${T.call.squeeze[0]}`, `${en} · ${T.call.squeeze[1]}`);
          showCards();
          await squeeze(side, c, e);
          if (!ctx.alive()) return false;
        }
        state.phase = 'dealing';
        return true;
      }

      /** 唱牌：閒 X 點 → 莊 Y 點 → 宣布結果 */
      async function callCoup(coup) {
        ctx.dealer.say(`閒 ${coup.pTotal} 點`, `Player ${coup.pTotal}`);
        await ctx.wait(550);
        if (!ctx.alive()) return;
        ctx.dealer.say(`莊 ${coup.bTotal} 點`, `Banker ${coup.bTotal}`);
        await ctx.wait(550);
        if (!ctx.alive()) return;
        const o = T.outcome[coup.outcome];
        ctx.dealer.say(o.zh, o.en);
      }

      function finishRound(coup) {
        const r = B.settle(bets.entries(), coup, variant);
        ctx.bank.credit(r.returned);
        state.staked = 0;
        state.road.push(roadEntry(coup));
        paintRoad();
        markSpots(coup, r);
        ctx.recordRound({ wagered: r.wagered, net: r.net, outcome: r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'push' });
        ctx.explain({ ...describe(coup, r), net: r.net });
        state.rounds += 1;
        state.last = { coup, r };
        state.phase = 'settled';
        bets.unlock();
        bets.clear();
        ctx.checkBroke();
        ctx.nextRound(startRound);
      }

      // ---------------------------------------------------------- 教學互動題（事件委派）
      function onQuiz(ev) {
        const b = ev.target && ev.target.closest ? ev.target.closest('[data-bac-quiz]') : null;
        if (!b) return;
        const q = b.dataset.bacQuiz;
        state.quiz[q] = b.dataset.answer;
        const ok = b.dataset.answer === T.quiz[q].answer;
        b.parentElement.querySelectorAll('[data-bac-quiz]').forEach((x) => x.classList.remove('is-right', 'is-wrong'));
        b.classList.add(ok ? 'is-right' : 'is-wrong');
      }
      const quizHtml = (q) => `<p>${T.quiz[q].q}</p><div class="bac-quiz">${T.quiz[q].options
        .map((o) => `<button type="button" class="lg-btn lg-btn--sm bac-quiz__opt" data-bac-quiz="${q}" data-answer="${o}">${o}</button>`).join('')}</div>`;
      const quizCheck = (q) => (inst) => {
        const a = inst.state.quiz[q];
        if (a === T.quiz[q].answer) return true;
        return a ? T.quiz[q].wrong : '點選一個答案';
      };

      // ---------------------------------------------------------- 教學示範
      const busy = () => state.phase === 'dealing' || state.phase === 'squeeze';
      const demo = {
        showBanner(zh, en) { ctx.dealer.say(zh, en); },
        ensureBetting() { if (state.phase !== 'betting' && !busy()) startRound(); },
        /** 擺一手指定牌（前兩張，其餘依規則由 extra 補）並翻開 */
        showCoup(p, b, extra = '') {
          if (busy()) return null;
          const shoe = LG.cards.newShoe(1).stack(extra || '2S 3S');
          const coup = B.resolveCoup(LG.cards.parseMany(p), LG.cards.parseMany(b), shoe);
          clearMarks();
          clearHands();
          coup.player.forEach((c, i) => addCard('player', c, { faceDown: false, third: i === 2 }));
          coup.banker.forEach((c, i) => addCard('banker', c, { faceDown: false, third: i === 2 }));
          return coup;
        },
        /** 牌序示範：閒、莊、閒、莊（標號） */
        showOrder() {
          const coup = demo.showCoup('4S 3H', '9C KD');
          if (!coup) return;
          const order = [['player', 0, 1], ['banker', 0, 2], ['player', 1, 3], ['banker', 1, 4]];
          for (const [side, i, n] of order) {
            const c = hands[side].cards.children[i];
            if (c) c.appendChild(el('span.bac-order', { text: String(n) }));
          }
        },
        fillRoad() { if (!state.road.length) { state.road = DEMO_ROAD.slice(); paintRoad(); } },
        /** 咪牌練習：閒位放一張可拖曳的蓋牌 */
        squeezeCard() {
          if (busy()) return;
          clearMarks();
          clearHands();
          const c = LG.cards.parse('9H');
          const e = addCard('player', c);
          const h = ui.squeezeable(e, c, { onRevealed: () => { state.squeezers.delete(h); state.demoSqueezed = true; revealed('player', c); } });
          state.squeezers.add(h);
        },
      };

      // ---------------------------------------------------------- 教學步驟
      function tutorialSteps() {
        const nc = noComm(variant);
        const sideStep = variant === 'super6'
          ? { title: `Super 6 旁注 <i class="en">Super 6</i>`, body: '<p>莊以 6 點贏時，Super 6 賠 <b>12:1</b>。這張桌免佣，但莊 6 點贏只賠一半（格內英文 <b>Banker wins on 6 pays 1/2</b>）。</p>',
            highlight: ['[data-bet="super6"]', '.bac-note'] }
          : variant === 'tiger'
            ? { title: `老虎旁注 <i class="en">Tiger side bets</i>`, body: '<p>五個老虎旁注都跟「莊 6 點」有關：老虎、大老虎、小老虎、老虎和、老虎對。這張桌莊 6 點贏只賠一半。</p>',
              highlight: ['.bac-sides', '.bac-note'] }
            : { title: `變體旁注 <i class="en">Side bets</i>`, body: '<p>這張是傳統桌，旁注只有對子與和。上方「變體」可切到 <b>Super 6</b> 或 <b>老虎</b> 桌，會多出不同旁注格。</p>',
              highlight: ['.lg-variantbar'] };
        return [
          // ===== layout
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：桌面',
            body: '<p>百家樂只比兩手牌：<b>莊 <i class="en">Banker</i></b> 和 <b>閒 <i class="en">Player</i></b>，誰接近 9 點誰贏。你不用做任何決定，只要選押哪邊。</p>',
            highlight: ['.bac-table'] },
          { id: 'layout-main', section: 'layout', title: `莊 <i class="en">Banker</i> / 閒 <i class="en">Player</i>`,
            body: nc ? '<p>主注兩格：押莊或押閒，都賠 <b>1:1</b>。這張免佣桌例外：莊以 6 點贏只賠一半。</p>'
              : '<p>主注兩格：押閒賠 <b>1:1</b>；押莊也是 1:1，但要抽 <b>5% 佣 <i class="en">Commission</i></b>，實拿 0.95 倍。</p>',
            highlight: ['[data-bet="banker"]', '[data-bet="player"]'] },
          { id: 'layout-tie', section: 'layout', title: `和 <i class="en">Tie</i>`,
            body: '<p>莊閒同點數就是和局，押和賠 <b>8:1</b>。和局時莊、閒主注退回。</p>',
            highlight: ['[data-bet="tie"]'] },
          { id: 'layout-pairs', section: 'layout', title: `對子 <i class="en">Pair</i>`,
            body: '<p><b>閒對 <i class="en">P. Pair</i></b>、<b>莊對 <i class="en">B. Pair</i></b>：那一邊前兩張同點數字母（如 K♠K♥），賠 <b>11:1</b>。</p>',
            highlight: ['[data-bet="bankerPair"]', '[data-bet="playerPair"]'] },
          { id: 'layout-sides', section: 'layout', ...sideStep },
          { id: 'layout-road', section: 'layout', title: `路單 <i class="en">Roadmap</i>`,
            body: '<p><b>珠盤路 <i class="en">Bead plate</i></b>：每局一格，由上往下、再往右。紅莊、藍閒、綠和，小點是對子。<b>只是紀錄，不能預測。</b></p>',
            highlight: ['.bac-road'],
            setup: (inst) => inst.demo.fillRoad() },
          { id: 'layout-chips', section: 'layout', title: `籌碼 <i class="en">Chips</i>`,
            body: '<p>顏色代表面額：10 藍、25 綠、50 橙、100 黑、500 紫、1000 黃。現場顏色可能不同，看面額。</p>',
            highlight: ['.lg-chips'],
            action: { label: '點選橙色的 RM 50 籌碼', check: (inst) => inst.tray().selected() === 50 || '點一下「50」那枚籌碼' } },
          // ===== flow
          { id: 'flow-intro', section: 'flow', title: '這段你會學到：一局怎麼進行',
            body: `<p>荷官說 <b>請下注 <i class="en">Place your bets</i></b> 才能放籌碼。真實桌會倒數約 <b>15 秒</b>，時間到就停止。</p>`,
            highlight: ['.lg-dealer-banner'],
            setup: (inst) => { inst.demo.ensureBetting(); inst.demo.showBanner(...T.call.bets); } },
          { id: 'flow-place', section: 'flow', title: '放籌碼',
            body: '<p>點下注格放一枚目前選的籌碼；長按或右鍵拿回一枚。</p>',
            highlight: ['[data-bet="banker"]', '.lg-chips'],
            setup: (inst) => inst.demo.ensureBetting(),
            action: { label: '在「莊 BANKER」放 RM 50', check: (inst) => inst.bets.get('banker') >= 50 || `目前莊上有 ${fmt(inst.bets.get('banker'))}` } },
          { id: 'flow-no-more-bets', section: 'flow', title: `停止下注 <i class="en">No more bets</i>`,
            body: '<p>荷官說 <b>No more bets</b> 之後，手放桌下——加、減、移動籌碼都不行，一直到派彩完成。</p>',
            highlight: ['.lg-dealer-banner', '.bac-main'],
            setup: (inst) => inst.demo.showBanner('停止下注', 'No more bets') },
          { id: 'flow-order', section: 'flow', title: '發牌順序',
            body: '<p>荷官依 <b>閒 → 莊 → 閒 → 莊</b> 各發兩張（圖上 1–4）。點數：A = 1、2–9 照面值、10/J/Q/K = 0，加總只看個位數。</p>',
            highlight: ['.bac-cards'],
            setup: (inst) => inst.demo.showOrder() },
          { id: 'flow-natural', section: 'flow', title: `天牌 <i class="en">Natural</i>`,
            body: '<p>任一方前兩張是 <b>8 或 9 點</b> 叫天牌，雙方都不再補牌，直接比大小。例：閒 7+A = 8，天牌。</p>',
            highlight: ['.bac-cards'],
            setup: (inst) => inst.demo.showCoup('7S AH', 'KD 6C') },
          { id: 'flow-player-third', section: 'flow', title: '閒補第三張',
            body: '<p>沒有天牌時先看閒：<b>0–5 補</b>一張、<b>6–7 停</b>。例：閒 2+3 = 5 → 補牌。</p>',
            highlight: ['.bac-hand[data-side="player"]'],
            setup: (inst) => inst.demo.showCoup('2S 3D', 'KC 7H', '4H') },
          { id: 'flow-banker-third', section: 'flow', title: '莊補第三張（規則表）',
