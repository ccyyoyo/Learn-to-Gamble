  for (let a = 1; a <= 5; a++) for (let b = a + 1; b <= 6; b++) COMBOS.push([a, b]);
  const N6 = [1, 2, 3, 4, 5, 6];
  const SPOT_IDS = [
    'small', 'big', 'odd', 'even',
    ...N6.map((n) => `single-${n}`), ...N6.map((n) => `double-${n}`), ...N6.map((n) => `triple-${n}`), 'anyTriple',
    ...Object.keys(TOTAL_PAY).map((t) => `total-${t}`), ...COMBOS.map(([a, b]) => `combo-${a}-${b}`),
  ];
  const kindOf = (id) => id.split('-')[0];

  function labelOf(id) {
    const [k, x, y] = id.split('-');
    if (k === 'single') return `單點 ${x}`;
    if (k === 'double') return `雙骰 ${x}`;
    if (k === 'triple') return `圍骰 ${x}`;
    if (k === 'total') return `總點 ${x}`;
    if (k === 'combo') return `組合 ${x}-${y}`;
    return `${T[k].zh} ${T[k].en}`;
  }
  function oddsOf(id) {
    const [k, x] = id.split('-');
    if (k === 'total') return `${TOTAL_PAY[x]}:1`;
    return T[k].odds;
  }
  function specEdge(id) {
    const [k, x] = id.split('-');
    return k === 'total' ? SPEC_EDGE.total[x] : SPEC_EDGE[k];
  }

  // ---------------------------------------------------------------- 純邏輯
  function analyze(dice) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    dice.forEach((d) => { counts[d] += 1; });
    const sum = dice[0] + dice[1] + dice[2];
    const tripleOf = counts.findIndex((c) => c === 3);
    return { dice: [...dice], counts, sum, triple: tripleOf > 0, tripleOf: tripleOf > 0 ? tripleOf : 0 };
  }

  /** 淨賠倍數：贏 → 倍數（單點 1/2/3）；輸 → −1 */
  function multOf(id, dice) {
    const a = Array.isArray(dice) ? analyze(dice) : dice;
    const [k, xs, ys] = id.split('-');
    const x = Number(xs), y = Number(ys);
    switch (k) {
      case 'small': return !a.triple && a.sum >= 4 && a.sum <= 10 ? PAY.small : -1;
      case 'big': return !a.triple && a.sum >= 11 && a.sum <= 17 ? PAY.big : -1;
      case 'odd': return !a.triple && a.sum % 2 === 1 ? PAY.odd : -1;
      case 'even': return !a.triple && a.sum % 2 === 0 ? PAY.even : -1;
      case 'single': return a.counts[x] > 0 ? a.counts[x] : -1;
      case 'double': return a.counts[x] >= 2 ? PAY.double : -1;
      case 'triple': return a.counts[x] === 3 ? PAY.triple : -1;
      case 'anyTriple': return a.triple ? PAY.anyTriple : -1;
      case 'total': return a.sum === x ? TOTAL_PAY[x] : -1;
      case 'combo': return a.counts[x] > 0 && a.counts[y] > 0 ? PAY.combo : -1;
      default: throw new Error('UNKNOWN_SPOT:' + id);
    }
  }

  /** 所有 216 種骰面（有序） */
  function allRolls() {
    const out = [];
    for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) for (let c = 1; c <= 6; c++) out.push([a, b, c]);
    return out;
  }
  /** 每注精確 {prob, ev, edge%}（216 種骰面枚舉） */
  function exactStats(id) {
    let win = 0, ev = 0;
    const rolls = allRolls();
    rolls.forEach((d) => { const m = multOf(id, d); if (m > 0) win += 1; ev += m; });
    return { prob: win / rolls.length, ev: ev / rolls.length, edge: (-ev / rolls.length) * 100 };
  }
  const STATS = Object.fromEntries(SPOT_IDS.map((id) => [id, exactStats(id)]));

  /** 這組骰面會贏的所有格（燈亮）→ Map(spot → 倍數) */
  function winningSpots(dice) {
    const a = analyze(dice);
    const m = new Map();
    SPOT_IDS.forEach((id) => { const x = multOf(id, a); if (x > 0) m.set(id, x); });
    return m;
  }

  function whyOf(id, a, mult) {
    const [k, xs, ys] = id.split('-');
    const x = Number(xs);
    const tri = a.triple ? `開出圍骰（三顆 ${a.tripleOf}）→ 大小單雙全輸` : '';
    switch (k) {
      case 'small': case 'big': {
        if (a.triple) return tri;
        const range = k === 'small' ? '4–10' : '11–17';
        return mult > 0 ? `總點 ${a.sum} 在 ${range}` : `總點 ${a.sum} 不在 ${range}`;
      }
      case 'odd': case 'even':
        if (a.triple) return tri;
        return `總點 ${a.sum} 是${a.sum % 2 ? '單' : '雙'}數`;
      case 'single': return mult > 0 ? `${x} 出現 ${a.counts[x]} 顆 → 賠 ${mult} 倍` : `沒有開出 ${x}`;
      case 'double': return mult > 0 ? `${x} 出現 ${a.counts[x]} 顆（至少兩顆）` : `${x} 只出現 ${a.counts[x]} 顆，要至少兩顆`;
      case 'triple': return mult > 0 ? `三顆都是 ${x}` : `不是三顆 ${x}`;
      case 'anyTriple': return mult > 0 ? `三顆同點（${a.tripleOf}）` : '三顆不同點';
      case 'total': return mult > 0 ? `總點正好 ${x}` : `總點是 ${a.sum}，不是 ${x}`;
      case 'combo': {
        const y = Number(ys);
        if (mult > 0) return `${x} 和 ${y} 都有出現`;
        const miss = [x, y].filter((n) => !a.counts[n]);
        return `缺 ${miss.join('、')}`;
      }
      default: return '';
    }
  }

  /**
   * 結算。entries = [[spotId, stake]]
   * @returns {{dice, sum, triple, wagered, returned, net, lines:[{spot, label, stake, result, mult, pay, returned, formula, why}]}}
   */
  function settle(entries, dice) {
    const a = analyze(dice);
    let wagered = 0, returned = 0;
    const lines = entries.map(([spot, stake]) => {
      const mult = multOf(spot, a);
      const label = labelOf(spot);
      wagered += stake;
      const why = whyOf(spot, a, mult);
      if (mult > 0) {
        const pay = round2(stake * mult);
        const back = round2(stake + pay);
        returned += back;
        return { spot, label, stake, result: 'win', mult, pay, returned: back, why,
          formula: `${label} ${fmt(stake)} × ${mult} = +${fmt(pay)}（拿回 ${fmt(back)}）` };
      }
      return { spot, label, stake, result: 'lose', mult: -1, pay: -stake, returned: 0, why,
        formula: `${label} ${fmt(stake)} 輸 = −${fmt(stake)}` };
    });
    wagered = round2(wagered); returned = round2(returned);
    return { dice: a.dice, sum: a.sum, triple: a.triple, tripleOf: a.tripleOf, wagered, returned, net: round2(returned - wagered), lines };
  }

  /** 唱點：{zh:'3、5、6 總點 14 大', en:'Fourteen, Big'} */
  function callOf(dice) {
    const a = analyze(dice);
    const tag = a.triple ? { zh: `圍 ${a.tripleOf}`, en: `Triple ${EN_NUM[a.tripleOf]}` }
      : a.sum <= 10 ? { zh: '小', en: 'Small' } : { zh: '大', en: 'Big' };
    return { zh: `${a.dice.join('、')} 總點 ${a.sum} ${tag.zh}`, en: `${EN_NUM[a.sum]}, ${tag.en}` };
  }

  // ---------------------------------------------------------------- 骰子圖形（CSS 點陣）
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function dieEl(v, size = '') {
    const d = el('span', { class: ['sb-die', size && `sb-die--${size}`], dataset: { v }, role: 'img', 'aria-label': `骰子 ${v} 點` });
    for (let i = 0; i < 9; i++) d.appendChild(el('i', { class: PIPS[v].includes(i) ? 'on' : null }));
    return d;
  }
  function diceHtml(dice) {
    return `<span class="sb-dicerow">${dice.map((v) => dieEl(v, 'sm').outerHTML).join('')}</span>`;
  }

  const pct = (p) => `${(p * 100).toFixed(p < 0.01 ? 2 : 1)}%`;
  const reduceMotion = () => { try { return !!(globalThis.matchMedia && globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch { return false; } };

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: 'sicbo',
    category: 'table',
    order: 4,
    name: { zh: '骰寶', en: 'Sic Bo' },
    summary: '三顆骰子押大小、點數與組合。只押大小最划算。',
    houseEdge: [
      { bet: { zh: '大 / 小', en: 'Big / Small' }, edge: 2.78, best: true },
      { bet: { zh: '單 / 雙', en: 'Odd / Even' }, edge: 2.78 },
      { bet: { zh: '單點', en: 'Single' }, edge: 7.87 },
      { bet: { zh: '總點 7 / 14', en: 'Total 7 / 14' }, edge: 9.72 },
      { bet: { zh: '總點 6 / 15', en: 'Total 6 / 15' }, edge: 12.04 },
      { bet: { zh: '總點 8 / 13、10 / 11', en: 'Total 8 / 13, 10 / 11' }, edge: 12.5 },
      { bet: { zh: '全圍', en: 'Any Triple' }, edge: 13.89 },
      { bet: { zh: '總點 5 / 16', en: 'Total 5 / 16' }, edge: 13.89 },
      { bet: { zh: '總點 4 / 17', en: 'Total 4 / 17' }, edge: 15.28 },
      { bet: { zh: '圍骰（指定）', en: 'Specific Triple' }, edge: 16.2 },
      { bet: { zh: '組合', en: 'Combination' }, edge: 16.67 },
      { bet: { zh: '雙骰', en: 'Double' }, edge: 18.52 },
      { bet: { zh: '總點 9 / 12', en: 'Total 9 / 12' }, edge: 18.98 },
    ],
    limits: { real: { min: 25, max: 3000 }, practice: { min: 10, max: 100000 } },
    denoms: [10, 25, 50, 100, 500, 1000],
    countdown: 20,
    logic: { settle, multOf, analyze, allRolls, exactStats, winningSpots, callOf, labelOf, specEdge, SPOT_IDS, TOTAL_PAY, SPEC_EDGE, REAL_LIMIT, COMBOS },

    create(ctx) {
      const state = { phase: 'idle', dice: null, staked: 0, rounds: 0, rig: null, history: [], last: null };
      const spotRules = {};
      if (ctx.isReal) SPOT_IDS.forEach((id) => { const [mn, mx] = REAL_LIMIT[kindOf(id)]; spotRules[id] = { min: mn, max: mx }; });
      const bets = new LG.Bets({
        min: ctx.isReal ? 10 : ctx.limits.min,
        max: ctx.isReal ? Infinity : ctx.limits.max,
        perSpotMin: ctx.isReal ? 10 : ctx.limits.min,
        perSpotMax: ctx.limits.max,
        spotRules,
        labels: Object.fromEntries(SPOT_IDS.map((id) => [id, labelOf(id)])),
      });
      let root, tableEl, bowlEl, coverEl, diceEl, callEl, histEl, hintEl, tray, layer, bar;

      // ---- 桌面
      function spot(id, { zh, en, odds, icon, cls } = {}) {
        const k = kindOf(id);
        const st = STATS[id];
        return el('div', { class: ['lg-spot', 'sb-spot', `sb-spot--${k}`, cls], dataset: { bet: id }, title: `${labelOf(id)} ${oddsOf(id)}` }, [
          el('span.lg-spot__zh', [zh ?? T[k].zh, icon || null]),
          el('span.lg-spot__en', { text: en ?? T[k].en }),
          el('span.lg-spot__odds', { text: odds ?? oddsOf(id) }),
          el('span.sb-spot__hint', { html: `${pct(st.prob)}<br>−${st.edge.toFixed(2)}%`, title: '中獎機率 / 莊家優勢' }),
        ]);
      }
      const dieIcons = (arr) => el('span.sb-icons', arr.map((v) => dieEl(v, 'xs')));

      function buildTable() {
        bowlEl = el('div.sb-bowl.is-open', { 'aria-label': '骰盅 Shaker' }, [
          el('div.sb-plate', [diceEl = el('div.sb-dice')]),
          coverEl = el('div.sb-cover', [el('span', { html: '骰盅 <i class="en">Shaker</i>' })]),
        ]);
        callEl = el('div.sb-call', { 'aria-live': 'polite' });
        histEl = el('div.sb-history', { 'aria-label': T.history });
        const top = el('div.sb-top', [bowlEl, el('div.sb-top__side', [callEl, el('div.sb-history__k', { text: T.history }), histEl])]);

        const triples = el('div.sb-row.sb-triples', [
          ...[1, 2, 3].map((n) => spot(`triple-${n}`, { zh: '圍', icon: dieIcons([n, n, n]) })),
          spot('anyTriple', { zh: '全圍', en: 'Any Triple', icon: null, cls: 'sb-spot--wide' }),
          ...[4, 5, 6].map((n) => spot(`triple-${n}`, { zh: '圍', icon: dieIcons([n, n, n]) })),
        ]);
        const doubles = el('div.sb-row.sb-doubles', N6.map((n) => spot(`double-${n}`, { zh: '雙', icon: dieIcons([n, n]) })));
        const totals = el('div.sb-row.sb-totals', Object.keys(TOTAL_PAY).map((t) => spot(`total-${t}`, { zh: `${t} 點`, en: 'Total' })));
        const combos = el('div.sb-row.sb-combos', COMBOS.map(([a, b]) => spot(`combo-${a}-${b}`, { zh: '組', icon: dieIcons([a, b]) })));
        const singles = el('div.sb-row.sb-singles', N6.map((n) => spot(`single-${n}`, { zh: '單點', icon: dieIcons([n]), odds: '1:1 2:1 3:1' })));
        const section = (cls, label, row) => el(`div.sb-sec.${cls}`, [el('div.sb-sec__k', { html: label }), row]);

        const board = el('div.sb-board', [
          el('div.sb-side.sb-side--l', [
            spot('small', { cls: 'sb-spot--main', odds: '1:1' }),
            spot('odd', { cls: 'sb-spot--main' }),
          ]),
          el('div.sb-center', [
            section('sb-sec--triples', '圍骰 <i class="en">Triple</i> 180:1 · 全圍 <i class="en">Any Triple</i> 30:1', triples),
            section('sb-sec--doubles', '雙骰 <i class="en">Double</i> 10:1', doubles),
            section('sb-sec--totals', '總點 <i class="en">Total</i>', totals),
            section('sb-sec--combos', '組合 <i class="en">Combination</i> 5:1', combos),
            section('sb-sec--singles', '單點 <i class="en">Single</i> 一顆 1:1 · 兩顆 2:1 · 三顆 3:1', singles),
          ]),
          el('div.sb-side.sb-side--r', [
            spot('big', { cls: 'sb-spot--main' }),
            spot('even', { cls: 'sb-spot--main' }),
          ]),
        ]);
        // 大小加規則小字
        ['small', 'big', 'odd', 'even'].forEach((id) => {
          const s = board.querySelector ? board.querySelector(`[data-bet="${id}"]`) : null;
          if (s) s.insertBefore(el('span.sb-spot__rule', { text: T[id].rule }), s.querySelector('.sb-spot__hint'));
        });

        tableEl = el('div.lg-table.sb-table', [top, board]);
        const actions = el('div.lg-actions', { dataset: { dealSlot: '' } });
        const chips = el('div');
        const barEl = el('div');
        hintEl = el('div.lg-hint.sb-hint', { hidden: true });
        root.append(tableEl, hintEl, actions, chips, barEl);

        tray = ui.chipTray(chips, { denoms: ctx.denoms, selected: ctx.isReal ? 25 : 10 });
        layer = ui.betLayer(tableEl, { bets, chipTray: tray, gameId: ctx.gameId });
        bar = ui.betBar(barEl, { bets, layer });
        showDice([1, 2, 3], { quiet: true });
        paintHistory();
      }

      function showDice(dice, { quiet = false } = {}) {
        diceEl.replaceChildren(...dice.map((v) => dieEl(v)));
        bowlEl.classList.remove('is-covered', 'is-shaking');
        bowlEl.classList.add('is-open');
        bowlEl.classList.toggle('is-idle', quiet);
        if (quiet) { callEl.textContent = ''; return; }
        const c = callOf(dice);
        callEl.innerHTML = `<b>${c.zh}</b> <i class="en">${c.en}</i>`;
      }
      function cover() {
        bowlEl.classList.remove('is-open', 'is-idle');
        bowlEl.classList.add('is-covered');
      }
      function markSpots(dice) {
        const wins = dice ? winningSpots(dice) : new Map();
        tableEl.querySelectorAll('[data-bet]').forEach((s) => {
          const id = s.dataset.bet;
          const w = wins.has(id);
          s.classList.toggle('is-win', w);
          s.classList.toggle('sb-lit', w);
          s.classList.toggle('is-lose', !!dice && !w && bets.get(id) > 0);
        });
      }
      function paintHistory() {
        histEl.replaceChildren(...state.history.map((d) => {
          const a = analyze(d);
          const tag = a.triple ? '圍' : a.sum <= 10 ? '小' : '大';
          return el('span', { class: ['sb-hist', `sb-hist--${a.triple ? 'triple' : a.sum <= 10 ? 'small' : 'big'}`], title: d.join('-') }, [
            el('b', { text: String(a.sum) }), el('small', { text: tag }),
          ]);
        }));
        if (!state.history.length) histEl.appendChild(el('span.sb-hist--empty', { text: '—' }));
      }

      // ---- 練習提示
      function paintHints() {
        root.classList.toggle('sb-show-hints', !!ctx.hints);
        hintEl.hidden = !ctx.hints;
        hintEl.innerHTML = '提示：每格下方小字 = <b>中獎機率 · 莊家優勢</b>。大小/單雙優勢最低（2.78%）；雙骰、總點 9/12 最差（約 19%）。';
      }
      function strategyTable() {
        const rows = [['注別', '賠率', '中獎率', '優勢']];
        const add = (zh, id) => rows.push([zh, oddsOf(id), pct(STATS[id].prob), `${STATS[id].edge.toFixed(2)}%`]);
        add('大 / 小', 'big'); add('單 / 雙', 'odd'); add('單點', 'single-1');
        [7, 6, 8, 10, 5, 4, 9].forEach((t) => add(`總點 ${t} / ${21 - t}`, `total-${t}`));
        add('全圍', 'anyTriple'); add('圍骰', 'triple-1'); add('組合', 'combo-1-2'); add('雙骰', 'double-1');
        return ui.table(rows, { caption: '只押大小/單雙最划算' });
      }

      // ---- 一局流程
      function startRound() {
        if (!ctx.alive()) return;
        state.phase = 'betting';
        // 上一局的亮燈保留到下一次搖盅（方便對照）；只清掉「輸」的標記
        tableEl.querySelectorAll('[data-bet].is-lose').forEach((s) => s.classList.remove('is-lose'));
        ctx.bettingWindow({ bets, onClose: onNoMoreBets, label: `${T.shake.zh} <i class="en">${T.shake.en}</i>` });
      }

      async function onNoMoreBets({ ok, validation }) {
        if (!ok) {
          bets.unlock();
          if (bets.total() > 0) ui.toast(validation.zh, { type: 'warn' });
          state.phase = 'idle';
          ctx.nextRound(startRound);
          return;
        }
        state.staked = bets.total();
        ctx.bank.debit(state.staked);
        state.phase = 'rolling';
        ctx.dealer.say('搖盅', 'Shaking the dice');
        const dice = state.rig || LG.dice.roll(3);
        state.rig = null;
        await shake();
        if (!ctx.alive()) return;
        showDice(dice);
        const c = callOf(dice);
        ctx.dealer.say(c.zh, c.en);
        await ctx.wait(250);
        if (!ctx.alive()) return;
        finishRound(dice);
      }

      function shake() {
        markSpots(null);
        cover();
        callEl.textContent = '';
        if (reduceMotion()) return ctx.wait(200);
        const ms = LG.ms(SHAKE_MS);
        bowlEl.style.setProperty('--sb-shake', ms + 'ms');
        bowlEl.classList.add('is-shaking');
        return ctx.wait(SHAKE_MS).then(() => { bowlEl.classList.remove('is-shaking'); });
      }

      function finishRound(dice) {
        state.dice = dice;
        const r = settle(bets.entries(), dice);
        state.last = r;
        ctx.bank.credit(r.returned);
        state.staked = 0;
        markSpots(dice);
        state.history.unshift([...dice]);
        state.history = state.history.slice(0, 10);
        paintHistory();

        ctx.recordRound({ wagered: r.wagered, net: r.net, outcome: r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'push' });
        const a = analyze(dice);
        const c = callOf(dice);
        const tags = a.triple ? `圍骰 ${a.tripleOf}（大小單雙全輸）` : `${a.sum <= 10 ? '小 SMALL' : '大 BIG'}、${a.sum % 2 ? '單 ODD' : '雙 EVEN'}`;
        ctx.explain({
          hand: `${diceHtml(dice)} 總點 <b>${a.sum}</b>`,
          result: `${tags} <i class="en">${c.en}</i>`,
          formula: r.lines.map((l) => l.formula).join('<br>') + `<br>淨 <b>${money.fmtSigned(r.net)}</b>`,
          why: '<ul class="sb-why">' + r.lines.map((l) => `<li><b>${l.label}</b>：${l.why}</li>`).join('') + '</ul>'
            + '<p class="lg-muted">亮燈的格 = 這局會贏的所有注。</p>',
        });

        state.rounds += 1;
        state.phase = 'settled';
        bets.unlock();
        bets.clear();
        ctx.checkBroke();
        ctx.nextRound(startRound);
      }

      // ---- 教學用
      const demo = {
        showBanner(zh, en) { ctx.dealer.say(zh, en); },
        ensureBetting() { if (state.phase === 'idle' || state.phase === 'settled') startRound(); },
        showDice(d) { showDice(d); markSpots(d); },
        clearLights() { markSpots(null); },
        cover() { cover(); markSpots(null); callEl.textContent = ''; },
        rig(d) { state.rig = [...d]; },
      };

      function tutorialSteps() {
        const edgeRows = ['big', 'odd', 'single-1', 'total-7', 'total-9', 'combo-1-2', 'anyTriple', 'triple-1', 'double-1']
          .map((id) => `<tr><td>${id === 'big' ? '大 / 小' : id === 'odd' ? '單 / 雙' : id === 'total-7' ? '總點 7/14' : id === 'total-9' ? '總點 9/12' : labelOf(id).replace(/ \d.*$/, '')}</td><td>${oddsOf(id)}</td><td>${STATS[id].edge.toFixed(2)}%</td></tr>`).join('');
        return [
          // ===== layout
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：骰寶桌面',
            body: '<p>上方是<b>骰盅 <i class="en">Shaker</i></b>，下方是下注檯面。先認識每一區，再動手。</p>',
            highlight: ['.sb-bowl', '.sb-board'] },

/* ==== src/games/slot-classic.js ==== */
// ============================================================================
// 3 軸經典機（FAFAFA 風）id: slot-classic — 規格 docs/05-game-rules/slot-classic.md
//
// 單一賠付線（中線）、3 軸、每軸顯示 3 格。符號：金發 G / 紅發 R / 藍發 B / 空白 X。
// 賠付（乘「每轉總注 = credits × credit 價值」）：
//   金金金 1000×、紅紅紅 200×、藍藍藍 50×、任意三個發（混色）10×、任意兩個發 2×、任意一個發 1×、沒有發 0。
//
// 轉軸帶（最終版，由 docs/change-requests/slot-classic.md 記錄調整過程）：
//   軸 1（32 停）：XXGXXXBXXXBXXXRXXXBXXXBXXXBXXXBX   金 1、紅 1、藍 6、空白 24
//   軸 2（35 停）：XRXXXBXXXGXXXBXXXBXXXRXXXBXXXGXXXBX 金 2、紅 2、藍 5、空白 26
//   軸 3（32 停）：XXXBXXXXXRXXXXXXBXXXXXGXXXXXBXXX   金 1、紅 1、藍 3、空白 27
// 精確 RTP（32×35×32 = 35,840 種停點組合全列舉）= 90.0000%；命中率（含 1× 退本）53.0%。
// simulateRTP：LG.rng.seed(4) 500,000 轉 = 90.135%（測試用）；seed(123) 4,000,000 轉 = 89.787%。
//   注意：1000× 頭獎讓每轉標準差約 8 倍押注，500k 轉的標準誤約 1.1%，
//   所以單元測試同時驗「精確值 = 90% ± 0.5%」與「固定 seed 模擬落在 89.5–90.5%」。
// ============================================================================
(() => {
  const { ui, money } = LG;
  const { el, term } = ui;
  const { fmt, round2 } = money;
  const cents = (n) => fmt(n, { cents: true });

  // ---------------------------------------------------------------- 文案
  const T = {
    title: 'FA FA FA',
    credit: { zh: '餘額', en: 'CREDIT' },
    bet: { zh: '押注', en: 'BET' },
    win: { zh: '贏分', en: 'WIN' },
    denom: '面額 <i class="en">Credit value</i>',
    credits: '注數 <i class="en">Credits</i>',
    spin: 'SPIN 轉',
    cashout: '兌現 <i class="en">Cash out</i>',
    payline: '中線 <i class="en">Payline</i>',
    noMoney: '餘額不足，降低面額或注數',
    overMax: (max) => `每轉最高 ${cents(max)}`,
    underMin: (min) => `每轉最低 ${cents(min)}`,
    realIntro: (lim) => `真實模式：每轉 <b>${lim}</b>，<b>沒有倒數</b>，按 SPIN 就轉，只顯示輸贏金額。`,
    noWin: (bet) => `未中獎，本次投入 ${cents(bet)}`,
    hint: '提示：RTP 90% = 每押 RM 100，長期平均拿回 RM 90。押大押小，比例都一樣；每一轉都是獨立的，沒有「快出了」。',
  };

  // ---------------------------------------------------------------- 符號、轉軸帶、賠付
  const SYMBOLS = {
    G: { zh: '金發', en: 'Gold Fa', short: '金', color: '#b8860b' },
    R: { zh: '紅發', en: 'Red Fa', short: '紅', color: '#d0141b' },
    B: { zh: '藍發', en: 'Blue Fa', short: '藍', color: '#1846c9' },
    X: { zh: '空白', en: 'Blank', short: '', color: '#999' },
  };
  const isFa = (s) => s === 'G' || s === 'R' || s === 'B';
  const STRIPS = [
    'XXGXXXBXXXBXXXRXXXBXXXBXXXBXXXBX',
    'XRXXXBXXXGXXXBXXXBXXXRXXXBXXXGXXXBX',
    'XXXBXXXXXRXXXXXXBXXXXXGXXXXXBXXX',
  ].map((s) => Object.freeze([...s]));
  Object.freeze(STRIPS);

  /** 賠付表（由高到低） */
  const PAYS = [
    { id: 'GGG', zh: '金發 金發 金發', en: 'Three Gold', mult: 1000 },
    { id: 'RRR', zh: '紅發 紅發 紅發', en: 'Three Red', mult: 200 },
    { id: 'BBB', zh: '藍發 藍發 藍發', en: 'Three Blue', mult: 50 },
    { id: 'MIX3', zh: '任意三個發（混色）', en: 'Any three Fa', mult: 10 },
    { id: 'ANY2', zh: '任意兩個發', en: 'Any two Fa', mult: 2 },
    { id: 'ANY1', zh: '任意一個發', en: 'Any one Fa', mult: 1 },
    { id: 'NONE', zh: '沒有發', en: 'No Fa', mult: 0 },
  ];
  const PAY = Object.fromEntries(PAYS.map((p) => [p.id, p]));
  const CREDIT_VALUES = [0.1, 0.2, 0.5, 1, 2, 5];
  const CREDITS = [1, 2, 3, 4, 5];
  const MID = 1; // 中線 = row 1

  /**
   * 評中線。line = [軸1, 軸2, 軸3] 的符號。
   * @returns {{id, zh, en, mult, count, cells:number[][]}}  cells = 中線上「發」的格 [[reel,row]]
   */
  function evalLine(line) {
    const count = line.filter(isFa).length;
    let id;
    if (count === 3) id = line[0] === line[1] && line[1] === line[2] ? `${line[0]}${line[0]}${line[0]}` : 'MIX3';
    else id = ['NONE', 'ANY1', 'ANY2'][count];
    const cells = line.map((s, reel) => (isFa(s) ? [reel, MID] : null)).filter(Boolean);
    return { ...PAY[id], count, cells };
  }
  /** grid[reel][row] → 中線結果 */
  const evalGrid = (grid) => evalLine(grid.map((col) => col[MID]));

  /** 精確機率：每個組合的出現率與對 RTP 的貢獻（全列舉停點） */
  function comboStats(strips = STRIPS) {
    const freq = strips.map((s) => {
      const f = {};
      s.forEach((x) => { f[x] = (f[x] || 0) + 1 / s.length; });
      return f;
    });
    const out = Object.fromEntries(PAYS.map((p) => [p.id, 0]));
    const syms = Object.keys(SYMBOLS);
    for (const a of syms) for (const b of syms) for (const c of syms) {
      const p = (freq[0][a] || 0) * (freq[1][b] || 0) * (freq[2][c] || 0);
      if (p) out[evalLine([a, b, c]).id] += p;
    }
    const rows = PAYS.map((x) => ({ ...x, p: out[x.id], contrib: out[x.id] * x.mult }));
    const rtp = rows.reduce((s, r) => s + r.contrib, 0);
    const hit = rows.filter((r) => r.mult > 0).reduce((s, r) => s + r.p, 0);
    return { rows, rtp, hit };
  }

  /** RTP 模擬（LG.slots.simulateRTP；bet = 1 單位） */
  function simulate(spins = 500000, seed = 4) {
    if (seed !== null && seed !== undefined) LG.rng.seed(seed);
    const r = LG.slots.simulateRTP({ strips: STRIPS, rows: 3, evaluate: (g) => evalGrid(g).mult, bet: 1 }, spins);
    if (seed !== null && seed !== undefined) LG.rng.seed(null);
    return r;
  }

  const lineText = (line) => line.map((s) => (s === 'X' ? '空白' : SYMBOLS[s].zh)).join(' · ');

  /** Pay Table modal 內容 */
  function paytableHtml() {
    const rows = PAYS.map((p) => `<tr><td>${p.zh} <i class="en">${p.en}</i></td><td class="sc-pt__m">${p.mult ? `${p.mult}×` : '—'}</td><td>${p.mult ? cents(round2(0.5 * p.mult)) : 'RM 0'}</td></tr>`).join('');
    return `<div class="sc-pt">
      <p><b>倍數 × 每線注</b>：本機只有 1 條線（中線），所以每線注 = 每轉總注 = <b>注數 <i class="en">Credits</i> × 面額 <i class="en">Credit value</i></b>。</p>
      <table class="lg-datatable"><thead><tr><th>中線組合</th><th>倍數</th><th>押 RM 0.50 時</th></tr></thead><tbody>${rows}</tbody></table>
      <ul class="lg-list">
        <li>只有<b>中線</b>（金色箭頭那一列）算分；上、下兩列只是「看起來差一點」。</li>
        <li>「發」不分顏色都算：兩個發 2×、一個發 1×（1× 只是拿回本金，淨贏 0）。</li>
        <li>例：押 RM 0.50 中任意三個發 → RM 0.50 × 10 = RM 5.00（淨贏 RM 4.50）。</li>
        <li>RTP <i class="en">Return to Player</i> 90%：長期每押 RM 100 平均拿回 RM 90。</li>
      </ul></div>`;
  }

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: 'slot-classic',
    category: 'slots',
    order: 1,
    name: { zh: '3 軸經典機', en: 'Classic 3-Reel (FA FA FA)' },
    summary: '只有一條線、一種「發」字：看懂老虎機最簡單的一台。',
    houseEdge: [{ bet: { zh: '總體', en: 'Overall' }, edge: 10.0, best: true }],
    limits: { real: { min: 0.1, max: 25 }, practice: { min: 0.1, max: 25 } },
    logic: { STRIPS, SYMBOLS, PAYS, CREDIT_VALUES, CREDITS, evalLine, evalGrid, comboStats, simulate },

    create(ctx) {
      const state = { phase: 'idle', staked: 0, spins: 0, lastWin: 0, paytableOpened: false, cashedOut: false, wagered: 0, won: 0 };
      let root, view, panel, spinB, meters = {}, hintEl, winAnim = 0;
      let ready = !ctx.isReal;

      // ---- 畫面
      const symView = Object.fromEntries(Object.entries(SYMBOLS).map(([k, s]) => [k, {
        label: s.zh,
        svg: k === 'X' ? '<span class="sc-blank" aria-hidden="true"></span>'
          : `<span class="sc-fa sc-fa--${k}"><b>發</b><small>${s.short}</small></span>`,
      }]));

      function meter(key, t) {
        const v = el('b.sc-meter__v', { dataset: { role: key } });
        meters[key] = v;
        return el('div', { class: ['sc-meter', `sc-meter--${key}`] }, [el('span.sc-meter__k', { html: `${t.en} <i class="en">${t.zh}</i>` }), v]);
      }

      function build() {
        const head = el('div.sc-head', [el('div.sc-logo', { html: `<span>FA</span><span>FA</span><span>FA</span>` })]);
        const reels = el('div.sc-reels');
        const wrap = el('div.sc-reelwrap', [
          el('span.sc-payline.sc-payline--l', { 'aria-hidden': 'true', text: '▶' }),
          reels,
          el('span.sc-payline.sc-payline--r', { 'aria-hidden': 'true', text: '◀' }),
          el('span.sc-payline__label', { html: T.payline }),
        ]);
        const meterRow = el('div.sc-meters', [meter('credit', T.credit), meter('bet', T.bet), meter('win', T.win)]);
        const machine = el('div.sc-machine', [head, wrap, meterRow]);
        const ctrl = el('div.sc-controls');
        spinB = el('button', { type: 'button', class: 'lg-btn lg-btn--primary sc-spin', dataset: { action: 'spin' }, html: T.spin });
        const cashB = el('button', { type: 'button', class: 'lg-btn lg-btn--ghost lg-btn--sm sc-cashout', dataset: { action: 'cashout' }, html: T.cashout });
        hintEl = el('div.lg-hint.sc-hint', { hidden: true });
        root.append(machine, ctrl, el('div.sc-spinrow', [cashB, spinB]), hintEl);

        view = LG.slotView.create(reels, { reels: 3, rows: 3, symbols: symView, strips: STRIPS, spinMs: 800, stepMs: 200 });
        view.setGrid(LG.slots.gridAt(STRIPS, [0, 7, 1]));
        const pb = LG.slotView.paytableButton(head, { render: paytableHtml });
        pb.addEventListener('click', () => { state.paytableOpened = true; });
        panel = LG.slotView.betPanel(ctrl, {
          lines: CREDITS, lineBets: CREDIT_VALUES, linesLabel: T.credits, lineBetLabel: T.denom,
          onChange: () => { paintMeters(); paintSpin(); },
        });
        panel.el.children[0].classList.add('sc-denom');
        panel.el.children[1].classList.add('sc-credits');
        spinB.addEventListener('click', () => { spin(); });
        cashB.addEventListener('click', cashOut);
        ctx.on('bank:change', () => { paintMeters(); paintSpin(); });
        paintMeters();
        setWin(0);
        paintSpin();
      }

      function paintMeters() {
        if (!meters.credit) return;
        meters.credit.textContent = cents(ctx.bank.balance());
        meters.bet.textContent = cents(panel.bet());
      }
      function setWin(n) { if (meters.win) { meters.win.textContent = cents(n); meters.win.dataset.win = String(n); } }
      /** 贏分滾動累加 */
      function rollWin(target) {
        cancelAnimationFrame(winAnim);
        const dur = LG.ms(target > 0 ? 700 : 0);
        if (!dur || typeof requestAnimationFrame !== 'function') { setWin(target); return; }
        const t0 = performance.now();
        const step = (t) => {
          if (!ctx.alive()) return;
          const k = Math.min(1, (t - t0) / dur);
          setWin(k >= 1 ? target : round2(target * k));
          if (k < 1) winAnim = requestAnimationFrame(step);
        };
        winAnim = requestAnimationFrame(step);
      }
      function canSpin() {
        return ready && state.phase === 'idle' && ctx.bank.canAfford(panel.bet());
      }
      function paintSpin() {
        if (!spinB) return;
        spinB.disabled = !canSpin();
        // 餘額付不起目前押注：SPIN 灰掉 + 提示一次（恢復可付後重置）
        const broke = ready && state.phase === 'idle' && !ctx.bank.canAfford(panel.bet());
        if (broke && !state.warnedAfford) ui.toast(T.noMoney, { type: 'warn' });
        state.warnedAfford = broke;
        spinB.classList.toggle('is-spinning', state.phase === 'spinning');
        if (panel) panel.setEnabled(state.phase === 'idle');
      }
      function paintHints() {
        if (!hintEl) return;
        hintEl.hidden = !ctx.hints;
        const ret = state.wagered ? ` 本次已押 ${cents(state.wagered)}，拿回 ${cents(state.won)}（${((state.won / state.wagered) * 100).toFixed(1)}%）——短期會亂跳，長期才會接近 90%。` : '';
        hintEl.textContent = T.hint + ret;
      }

      // ---- 一轉
      async function spin() {
        if (state.phase !== 'idle' || !ready) return;
        const bet = panel.bet();
        if (bet < ctx.limits.min - 1e-9) { ui.toast(T.underMin(ctx.limits.min), { type: 'warn' }); return; }
        if (bet > ctx.limits.max + 1e-9) { ui.toast(T.overMax(ctx.limits.max), { type: 'warn' }); return; }
        if (!ctx.bank.canAfford(bet)) { ui.toast(T.noMoney, { type: 'warn' }); paintSpin(); return; }
        state.phase = 'spinning';
        ctx.bank.debit(bet);
        state.staked = bet;
        setWin(0);
        paintSpin();
        const grid = LG.slots.spin(STRIPS, 3);
        const res = evalGrid(grid);
        const win = round2(res.mult * bet);
        await view.spin(grid);
        if (!ctx.alive()) return;
        settle(grid, res, bet, win);
      }

      function settle(grid, res, bet, win) {
        if (win > 0) ctx.bank.credit(win);
        state.staked = 0;
        state.spins += 1;
        state.lastWin = win;
        state.wagered = round2(state.wagered + bet);
        state.won = round2(state.won + win);
        if (res.mult > 0) view.highlight(res.cells);
        rollWin(win);
        const net = round2(win - bet);
        ctx.recordRound({ wagered: bet, net, outcome: net > 0 ? 'win' : net < 0 ? 'lose' : 'push' });
        const line = grid.map((c) => c[MID]);
        const credits = panel.lines(), cv = panel.lineBet();
        const betText = `${cents(bet)}（${credits} credit${credits > 1 ? 's' : ''} × ${cents(cv)}）`;
        ctx.explain({
          net,
          hand: `中線 <i class="en">Payline</i>：<b>${lineText(line)}</b>`,
          result: res.mult > 0 ? `${res.zh} <i class="en">${res.en}</i> → <b>${res.mult}×</b>` : `未中獎 <i class="en">No win</i>`,
          formula: res.mult > 0
            ? `押注 ${betText} × ${res.mult} = <b>${cents(win)}</b>（拿回，含本金）<br>淨 <b>${money.fmtSigned(net)}</b>`
            : `${T.noWin(bet)}<br>淨 <b>${money.fmtSigned(net)}</b>`,
          why: whyText(res),
        });
        state.phase = 'idle';
        paintSpin();
        paintHints();
        ctx.checkBroke();
      }

      function whyText(res) {
        const base = '只算中線；上、下兩列不算分。';
        switch (res.id) {
          case 'GGG': case 'RRR': case 'BBB': return `中線三個同色的發，照賠付表 ${res.mult}×。${base}`;
          case 'MIX3': return `中線三格都是發但顏色不同，算「任意三個發」10×。${base}`;
          case 'ANY2': return `中線有 2 個發（不分顏色），賠 2×。${base}`;
          case 'ANY1': return `中線只有 1 個發，賠 1×——剛好拿回本金，淨贏 0。${base}`;
          default: return `中線沒有任何發，這一轉輸掉押注。${base}每一轉都是獨立的，上一轉輸了不代表下一轉「快出了」。`;
        }
      }

      function cashOut() {
        state.cashedOut = true;
        const bal = ctx.bank.balance();
        ui.modal({
          title: '兌現 <i class="en">Cash out</i>',
          body: `<div class="sc-ticket"><div class="sc-ticket__k">TITO <i class="en">Ticket in, ticket out</i></div><div class="sc-ticket__v">${cents(bal)}</div></div>
            <p>現場按 <b>CASH OUT</b> 後，機台會印出一張<b>票券</b>，拿去兌換機或櫃台換現金，也可以插進別台機器繼續玩。</p>
            <p class="lg-muted">練習場不會真的把錢拿走，餘額不變。</p>`,
        });
      }

      // ---- 教學示範
      const demo = {
        setGrid(mid, top = 'XXX', bot = 'XXX') {

          view.reset();
          view.setGrid([0, 1, 2].map((r) => [top[r], mid[r], bot[r]]));
          const res = evalLine([...mid]);
          if (res.mult > 0) view.highlight(res.cells);
        },

      };

      function tutorialSteps() {

          // ===== layout
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：機台長什麼樣',

            highlight: ['.sc-machine'], setup: () => demo.clear() },

            body: '<p><b>CREDIT</b> 是餘額、<b>BET</b> 是這一轉押多少、<b>WIN</b> 是這一轉贏多少。</p>',
            highlight: ['.sc-meters'] },
          { id: 'layout-denom', section: 'layout', title: `面額 <i class="en">Credit value</i>`,
            body: '<p>一個 credit 值多少錢：RM 0.10 到 RM 5。按 + / − 調整。</p>',

            highlight: ['.lg-betpanel'] },
          { id: 'strategy-due', section: 'strategy', title: '沒有「快出了」',
            body: '<p>每一轉都獨立。連輸 50 轉，下一轉中獎機率一樣。<br>「很久沒開」<b>這只是紀錄，不能預測</b>。</p>',
            highlight: ['.sc-reels'] },
          { id: 'strategy-do', section: 'strategy', title: '該押：小面額、當娛樂費',
            body: '<p>用 RM 0.10–0.50 慢慢玩，把輸掉的當成買娛樂的錢。</p>',
            highlight: ['.sc-denom'] },
          { id: 'strategy-dont', section: 'strategy', title: '別押：追損加注',
            body: '<p>輸了按 MAX BET 想一次翻本，只會讓 10% 的損失來得更快。</p>',
            highlight: ['[data-action="maxbet"]'] },
          { id: 'strategy-budget', section: 'strategy', title: `預算與停損 <i class="en">Stop-loss</i>`,

            highlight: ['.sc-meter--credit'] },
        ];
      }

      return {
        state,
        demo,
        panel: () => panel,
        view: () => view,
        spin,
        mount(el0) {
          root = el0;
          root.classList.add('sc-root');
          build();
          paintHints();
          ctx.on('hints:change', paintHints);
          if (ctx.isPractice) {
            const st = comboStats();
            ctx.strategyPanel(ui.table([['組合', '倍數', '機率', '貢獻 RTP'],
              ...st.rows.map((r) => [r.zh, r.mult ? `${r.mult}×` : '—', `${(r.p * 100).toFixed(r.p < 0.001 ? 4 : 2)}%`, `${(r.contrib * 100).toFixed(2)}%`]),
              ['合計', '', `中獎 ${(st.hit * 100).toFixed(1)}%`, `${(st.rtp * 100).toFixed(1)}%`]], { caption: 'RTP 90% 從哪裡來' }));
          }
          if (ctx.isReal) {
            // 核心進場 modal 寫「倒數 N 秒」，老虎機沒有倒數 → 改寫文字（見 change-request CR-1）
            Promise.resolve().then(() => {
              const b = document.querySelector('[data-action="real-start"]');
              const p = b && b.closest('.lg-modal') && b.closest('.lg-modal').querySelector('.lg-modal__body p');
              if (p) p.innerHTML = T.realIntro(`${cents(ctx.limits.min)} – ${cents(ctx.limits.max)}`);
            });
            ctx.ready.then(() => { ready = true; paintSpin(); });
          }
          root.dataset.ready = '1';
        },
        unmount() {
          cancelAnimationFrame(winAnim);
          // 轉到一半離開：退回已扣未結算的押注
          if (state.staked > 0) { ctx.bank.credit(state.staked); state.staked = 0; }
          if (view) view.destroy();
        },
        tutorialSteps,
      };
    },
  });
})();

//
// 5×3、20 線（規格允許以 LINES_20 簡化，實作備註見 docs/change-requests/slot-holdspin.md）。

//   - 每顆金球帶面額（總注 ×1 / ×2 / ×3 / ×5 / ×10 / ×25 / ×50，或 MINOR / MAJOR）。
//   - 金球在基礎遊戲不賠線；6 顆以上 → Hold & Spin：鎖球、其餘格獨立再轉，
//     3 次再轉，有新球落下就重置為 3；3 次都沒新球 → 結束，所有金球面額加總；15 格全滿再加 GRAND。
// 累積獎金：MINOR = 總注 × 50（固定）；MAJOR 種子 RM 500、每轉 +總注 0.5%；GRAND 種子 RM 5,000、每轉 +總注 1%。
//   存在 LG.store.jackpots['slot-holdspin'] = {major, grand}；中獎後回種子。
// RTP 94.5%：以總注 RM 2（預設注）、獎池種子值計算（含特色），見 tests/unit/slot-holdspin.test.mjs [slow]。
// ============================================================================
(() => {
  const { ui, money, slots, slotView } = LG;
  const { el, term } = ui;
  const { fmt, round2 } = money;
  const ID = 'slot-holdspin';
  const cents = (n) => fmt(n, { cents: true });

  // ---------------------------------------------------------------- 文案
  const T = {
    name: { zh: 'Hold & Spin 機', en: 'Hold & Spin' },
    summary: '6 顆金球觸發 Hold & Spin：鎖球再轉，面額全部加總。',
    spin: term('旋轉', 'SPIN'),
    spinning: ['轉動中', 'Spinning'],
    paying: ['派彩', 'Paying out'],
    ready: ['按「旋轉」開始', 'Press SPIN'],
    feature: ['Hold & Spin！', 'Hold & Spin'],
    grand: ['15 格全滿！GRAND', 'GRAND jackpot'],
    noMoney: '餘額不足：請調低每線注',
    respins: term('再轉', 'Respins'),
    win: term('贏分', 'WIN'),
    orbs: term('金球', 'Orbs'),
    jp: { minor: 'MINOR', major: 'MAJOR', grand: 'GRAND' },
    rtpNote: 'RTP 94.5%（獎池以種子值計）',
  };

  // ---------------------------------------------------------------- 規則常數
  const LINES = slots.LINES_20;
  const NLINES = LINES.length;           // 20
  const TRIGGER = 6;                      // 6 顆以上觸發
  const RESPINS = 3;                      // 再轉次數（有新球重置為 3）
  const CELLS = 15;                       // 5×3 全滿 → GRAND
  const RESPIN_ORB_P = 0.08;              // 特色中每格每次落球機率
  const MINOR_MULT = 50;                  // MINOR = 總注 × 50
  const SEEDS = { major: 500, grand: 5000 };
  const GROWTH = { major: 0.005, grand: 0.01 };   // 每轉總注 ×
  const REF_BET = 2;                      // RTP 參考總注（預設：每線 RM 0.10 × 20）
  const LINE_BETS = [0.1, 0.2, 0.5, 1, 2, 5];
  const GRAND_ONE_IN = 15025;             // 平均幾轉全滿一次（exactRTP().pFull 的倒數；單元測試核對）

  /** 面額分佈（%）：數字 = 總注倍數 */
  const ORB_DIST = [[1, 40], [2, 25], [3, 15], [5, 10], [10, 6], [25, 2.5], [50, 1], ['MINOR', 0.4], ['MAJOR', 0.1]];

  /** 符號（由高到低）；賠付倍數乘「每線注」。同 slot-video 賠付表。 */
  const SYMS = {
    WILD: { zh: '龍', en: 'WILD', label: '龍', color: '#fff6c8', bg: 'linear-gradient(160deg,#1a8aa8,#0b3a55)' },
    GOD: { zh: '財神', en: 'Fortune God', label: '財神', color: '#b3261e', bg: 'linear-gradient(180deg,#fff4d6,#f2cf7a)' },
    INGOT: { zh: '金元寶', en: 'Gold Ingot', label: '元寶', color: '#8a5a00', bg: 'linear-gradient(180deg,#fff7df,#f4dc97)' },
    RED: { zh: '紅包', en: 'Red Packet', label: '紅包', color: '#fff', bg: 'linear-gradient(180deg,#e0453a,#a3150f)' },
    CARP: { zh: '鯉魚', en: 'Koi', label: '鯉', color: '#e0621b', bg: 'linear-gradient(180deg,#f3fbff,#cfe8f5)' },
    A: { zh: 'A', en: 'Ace', label: 'A', color: '#0d5d8c' },
    K: { zh: 'K', en: 'King', label: 'K', color: '#1b7d4a' },
    Q: { zh: 'Q', en: 'Queen', label: 'Q', color: '#7a2f9c' },
    J: { zh: 'J', en: 'Jack', label: 'J', color: '#b3531e' },
    T: { zh: '10', en: 'Ten', label: '10', color: '#2a5b9a' },
    N: { zh: '9', en: 'Nine', label: '9', color: '#6b6b6b' },
    ORB: { zh: '金球', en: 'Orb', label: '●', svg: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#b8860b"/><circle cx="10" cy="10" r="7.4" fill="#f5c542"/><circle cx="7.4" cy="7" r="2.6" fill="#fff5c7" opacity=".85"/></svg>', bg: 'radial-gradient(circle,#3a2a05,#120d02)' },
    EMPTY: { zh: '空格', en: 'Blank', label: ' ', bg: 'linear-gradient(180deg,#0e2533,#081620)' },
  };
  const PAYTABLE = {
    WILD: { 5: 1000 },
    GOD: { 3: 50, 4: 200, 5: 1000 },
    INGOT: { 3: 25, 4: 100, 5: 400 },
    RED: { 3: 20, 4: 60, 5: 200 },
    CARP: { 3: 15, 4: 40, 5: 120 },
    A: { 3: 10, 4: 25, 5: 75 },
    K: { 3: 10, 4: 25, 5: 75 },
    Q: { 3: 5, 4: 15, 5: 50 },
    J: { 3: 5, 4: 15, 5: 50 },
    T: { 3: 5, 4: 10, 5: 40 },
    N: { 3: 5, 4: 10, 5: 40 },
  };
  const PAY_ORDER = ['WILD', 'GOD', 'INGOT', 'RED', 'CARP', 'A', 'K', 'Q', 'J', 'T', 'N'];

  // ---------------------------------------------------------------- 轉軸帶
  /** 平滑加權輪替：把 [符號, 停點數] 均勻交錯成一條帶 */
  function interleave(items) {
    const list = items.filter(([, c]) => c > 0).map(([u, c]) => ({ u, w: c, cur: 0 }));
    const total = list.reduce((s, x) => s + x.w, 0);
    const out = [];
    for (let k = 0; k < total; k++) {
      let best = null;
      for (const x of list) { x.cur += x.w; if (!best || x.cur > best.cur) best = x; }
      best.cur -= total;
      out.push(best.u);
    }
    return out;
  }
  /**
   * 一軸：spec = {syms:[[符號, 停點數]], orbs:[方塊大小…]}。
   * 金球以「疊放方塊」均勻插進帶子（彼此間隔很遠、不會黏在一起），這樣一軸最多同時露出方塊大小顆。
   */
  function buildStrip(spec) {
    const out = interleave(spec.syms);
    const blocks = spec.orbs || [];
    const F = out.length;
    for (let k = blocks.length - 1; k >= 0; k--) {
      const at = Math.floor(((k + 0.5) * F) / blocks.length);
      out.splice(at, 0, ...new Array(blocks[k]).fill('ORB'));
    }
    return out;
  }
  // 各軸停點數（以 exactRTP 精確調到 RTP 94.5%；見單元測試）
  const MID_SYMS = [['WILD', 5], ['GOD', 3], ['INGOT', 3], ['RED', 3], ['CARP', 3], ['A', 4], ['K', 4], ['Q', 4], ['J', 4], ['T', 4], ['N', 4]];
  const OUT_SYMS = [['GOD', 3], ['INGOT', 2], ['RED', 3], ['CARP', 3], ['A', 4], ['K', 4], ['Q', 4], ['J', 4], ['T', 4], ['N', 3]];
  // 龍 WILD 只在第 2–4 軸；每軸金球：一個 2 連方塊 + 兩顆單球
  const STRIP_SPEC = [0, 1, 2, 3, 4].map((r) => ({ syms: r >= 1 && r <= 3 ? MID_SYMS : OUT_SYMS, orbs: [2, 1, 1] }));
  const STRIPS = STRIP_SPEC.map(buildStrip);
  /** 特色中轉動動畫用的帶（只有空格與金球） */
  const FEATURE_STRIPS = STRIPS.map(() => ['EMPTY', 'EMPTY', 'EMPTY', 'ORB', 'EMPTY', 'EMPTY', 'EMPTY', 'EMPTY']);

  // ---------------------------------------------------------------- 純邏輯
  const key = (c) => `${c[0]},${c[1]}`;
  const cellOrder = (a, b) => (a.cell[0] - b.cell[0]) || (a.cell[1] - b.cell[1]);

  /** 依分佈抽一顆金球面額 */
  function drawOrbValue(rand = LG.rng.random) {
    let r = rand() * 100;
    for (const [v, p] of ORB_DIST) { if (r < p) return v; r -= p; }
    return ORB_DIST[0][0];
  }

  /** 基礎遊戲轉一次 → grid[reel][row]；grid.vals[reel][row] = 金球面額或 null（不可列舉） */
  function spinBase(strips = STRIPS) {
    const grid = slots.spin(strips, 3);
    const vals = grid.map((col) => col.map((s) => (s === 'ORB' ? drawOrbValue() : null)));
    Object.defineProperty(grid, 'vals', { value: vals, enumerable: false, writable: true });
    return grid;
  }

  /** 盤面上的金球清單 [{cell:[reel,row], value}] */
  function orbList(grid, vals) {
    const out = [];
    grid.forEach((col, r) => col.forEach((s, y) => { if (s === 'ORB') out.push({ cell: [r, y], value: vals && vals[r] ? vals[r][y] : 1 }); }));
    return out;
  }
  const isTrigger = (orbCount) => orbCount >= TRIGGER;

  /** 線獎（倍數 × 每線注）。金球不賠線、Wild 不替代金球。 */
  function evalBase(grid, lineBet) {
    const r = slots.evalLines(grid, LINES, PAYTABLE, { wild: 'WILD' });
    return { wins: r.wins, mult: r.total, win: round2(r.total * lineBet) };
  }

  /**
   * Hold & Spin。orbs = 觸發時的金球；draw(cell) → 新球面額或 null（預設：8% 機率落球）。
   * 每次再轉：所有未鎖格各自獨立判定；有新球 → 剩餘次數重置為 3，否則 −1。
   * 3 次都沒新球或 15 格全滿即結束。
   * @returns {{rounds:Array<{landed:Array<{cell,value}>, left:number, reset:boolean}>, orbs:Array<{cell,value}>, full:boolean}}
   */
  function runHoldSpin(orbs, draw) {
    const d = draw || (() => (LG.rng.random() < RESPIN_ORB_P ? drawOrbValue() : null));
    const held = new Map(orbs.map((o) => [key(o.cell), { cell: [o.cell[0], o.cell[1]], value: o.value }]));
    const rounds = [];
    let left = RESPINS;
    while (left > 0 && held.size < CELLS) {
      const landed = [];
      for (let r = 0; r < 5; r++) for (let y = 0; y < 3; y++) {
        if (held.has(`${r},${y}`)) continue;
        const v = d([r, y]);
        if (v !== null && v !== undefined) landed.push({ cell: [r, y], value: v });
      }
      landed.forEach((o) => held.set(key(o.cell), o));
      const reset = landed.length > 0;
      left = reset ? RESPINS : left - 1;
      rounds.push({ landed, left, reset });
    }
    return { rounds, orbs: [...held.values()].sort(cellOrder), full: held.size >= CELLS };
  }

  /** 一顆金球的金額（MAJOR 用傳入的當下獎池） */
  function orbAmount(value, bet, majorPool) {
    if (value === 'MINOR') return round2(bet * MINOR_MULT);
    if (value === 'MAJOR') return round2(majorPool);
    return round2(bet * value);
  }
  const orbLabel = (value, bet) => (typeof value === 'number' ? cents(bet * value) : value);

  /**
   * 特色總贏：所有金球面額加總 + 全滿 GRAND。jp = {major, grand}（此總注下的當下金額，見 jackpots.at）。
   * 同一局第二顆 MAJOR 以種子值計（第一顆領走後已回種子）。
   * @returns {{total, parts:[{cell,value,amount}], grand:number, claims:string[]}}
   */
  function featureTotal(orbs, full, bet, jp) {
    let major = jp.major;
    const majorSeed = round2(SEEDS.major * (bet / REF_BET));
    const claims = [];
    const parts = orbs.map((o) => {
      const amount = orbAmount(o.value, bet, major);
      if (o.value === 'MAJOR') { claims.push('major'); major = majorSeed; }
      return { cell: o.cell, value: o.value, amount };
    });
    const grand = full ? round2(jp.grand) : 0;
    if (full) claims.push('grand');
    const total = round2(parts.reduce((s, p) => s + p.amount, 0) + grand);
    return { total, parts, grand, claims };
  }

  /** 完整一轉（純邏輯）：grid 可指定（教學/測試），否則隨機。jp 為當下獎池 */
  function playSpin({ bet, lineBet, jp, grid }) {
    const g = grid || spinBase();
    const vals = g.vals || g.map((col) => col.map((s) => (s === 'ORB' ? 1 : null)));
    const base = evalBase(g, lineBet);
    const orbs = orbList(g, vals);
    let feature = null;
    if (isTrigger(orbs.length)) {
      const hs = runHoldSpin(orbs);
      feature = { ...hs, ...featureTotal(hs.orbs, hs.full, bet, jp) };
    }
    const win = round2(base.win + (feature ? feature.total : 0));
    return { grid: g, vals, base, orbs, feature, win, bet, lineBet };
  }

  // ---- 精確分析（不靠亂數）：特色是「已鎖 k 顆、剩 l 次」的馬可夫鏈；各格落球獨立同分佈
  const binom = (n, k) => { let c = 1; for (let i = 1; i <= k; i++) c = (c * (n - k + i)) / i; return c; };
  const memo = new Map();
  /** 由 k 顆鎖定、剩 left 次開始 → 最終金球數分佈 dist[0..15]（dist[15] = 全滿機率） */
  function finalDist(k, left = RESPINS, p = RESPIN_ORB_P) {
    if (k >= CELLS) { const d = new Array(CELLS + 1).fill(0); d[CELLS] = 1; return d; }
    if (left <= 0) { const d = new Array(CELLS + 1).fill(0); d[k] = 1; return d; }
    const mk = `${k},${left},${p}`;
    if (memo.has(mk)) return memo.get(mk);
    const m = CELLS - k;
    const out = new Array(CELLS + 1).fill(0);
    for (let j = 0; j <= m; j++) {
      const pj = binom(m, j) * p ** j * (1 - p) ** (m - j);
      const sub = j === 0 ? finalDist(k, left - 1, p) : finalDist(k + j, RESPINS, p);
      sub.forEach((x, i) => { out[i] += pj * x; });
    }
    memo.set(mk, out);
    return out;
  }
  /** 一顆金球的期望金額（總注倍數；MAJOR 以種子計＝總注 × 500 ÷ 2） */
  function orbMean() {
    return ORB_DIST.reduce((s, [v, p]) => s + (p / 100) * (v === 'MINOR' ? MINOR_MULT : v === 'MAJOR' ? SEEDS.major / REF_BET : v), 0);
  }
  /** 基礎盤面金球數分佈 P(n)，n = 0..15（由轉軸帶精確計算） */
  function orbCountDist(strips = STRIPS) {
    let dist = [1];
    for (const st of strips) {
      const d = [0, 0, 0, 0];
      for (let i = 0; i < st.length; i++) {
        let c = 0;
        for (let y = 0; y < 3; y++) if (st[(i + y) % st.length] === 'ORB') c++;
        d[c] += 1 / st.length;
      }
      const nd = new Array(dist.length + 3).fill(0);
      dist.forEach((a, i) => d.forEach((b, j) => { nd[i + j] += a * b; }));
      dist = nd;
    }
    return dist;
  }
  /** 線獎期望（總注倍數）：各線邊際分佈相同 → 一條線的期望倍數 */
  function lineRTP(strips = STRIPS) {
    const freqs = strips.map((st) => {
      const m = {};
      st.forEach((x) => { m[x] = (m[x] || 0) + 1; });
      return Object.entries(m).map(([k, v]) => [k, v / st.length]);
    });
    let ev = 0;
    const g = [];
    const rec = (r, p) => {
      if (r === 5) { ev += p * slots.evalLines(g, [[0, 0, 0, 0, 0]], PAYTABLE, { wild: 'WILD' }).total; return; }
      for (const [x, f] of freqs[r]) { g[r] = [x]; rec(r + 1, p * f); }
    };
    rec(0, 1);
    return ev; // 20 線 × 每線注 × ev ÷ 總注(20 × 每線注) = ev
  }
  /** 精確 RTP 分解（獎池取種子值；獎金按總注等比，所以與注額無關）→ {lines, feature, grand, total, trigger, pFull} */
  function exactRTP({ strips = STRIPS } = {}) {
    const nd = orbCountDist(strips);
    const mu = orbMean();
    let feature = 0, grand = 0, trigger = 0, pFull = 0;
    for (let n = TRIGGER; n < nd.length; n++) {
      if (!nd[n]) continue;
      trigger += nd[n];
      const fd = finalDist(n);
      const eK = fd.reduce((s, x, i) => s + x * i, 0);
      feature += nd[n] * eK * mu;
      grand += nd[n] * fd[CELLS] * (SEEDS.grand / REF_BET);
      pFull += nd[n] * fd[CELLS];
    }
    const lines = lineRTP(strips);
    return { lines, feature, grand, total: lines + feature + grand, trigger, pFull };
  }

  // ---- 累積獎金（LG.store）
  // 存的是「總注 RM 2 時」的金額（種子 MAJOR 500 / GRAND 5,000）；顯示與派彩按總注等比換算（同 MINOR 以總注換算），
  // 所以每種注額的 RTP 都一樣。每轉成長＝該注額下看到的金額 +總注 × 0.5%（MAJOR）/ × 1%（GRAND）。
  const scale = (bet) => bet / REF_BET;
  const jackpots = {
    /** 儲存值（總注 RM 2 基準） */
    get() {
      const j = (LG.store.peek().jackpots || {})[ID] || {};
      return { major: Number.isFinite(j.major) ? j.major : SEEDS.major, grand: Number.isFinite(j.grand) ? j.grand : SEEDS.grand };
    },
    /** 此總注下的三級金額（RM） */
    at(bet) {
      const j = jackpots.get();
      return { minor: round2(bet * MINOR_MULT), major: round2(j.major * scale(bet)), grand: round2(j.grand * scale(bet)) };
    },
    /** 每轉成長：此注額下 MAJOR +總注 × 0.5%、GRAND +總注 × 1% */
    grow(bet) {
      LG.store.update((s) => {
        const cur = s.jackpots[ID] || { ...SEEDS };
        const add = (lv) => Math.round(((Number(cur[lv]) || SEEDS[lv]) + (bet * GROWTH[lv]) / scale(bet)) * 1e6) / 1e6;
        s.jackpots[ID] = { major: add('major'), grand: add('grand') };
      });
      return jackpots.at(bet);
    },
    /** 中獎後回種子 */
    claim(level) {
      LG.store.update((s) => { s.jackpots[ID] = { ...jackpots.get(), [level]: SEEDS[level] }; });
      return jackpots.get();
    },
    reset() { LG.store.update((s) => { s.jackpots[ID] = { ...SEEDS }; }); },
  };

  /**
   * simulateRTP 設定：基礎盤面、線獎、Hold & Spin 再轉與數字球 / MINOR 面額都實際模擬；
   * MAJOR / GRAND 以種子期望計（MAJOR：每顆球 0.1% × 種子；GRAND：此起始球數的全滿機率 × 種子），
   * 避免幾萬轉才一次的 GRAND 讓 20 萬轉的模擬結果大幅跳動。jackpotMode:'random' 則完全照抽。
   */
  function rtpConfig({ bet = REF_BET, strips = STRIPS, jackpotMode = 'expected' } = {}) {
    const lineBet = bet / NLINES;
    const seedAt = { major: SEEDS.major * (bet / REF_BET), grand: SEEDS.grand * (bet / REF_BET) };
    const pMajor = (ORB_DIST.find(([v]) => v === 'MAJOR') || [0, 0])[1] / 100;
    return {
      bet,
      spin: () => spinBase(strips),
      evaluate(grid) {
        let w = evalBase(grid, 1).mult * lineBet;
        const orbs = orbList(grid, grid.vals);
        if (isTrigger(orbs.length)) {
          const hs = runHoldSpin(orbs);
          if (jackpotMode === 'random') {
            w += featureTotal(hs.orbs, hs.full, bet, seedAt).total;
          } else {
            for (const o of hs.orbs) if (o.value !== 'MAJOR') w += orbAmount(o.value, bet, 0);
            w += hs.orbs.length * pMajor * seedAt.major + finalDist(orbs.length)[CELLS] * seedAt.grand;
          }
        }
        return w;
      },
    };
  }

  // ---------------------------------------------------------------- 教學示範盤面
  const DEMO_BASE = [['A', 'GOD', 'K'], ['Q', 'RED', 'J'], ['CARP', 'T', 'A'], ['K', 'N', 'INGOT'], ['J', 'Q', 'T']];
  const DEMO_ORB_CELLS = [[0, 1], [1, 0], [1, 2], [2, 1], [3, 0], [4, 2], [2, 2], [3, 1], [0, 0], [4, 0]];
  const DEMO_VALUES = [1, 2, 5, 1, 3, 2, 10, 1, 'MINOR', 3];
  /** 由示範底盤放 n 顆金球 → grid（附 vals） */
  function demoGrid(n, values = DEMO_VALUES) {
    const grid = DEMO_BASE.map((c) => c.slice());
    const vals = grid.map((c) => c.map(() => null));
    DEMO_ORB_CELLS.slice(0, n).forEach(([r, y], i) => { grid[r][y] = 'ORB'; vals[r][y] = values[i % values.length]; });
    Object.defineProperty(grid, 'vals', { value: vals, enumerable: false, writable: true });
    return grid;
  }

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: ID,
    category: 'slots',
    order: 3,
    name: T.name,
    summary: T.summary,
    houseEdge: [{ bet: { zh: '總體（RTP 94.5%）', en: 'Overall' }, edge: 5.5, best: true }],
    limits: { real: { min: 2, max: 100 }, practice: { min: 2, max: 100 } },
    logic: {
      SYMS, PAYTABLE, STRIPS, STRIP_SPEC, LINES, ORB_DIST, SEEDS, GROWTH, TRIGGER, RESPINS, RESPIN_ORB_P, MINOR_MULT, REF_BET,
      buildStrip, interleave, drawOrbValue, spinBase, orbList, isTrigger, evalBase, runHoldSpin, orbAmount, featureTotal, playSpin,
      jackpots, rtpConfig, demoGrid, GRAND_ONE_IN, finalDist, orbMean, orbCountDist, lineRTP, exactRTP,
    },

    create(ctx) {
      const state = { rounds: 0, features: 0, busy: false, ready: false, last: null, pending: null, forced: null, paytableOpened: false, lastOrbs: 0 };
      let root, machine, view, panel, spinBtn, hintEl, winEl, orbEl, respinEl, statusEl, jpEls = {}, alive = true;

      // ---- 畫面
      function buildTable() {
        jpEls = {};
        const plaques = ['grand', 'major', 'minor'].map((lv) => {
          const v = el('b.hs-jp__v', { dataset: { role: `jp-${lv}` } });
          jpEls[lv] = v;
          return el(`div.hs-jp.hs-jp--${lv}`, { dataset: { jp: lv } }, [el('span.hs-jp__k', { text: T.jp[lv] }), v]);
        });
        const reels = el('div.hs-reels');
        respinEl = el('div.hs-respins', { dataset: { left: '' }, 'aria-live': 'polite' });
        statusEl = el('div.hs-status', [el('span.hs-status__t', { html: `6 顆以上${term('金球', 'Orb')} → Hold &amp; Spin` }), respinEl]);
        winEl = el('b.hs-meter__win', { dataset: { role: 'win' }, text: cents(0) });
        orbEl = el('b.hs-meter__orbs', { dataset: { role: 'orbs' }, text: '0' });
        machine = el('div.lg-table.hs-machine', [
          el('div.hs-jackpots', plaques),
          statusEl,
          reels,
          el('div.hs-meter', [el('span', { html: `${T.win} ` }), winEl, el('span.hs-meter__sep', { text: '·' }), el('span', { html: `${T.orbs} ` }), orbEl, el('span', { text: ' / 6' })]),
        ]);
        hintEl = el('div.lg-hint.hs-hint', { hidden: true });
        const actions = el('div.lg-actions.hs-actions');
        const betHost = el('div.hs-bet');
        root.append(machine, hintEl, actions, betHost);

        view = slotView.create(reels, { reels: 5, rows: 3, symbols: SYMS, strips: STRIPS });
        view.setGrid(DEMO_BASE);
        const pt = slotView.paytableButton(actions, { render: renderPaytable });
        pt.addEventListener('click', () => { state.paytableOpened = true; });
        spinBtn = el('button', { type: 'button', class: 'lg-btn lg-btn--primary hs-spin', dataset: { action: 'spin' }, html: T.spin });
        spinBtn.addEventListener('click', () => { doSpin(); });
        actions.appendChild(spinBtn);
        panel = slotView.betPanel(betHost, { lines: [NLINES], lineBets: LINE_BETS, lineBet: 0.1, onChange: () => { paintJackpots(); paintHints(); } });
        paintJackpots();
        paintRespins(null);
      }

      function paintJackpots() {
        const j = jackpots.at(panel.bet());
        jpEls.minor.textContent = cents(j.minor);
        jpEls.major.textContent = cents(j.major);
        jpEls.grand.textContent = cents(j.grand);
      }
      function paintRespins(left, { pulse = false } = {}) {
        respinEl.dataset.left = left === null ? '' : String(left);
        respinEl.innerHTML = left === null ? '' : `${T.respins} <b>${left}</b>`;
        if (pulse) { respinEl.classList.remove('is-reset'); void respinEl.offsetWidth; respinEl.classList.add('is-reset'); }
      }
      const setWin = (n) => { winEl.textContent = cents(n); };
      const setBusy = (b) => {
        state.busy = b;
        spinBtn.disabled = b || !state.ready;
        panel.setEnabled(!b);
      };

      function paintHints() {
        if (!hintEl) return;
        hintEl.hidden = !ctx.hints;
        const bet = panel ? panel.bet() : REF_BET;
        hintEl.innerHTML = `提示：上一轉金球 ${state.lastOrbs} / 6 顆。Hold &amp; Spin 是 RTP 94.5% 的一部分，不是額外的錢。`
          + `總注 ${cents(bet)} × 200 轉 = ${cents(bet * 200)}，先確認預算撐得住。`;
      }

      function renderPaytable() {
        const bet = panel.bet(), lb = panel.lineBet();
        const rows = PAY_ORDER.map((s) => {
          const p = PAYTABLE[s];
          const nm = `${SYMS[s].zh} <i class="en">${SYMS[s].en}</i>`;
          return `<tr><td>${nm}</td><td>${p[3] ?? '—'}</td><td>${p[4] ?? '—'}</td><td>${p[5] ?? '—'}</td></tr>`;
        }).join('');
        const dist = ORB_DIST.map(([v, p]) => `<tr><td>${typeof v === 'number' ? `總注 ×${v}（${cents(bet * v)}）` : v}</td><td>${p}%</td></tr>`).join('');
        const j = jackpots.at(bet);
        return `<p>線獎倍數乘<b>每線注</b>（目前 ${cents(lb)}），不是總注。20 條固定線，由左至右連續。龍 <i class="en">WILD</i> 只在第 2–4 軸，替代金球以外的符號。</p>
          <table class="lg-datatable"><thead><tr><th>符號</th><th>3 連</th><th>4 連</th><th>5 連</th></tr></thead><tbody>${rows}</tbody></table>
          <h3>Hold &amp; Spin 特色 <i class="en">Feature</i></h3>
          <ul class="lg-list"><li>金球 <i class="en">Orb</i> 在基礎遊戲<b>不賠線</b>，只算觸發。</li>
          <li><b>6 顆以上</b>金球 → 觸發：金球鎖定 <i class="en">Hold</i>，其餘格獨立再轉 <i class="en">Respins</i>。</li>
          <li>給 3 次再轉；有新球落下就鎖定並<b>重置為 3 次</b>。</li>
          <li>3 次都沒新球 → 結束：所有金球面額加總。15 格全滿 → 另加 <b>GRAND</b>。</li>
          <li>特色中每格每次約 8% 落球。</li></ul>
          <table class="lg-datatable"><thead><tr><th>金球面額</th><th>機率</th></tr></thead><tbody>${dist}</tbody></table>
          <h3>累積獎金 <i class="en">Jackpots</i></h3>
          <table class="lg-datatable"><thead><tr><th>級別</th><th>目前</th><th>種子 / 成長</th></tr></thead><tbody>
          <tr><td>MINOR</td><td>${cents(j.minor)}</td><td>總注 × 50（固定）</td></tr>
          <tr><td>MAJOR</td><td>${cents(j.major)}</td><td>種子 RM 500；每轉 +總注 × 0.5%</td></tr>
          <tr><td>GRAND</td><td>${cents(j.grand)}</td><td>種子 RM 5,000；每轉 +總注 × 1%；15 格全滿才中</td></tr></tbody></table>
          <p class="lg-muted">獎金牌以總注 RM 2 為基準（MAJOR 種子 RM 500、GRAND 種子 RM 5,000），換注額時按比例換算，就像 MINOR = 總注 × 50。所以每種注額的 RTP 都是 94.5%（莊家優勢 5.5%，獎池以種子值計）。中獎後該級回種子。</p>`;
      }

      // ---- 一轉
      async function doSpin() {
        if (state.busy || !state.ready || !alive) return;
        const bet = panel.bet(), lineBet = panel.lineBet();
        if (!ctx.bank.canAfford(bet)) { ui.toast(T.noMoney, { type: 'warn' }); ctx.checkBroke(); return; }
        setBusy(true);
        ctx.bank.debit(bet);
        const jp = jackpots.grow(bet);
        paintJackpots();
        const grid = state.forced ? state.forced : undefined;
        state.forced = null;
        const out = playSpin({ bet, lineBet, jp, grid });
        state.pending = { win: out.win, claims: out.feature ? out.feature.claims : [], bet };
        ctx.dealer.say(...T.spinning);
        setWin(0);
        paintRespins(null);
        machine.classList.remove('is-feature', 'is-grand');
        view.reset();
        view.setStrips(STRIPS);
        await view.spin(out.grid);
        if (!alive) return;
        out.orbs.forEach((o) => view.setSymbolValue(o.cell, orbLabel(o.value, bet)));
        orbEl.textContent = String(out.orbs.length);
        state.lastOrbs = out.orbs.length;
        if (out.base.wins.length) {
          out.base.wins.forEach((w) => { view.showLine(LINES[w.line]); view.highlight(w.cells); });
          setWin(out.base.win);
          await ctx.wait(out.feature ? 900 : 300);
          if (!alive) return;
        }
        if (out.feature) {
          await playFeature(out);
          if (!alive) return;
        }
        settle(out);
      }

      async function playFeature(out) {
        const f = out.feature, bet = out.bet;
        state.features += 1;
        machine.classList.add('is-feature');
        ctx.dealer.say(...T.feature);
        view.clear();
        await ctx.wait(500);
        if (!alive) return;
        // 鎖球；其餘格變空格，成為獨立轉軸
        const held = new Set(out.orbs.map((o) => key(o.cell)));
        const cur = out.grid.map((col, r) => col.map((s, y) => (held.has(`${r},${y}`) ? 'ORB' : 'EMPTY')));
        view.setGrid(cur);
        view.lock(out.orbs.map((o) => o.cell));
        view.setStrips(FEATURE_STRIPS);
        paintRespins(RESPINS);
        for (const round of f.rounds) {
          await ctx.wait(450);
          if (!alive) return;
          round.landed.forEach((o) => { cur[o.cell[0]][o.cell[1]] = 'ORB'; });
          await view.spin(cur);
          if (!alive) return;
          round.landed.forEach((o) => view.setSymbolValue(o.cell, orbLabel(o.value, bet)));
          view.lock(round.landed.map((o) => o.cell));
          orbEl.textContent = String(held.size + round.landed.length);
          round.landed.forEach((o) => held.add(key(o.cell)));
          paintRespins(round.left, { pulse: round.reset });
          if (round.landed.length) view.highlight(round.landed.map((o) => o.cell));
        }
        view.setStrips(STRIPS);
        if (f.full) { machine.classList.add('is-grand'); ctx.dealer.say(...T.grand); }
        // 逐球加總
        await ctx.wait(400);
        view.clear();
        let acc = out.base.win;
        for (const p of f.parts) {
          if (!alive) return;
          view.highlight([p.cell]);
          acc = round2(acc + p.amount);
          setWin(acc);
          await ctx.wait(220);
        }
        if (f.grand) { acc = round2(acc + f.grand); setWin(acc); await ctx.wait(400); }
      }

      /** 入帳 + 獎池回種子（動畫結束或中途離開都要做） */
      function finalize() {
        const p = state.pending;
        if (!p) return null;
        state.pending = null;
        if (p.win > 0) ctx.bank.credit(p.win);
        p.claims.forEach((lv) => jackpots.claim(lv));
        return p;
      }

      function settle(out) {
        finalize();
        paintJackpots();
        setWin(out.win);
        paintRespins(null);
        const net = round2(out.win - out.bet);
        state.last = { bet: out.bet, win: out.win, net, orbs: out.orbs.length, feature: !!out.feature };
        state.rounds += 1;
        if (out.win > 0) ctx.dealer.say(...T.paying); else ctx.dealer.say(...T.ready);
        ctx.recordRound({ wagered: out.bet, net, outcome: net > 0 ? 'win' : net < 0 ? 'lose' : 'push' });
        ctx.explain(explainOf(out));
        setBusy(false);
        paintHints();
        ctx.checkBroke();
      }

      function explainOf(out) {
        const { bet, lineBet } = out;
        const lineTxt = out.base.wins.map((w) => `第 ${w.lineNo} 線：${SYMS[w.sym].zh} ×${w.count}`);
        const hand = `${T.orbs} ${out.orbs.length} 顆${out.orbs.length >= TRIGGER ? '（觸發 Hold &amp; Spin）' : '（需 6 顆觸發）'}`
          + (lineTxt.length ? `<br>${lineTxt.join('；')}` : '<br>沒有連線');
        const result = out.win > 0 ? `中獎 <i class="en">WIN</i> ${cents(out.win)}` : `未中獎，本次投入 ${cents(bet)}`;
        const f = [];
        out.base.wins.forEach((w) => f.push(`第 ${w.lineNo} 線 ${SYMS[w.sym].zh}×${w.count}：${w.mult} × ${cents(lineBet)} = ${cents(w.mult * lineBet)}`));
        if (out.feature) {
          const parts = out.feature.parts.map((p) => (typeof p.value === 'number' ? cents(p.amount) : `${p.value} ${cents(p.amount)}`));
          f.push(`Hold &amp; Spin ${out.feature.parts.length} 顆：${parts.join(' + ')} = ${cents(round2(out.feature.total - out.feature.grand))}`);
          if (out.feature.grand) f.push(`15 格全滿 GRAND：+${cents(out.feature.grand)}`);
        }
        f.push(`總贏 ${cents(out.win)} − 總注 ${cents(bet)} = 淨 <b>${money.fmtSigned(round2(out.win - bet))}</b>`);
        let why;
        if (out.feature) {
          const r = out.feature.rounds;
          const resets = r.filter((x) => x.reset).length;
          why = `${out.orbs.length} 顆金球觸發，鎖定後再轉 ${r.length} 次，其中 ${resets} 次有新球（次數重置為 3）。`
            + (out.feature.full ? '15 格全滿，所以另加 GRAND。' : '最後連續 3 次沒新球而結束，所有金球面額加總。')
            + '這筆特色贏分本來就算在 RTP 94.5% 裡。';
        } else if (out.base.wins.length) {
          why = `線獎 = 賠付表倍數 × 每線注 ${cents(lineBet)}（不是總注）。金球 ${out.orbs.length} 顆，不到 6 顆不觸發，也不賠線。`;
        } else {
          why = `沒有任何一條線由左起連成 3 個相同符號；金球 ${out.orbs.length} 顆不到 6 顆。大多數轉都是這樣——長期每 RM 100 平均拿回 RM 94.5。`;
        }
        return { hand, result, formula: f.join('<br>'), why };
      }

      // ---- 教學示範
      const demo = {
        /** 顯示 n 顆金球的示範盤面（不扣款）；lock=鎖球；left=再轉次數 */
        show(n, { lock = false, left = null, values } = {}) {
          if (state.busy) return;
          const g = demoGrid(n, values);
          const bet = panel.bet();
          view.reset();
          machine.classList.toggle('is-feature', lock);
          machine.classList.remove('is-grand');
          const shown = lock ? g.map((col) => col.map((s) => (s === 'ORB' ? 'ORB' : 'EMPTY'))) : g;
          view.setGrid(shown);
          orbList(g, g.vals).forEach((o) => view.setSymbolValue(o.cell, orbLabel(o.value, bet)));
          if (lock) view.lock(orbList(g, g.vals).map((o) => o.cell));
          orbEl.textContent = String(n);
          paintRespins(left);
        },
        /** 下一轉固定出現 n 顆金球（觸發 Hold & Spin）；再轉部分仍隨機 */
        forceTrigger(n = 6) { state.forced = demoGrid(n); },
        forceGrid(grid) { state.forced = grid; },
        setLineBet(v) { panel.set({ lineBet: v }); },
        showBanner(zh, en) { ctx.dealer.say(zh, en); },
        spin: () => doSpin(),
        /** 教學：把下方元素捲到畫面中間（避免被教學面板蓋住） */
        reveal(sel) {
          ctx.later(() => {
            const x = root && (root.querySelector(sel) || document.querySelector(sel));
            if (x && x.scrollIntoView) x.scrollIntoView({ block: 'center', behavior: 'auto' });
          }, 250);
        },
      };

      function tutorialSteps() {
        return [
          // ===== layout
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：機台畫面',
            body: '<p>上面是獎金牌，中間 5 軸 × 3 列的轉軸，下面是注額面板與旋轉鍵。</p>',
            highlight: ['.hs-machine'], setup: () => demo.show(0) },
          { id: 'layout-orb', section: 'layout', title: `金球 <i class="en">Orb</i>`,
            body: '<p>金色圓球就是金球。每顆帶一個面額，例如 RM 2、RM 10，或 MINOR / MAJOR。</p><p>金球在基礎遊戲<b>不賠線</b>，只用來觸發特色。</p>',
            highlight: ['.hs-reels .lg-slot__cell[data-sym="ORB"]'], setup: () => demo.show(4) },
          { id: 'layout-jackpots', section: 'layout', title: `獎金牌 <i class="en">Jackpots</i>`,
            body: '<p>MINOR = 總注 × 50；MAJOR 從 RM 500 起、GRAND 從 RM 5,000 起，每轉都會長一點。</p>',
            highlight: ['.hs-jackpots'] },
          { id: 'layout-lines', section: 'layout', title: `每線注 <i class="en">Bet per line</i>`,
            body: '<p>20 條固定線。<b>總注 = 20 × 每線注</b>：每線 RM 0.10 → 總注 RM 2。</p>',
            highlight: ['.lg-betpanel'], setup: () => demo.reveal('.lg-betpanel'),
            action: { label: '按「+」把每線注調到 RM 0.20', check: () => panel.lineBet() === 0.2 || `目前每線 ${cents(panel.lineBet())}` } },
          { id: 'layout-paytable', section: 'layout', title: `賠付表 <i class="en">Pay Table</i>`,
            body: '<p>賠付表的倍數乘<b>每線注</b>，不是總注。裡面也寫了特色規則與面額機率。</p>',
            highlight: ['.lg-paytable-btn'], setup: () => demo.reveal('.lg-paytable-btn'),
            action: { label: '打開「賠付表 Pay Table」看一下', check: () => state.paytableOpened || '按一下賠付表按鈕' } },
          // ===== flow
          { id: 'flow-intro', section: 'flow', title: '這段你會學到：一轉怎麼進行',
            body: '<p>按旋轉 → 扣總注 → 轉軸逐軸停 → 算線獎 → 數金球。</p>',
            highlight: ['.hs-spin'] },
          { id: 'flow-spin', section: 'flow', title: `旋轉 <i class="en">SPIN</i>`,
            body: '<p>每按一次就扣一次總注。停下後亮起的線就是中獎線。</p>',
            highlight: ['.hs-spin', '.hs-reels'], setup: () => demo.reveal('.hs-spin'),
            action: { label: '按「旋轉 SPIN」轉一次', check: () => state.rounds > 0 || '按下旋轉鍵，等轉軸停下' } },
          { id: 'flow-locked', section: 'flow', title: '轉動中不能改注',
            body: '<p>按下旋轉後，這一轉的注額就定了：轉動中不能改注、也不能取消。</p>',
            highlight: ['.lg-betpanel'], setup: () => demo.reveal('.lg-betpanel') },
          { id: 'flow-trigger', section: 'flow', title: '6 顆金球 → 觸發',
            body: '<p>同一畫面出現 <b>6 顆以上</b>金球（任意位置）就觸發 Hold &amp; Spin。5 顆不算。</p>',
            highlight: ['.hs-reels .lg-slot__cell[data-sym="ORB"]', '.hs-meter'], setup: () => demo.show(6) },
          { id: 'flow-lock', section: 'flow', title: `鎖球 <i class="en">Hold</i>`,
            body: '<p>觸發時金球全部鎖定（金框 HOLD），其餘 9 格各自變成獨立轉軸。</p>',
            highlight: ['.hs-reels .lg-slot__cell.is-locked'], setup: () => demo.show(6, { lock: true, left: 3 }) },
          { id: 'flow-respins', section: 'flow', title: `再轉 3 次 <i class="en">Respins</i>`,
            body: '<p>一開始給 3 次再轉。一次沒新球 → 3 變 2；再沒有 → 1。</p>',
            highlight: ['.hs-respins'], setup: () => demo.show(6, { lock: true, left: 2 }) },
          { id: 'flow-reset', section: 'flow', title: '新球落下 → 重置為 3',
            body: '<p>只要有新球落下，它也被鎖住，而且次數<b>重置回 3</b>。3 次都沒新球才結束。</p>',
            highlight: ['.hs-respins'], setup: () => demo.show(7, { lock: true, left: 3 }) },
          { id: 'flow-try', section: 'flow', title: '玩一次 Hold & Spin',
            body: '<p>這次已安排 6 顆金球落下，看看鎖球、再轉、重置與最後加總。</p>',
            highlight: ['.hs-spin', '.hs-machine'],
            setup: () => { if (!state.busy) demo.forceTrigger(6); demo.reveal('.hs-spin'); },
            action: { label: '按「旋轉 SPIN」看完整特色', check: () => (state.features > 0 && !state.busy) || '按旋轉，等加總結束' } },
          // ===== payout
          { id: 'payout-intro', section: 'payout', title: '這段你會學到：特色怎麼算錢',
            body: '<p>結束時把<b>所有金球的面額加總</b>，就是特色贏分。</p>',
            highlight: ['.hs-meter'] },
          { id: 'payout-sum', section: 'payout', title: '8 顆金球加總',
            body: '<p>總注 RM 2，8 顆球 ×1 ×2 ×5 ×1 ×3 ×2 ×10 ×1：<br><b>(1+2+5+1+3+2+10+1) × RM 2 = 25 × RM 2 = RM 50</b></p>',
            highlight: ['.hs-reels'],
            setup: () => { if (!state.busy) { demo.setLineBet(0.1); demo.show(8, { lock: true, left: 0 }); } } },
          { id: 'payout-grand', section: 'payout', title: '15 格全滿 = GRAND',
            body: '<p>15 格全部是金球：所有面額加總，<b>再加 GRAND</b>（至少 RM 5,000）。這非常罕見。</p>',
            highlight: ['[data-jp="grand"]'] },
          { id: 'payout-line', section: 'payout', title: '線獎照賠付表',
            body: '<p>基礎遊戲的線獎：一線 3 個財神 = <b>50 × RM 0.10 = RM 5</b>（倍數 × 每線注）。</p>',
            highlight: ['.lg-paytable-btn'] },
          // ===== strategy
          { id: 'strategy-intro', section: 'strategy', title: '這段你會學到：RTP 與預算',
            body: '<table class="lg-datatable"><tr><th>項目</th><th>數值</th></tr><tr><td>RTP</td><td>94.5%</td></tr><tr><td>莊家優勢</td><td>5.5%</td></tr></table><p>長期每押 RM 100 平均拿回 RM 94.5。</p>',
            highlight: null },
          { id: 'strategy-rtp', section: 'strategy', title: 'Hold & Spin 是 RTP 的一部分',
            body: '<p>特色不是「送的錢」：94.5% 已經把特色算進去。平常轉輸掉的，就是在付特色的錢。</p>',
            highlight: ['.hs-machine'] },
          { id: 'strategy-grand', section: 'strategy', title: 'GRAND 機率極低',
            body: `<p>15 格全滿平均約 ${GRAND_ONE_IN.toLocaleString('en-US')} 轉才一次（總注 RM 2 要先押約 ${fmt(GRAND_ONE_IN * REF_BET)}）。別把 GRAND 當目標；獎池大也不代表「快開了」。</p>`,
            highlight: ['[data-jp="grand"]'] },
          { id: 'strategy-do', section: 'strategy', title: '該做 / 別做',
            body: '<p>該做：選一個能轉 200 次以上的每線注。<br>別做：輸了加注追回來——機台沒有記憶，這只是紀錄，不能預測。</p>',
            highlight: ['.lg-betpanel'], setup: () => demo.reveal('.lg-betpanel') },
          { id: 'strategy-budget', section: 'strategy', title: '預算',
            body: '<p>今晚只帶 RM 500，輸完就走。總注 RM 2 大約 250 轉，RM 10 只有 50 轉。</p>',
            highlight: ['.lg-topbar .lg-balance'] },
        ];
      }

      return {
        state,
        demo,
        view: () => view,
        panel: () => panel,
        mount(el0) {
          root = el0;
          root.classList.add('hs-root');
          buildTable();
          paintHints();
          ctx.on('hints:change', paintHints);
          if (ctx.isPractice) {
            ctx.strategyPanel(ui.table([
              ['項目', '數值'], ['RTP', '94.5%'], ['莊家優勢', '5.5%'], ['觸發', '6 顆金球'], ['GRAND', '15 格全滿'],
            ], { caption: 'Hold & Spin 已算在 RTP 裡' }));
          }
          setBusy(false);
          spinBtn.disabled = true;
          ctx.ready.then(() => {
            if (!alive) return;
            state.ready = true;
            setBusy(false);
            ctx.dealer.say(...T.ready);
          });
          root.dataset.ready = '1';
        },
        unmount() {
          alive = false;
          finalize();          // 結果在按下旋轉時已決定：中途離開照樣入帳
          if (view) view.destroy();
        },
        tutorialSteps,
      };
    },
  });
})();
