<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>賭場遊戲練習場 Casino Practice</title>
<style>
/* ==== src/core/core.css ==== */
/* =====================================================================
   Learn-to-Gamble 設計系統 — docs/03-ui-spec.md
   手機優先（360–430px），深色底、綢面綠桌面。無外部字型。
   ===================================================================== */
:root {
  --felt: #0b5d3b;
  --felt-dark: #083f29;
  --felt-light: #13784f;
  --gold: #d9b451;
  --gold-soft: rgba(217, 180, 81, .35);
  --line: #f3e9c9;
  --line-soft: rgba(243, 233, 201, .55);
  --bg: #101418;
  --panel: #1b222a;
  --panel-2: #232c36;
  --border: #2d3843;
  --text: #f2f2f2;
  --muted: #9aa4ad;
  --win: #3ddc84;
  --lose: #ff5c5c;
  --push: #ffd166;
  --accent: #4f9cff;
  --red-suit: #d0202b;
  --black-suit: #16181c;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
  --tap: 44px;
  --topbar-h: 52px;
  --chip-blue: #2463d6;
  --chip-green: #1f9d55;
  --chip-orange: #e8781e;
  --chip-black: #22252a;
  --chip-purple: #7d3cc8;
  --chip-yellow: #e9c02f;
  --chip-gray: #7a838c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body.lg-has-tutor { padding-bottom: 300px; }
#app { min-height: 100vh; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
p { margin: 0 0 .6em; }
button { font-family: inherit; font-size: inherit; color: inherit; }
[hidden] { display: none !important; }

/* 英文術語：小字、淡色、不斜體 */
i.en, .en { font-style: normal; opacity: .75; font-size: .85em; letter-spacing: .01em; }
.lg-muted { color: var(--muted); font-size: .9em; }
.lg-win { color: var(--win); }
.lg-lose { color: var(--lose); }
.lg-push { color: var(--push); }
.lg-num, .lg-balance, .lg-chipstack__amt, .lg-countdown, .lg-flash, .lg-lb__edge { font-variant-numeric: tabular-nums; }
.lg-tag { display: inline-block; font-size: .7em; padding: 1px 6px; border-radius: 999px; background: var(--gold); color: #1a1a1a; vertical-align: middle; font-weight: 600; }
.lg-list { margin: .4em 0; padding-left: 1.2em; }
.lg-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: .5em 0; }
.lg-kv dt { color: var(--muted); }
.lg-kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.lg-error { padding: 16px; color: var(--lose); background: rgba(255, 92, 92, .1); border-radius: var(--radius); }

/* ------------------------------------------------------------ 按鈕 */
.lg-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-height: var(--tap); min-width: var(--tap); padding: 8px 16px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--panel-2); color: var(--text);
  font-weight: 600; text-decoration: none; cursor: pointer; user-select: none;
  transition: transform .08s, background .15s, opacity .15s, box-shadow .15s;
  touch-action: manipulation; white-space: nowrap;
}
.lg-btn:hover { background: #2b3642; }
.lg-btn:active { transform: scale(.97); }
.lg-btn:focus-visible, [data-bet]:focus-visible, .lg-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lg-btn:disabled, .lg-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.lg-btn--primary { background: linear-gradient(180deg, #e6c567, var(--gold)); color: #1b1606; border-color: #b8943a; }
.lg-btn--primary:hover { background: linear-gradient(180deg, #f0d27a, #dfbb58); }
.lg-btn--ghost { background: transparent; }
.lg-btn--danger { background: transparent; color: var(--lose); border-color: rgba(255, 92, 92, .5); }
.lg-btn--sm { min-height: 36px; padding: 4px 12px; font-size: .9em; }
.lg-btn.is-locked { opacity: .55; }
.lg-btn.is-shake { animation: lg-shake .35s; }
@keyframes lg-shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* ------------------------------------------------------------ 頁面框架 */
.lg-page { max-width: 900px; margin: 0 auto; padding: 0 0 24px; }
.lg-topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 8px; padding: 0 8px;
  background: rgba(16, 20, 24, .94); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
}
.lg-topbar__back { color: var(--text); text-decoration: none; min-height: var(--tap); display: inline-flex; align-items: center; padding: 0 8px; white-space: nowrap; }
.lg-topbar__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-topbar .lg-balance { font-weight: 700; color: var(--gold); white-space: nowrap; }
.lg-topbar__menu { min-width: var(--tap); min-height: var(--tap); border: 0; background: transparent; font-size: 22px; cursor: pointer; border-radius: 50%; }
.lg-modebar { display: flex; align-items: center; gap: 10px; padding: 8px; flex-wrap: wrap; }
.lg-modebar__limits { font-size: .85em; color: var(--muted); }
.lg-seg { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.lg-seg__btn {
  min-height: 38px; padding: 6px 14px; border-radius: 999px; color: var(--text); text-decoration: none;
  display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; font-weight: 600;
}
.lg-seg__btn.is-active { background: var(--gold); color: #1b1606; }
.lg-switch {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 10px 0 4px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--panel); cursor: pointer;
}
.lg-switch__knob { width: 34px; height: 20px; border-radius: 999px; background: #3a4450; position: relative; transition: background .2s; }
.lg-switch__knob::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.lg-switch.is-on .lg-switch__knob { background: var(--win); }
.lg-switch.is-on .lg-switch__knob::after { transform: translateX(14px); }
.lg-variantbar { display: flex; gap: 6px; padding: 0 8px 8px; overflow-x: auto; align-items: center; scrollbar-width: none; }
.lg-variantbar__k { color: var(--muted); font-size: .85em; white-space: nowrap; }
.lg-variantbar__btn {
  min-height: 36px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px;
  color: var(--text); text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; font-size: .9em;
}
.lg-variantbar__btn.is-active { border-color: var(--gold); color: var(--gold); background: rgba(217, 180, 81, .1); }

.lg-game-wrap { display: block; }
.lg-stage { position: relative; padding: 0 8px; }
.lg-stage-top { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; min-height: 48px; }

/* 荷官口令橫幅 */
.lg-dealer-banner {
  flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
  padding: 6px 12px; border-radius: var(--radius-sm); background: var(--panel); border: 1px solid var(--border);
  color: var(--muted); transition: opacity .2s;
}
.lg-dealer-banner.is-active { color: var(--text); border-color: var(--gold-soft); }
.lg-dealer-banner__zh { font-weight: 700; font-size: 1.05em; }
.lg-dealer-banner__en { font-size: .82em; color: var(--gold); letter-spacing: .03em; }
.lg-dealer-banner.is-pulse { animation: lg-banner .5s ease-out; }
.lg-dealer-banner.is-floating { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 60; min-width: 220px; }
@keyframes lg-banner { from { transform: scale(1.04); background: #2a3340; } to { transform: none; } }

/* 倒數 */
.lg-countdown { display: none; min-width: 64px; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-sm); background: var(--panel); border: 1px solid var(--border); }
.lg-countdown.is-active { display: flex; }
.lg-countdown__n { font-size: 1.5em; font-weight: 800; color: var(--gold); line-height: 1; }
.lg-countdown__bar { width: 48px; height: 4px; background: #333d48; border-radius: 2px; overflow: hidden; }
.lg-countdown__bar > span { display: block; height: 100%; background: var(--gold); transition: width .3s linear; }
.lg-countdown.is-urgent .lg-countdown__n { color: var(--lose); animation: lg-tick 1s infinite; }
.lg-countdown.is-urgent .lg-countdown__bar > span { background: var(--lose); }
.lg-countdown.is-floating { position: fixed; top: 60px; right: 12px; z-index: 60; }
@keyframes lg-tick { 50% { transform: scale(1.15); } }
.lg-pause { align-self: center; }
.lg-pause.is-on { border-color: var(--push); color: var(--push); }

/* ------------------------------------------------------------ 桌面 */
.lg-game { position: relative; }
.lg-table, .lg-felt {
  position: relative;
  background: radial-gradient(ellipse at 50% 30%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
  border-radius: 20px; padding: 14px 12px;
  box-shadow: inset 0 0 0 3px #5b3a1d, inset 0 0 0 6px #3b2411, inset 0 0 40px rgba(0, 0, 0, .45), var(--shadow);
  color: var(--line);
  overflow-x: auto;
}
.lg-table__line { border: 2px solid var(--line-soft); border-radius: 14px; padding: 8px; }
.lg-table__label { color: var(--line); text-transform: uppercase; letter-spacing: .12em; font-size: .72em; opacity: .8; text-align: center; }
.lg-hand { display: flex; gap: 6px; justify-content: center; align-items: center; min-height: 84px; flex-wrap: wrap; }
.lg-hand--sm { min-height: 60px; }
.lg-hand__label { font-size: .8em; color: var(--line); opacity: .85; text-align: center; }
.lg-hand__total { display: inline-block; min-width: 28px; padding: 1px 8px; border-radius: 999px; background: rgba(0, 0, 0, .35); color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }

/* 下注格 */
[data-bet] {
  position: relative; min-width: 56px; min-height: 44px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  border: 2px solid var(--line-soft); border-radius: 10px; padding: 6px 8px 24px;
  color: var(--line); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: background .15s, border-color .15s, opacity .25s, box-shadow .2s;
}
[data-bet]:hover { background: rgba(255, 255, 255, .06); }
[data-bet]:active { background: rgba(255, 255, 255, .12); }
[data-bet].has-bet { border-color: var(--gold); background: rgba(217, 180, 81, .08); }
[data-bet].is-disabled, [data-bet][data-bet-disabled] { opacity: .4; cursor: not-allowed; }
[data-bet].is-win { border-color: var(--win); box-shadow: 0 0 0 2px var(--win), 0 0 18px rgba(61, 220, 132, .5); }
[data-bet].is-lose { opacity: .55; }
[data-bet].is-bump .lg-chipstack { animation: lg-bump .25s ease-out; }
.is-bets-locked [data-bet] { cursor: not-allowed; }
@keyframes lg-bump { from { transform: translateY(-8px) scale(1.1); } }
.lg-spot { }
.lg-spot__zh { font-weight: 800; font-size: 1.05em; line-height: 1.2; }
.lg-spot__en { text-transform: uppercase; letter-spacing: .1em; font-size: .68em; opacity: .85; line-height: 1.2; }
.lg-spot__odds { color: var(--gold); font-weight: 700; font-size: .78em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.lg-spot__stack { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); pointer-events: none; z-index: 2; }

/* ------------------------------------------------------------ 撲克牌 */
.lg-card {
  --w: 56px; --h: 80px;
  position: relative; flex: 0 0 auto; width: var(--w); height: var(--h);
  border-radius: 7px; background: #fff; color: var(--black-suit);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .45); user-select: none;
  transition-property: transform, opacity; transition-duration: .15s; transition-timing-function: ease-in-out;
  font-family: Georgia, "Times New Roman", var(--font);
}
.lg-card--sm { --w: 40px; --h: 56px; border-radius: 5px; }
.lg-card--lg { --w: 76px; --h: 108px; border-radius: 9px; }
.lg-card--red { color: var(--red-suit); }
.lg-card--black { color: var(--black-suit); }
.lg-card.is-dim { opacity: .45; }
.lg-card.is-flipping { transform: scaleX(0); }
.lg-card.is-held { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--gold), 0 6px 12px rgba(0, 0, 0, .5); }
.lg-card.is-win { box-shadow: 0 0 0 3px var(--win), 0 0 14px rgba(61, 220, 132, .6); }
.lg-card__face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: inherit; background: #fff; overflow: hidden; }
.lg-card__tl, .lg-card__br { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: .95; font-size: calc(var(--w) * .27); }
.lg-card__tl b, .lg-card__br b { font-weight: 800; letter-spacing: -.04em; }
.lg-card__tl { top: 3px; left: 4px; }
.lg-card__br { bottom: 3px; right: 4px; transform: rotate(180deg); }
.lg-card__pip { font-size: calc(var(--w) * .55); line-height: 1; }
.lg-card__pip--court { font-size: calc(var(--w) * .36); font-weight: 800; border: 1px solid currentColor; border-radius: 4px; padding: 2px 3px; }
.lg-card__pip--joker { font-size: calc(var(--w) * .2); font-weight: 800; writing-mode: vertical-rl; letter-spacing: .1em; }
.lg-card--sm .lg-card__br { display: none; }
.lg-card--sm .lg-card__pip { font-size: calc(var(--w) * .5); margin-top: 10px; }
.lg-card__back {
  position: absolute; inset: 0; border-radius: inherit; display: none;
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .14) 0 3px, transparent 3px 7px),
    repeating-linear-gradient(-45deg, rgba(255, 255, 255, .14) 0 3px, transparent 3px 7px),
    linear-gradient(135deg, #9b1c2c, #6a0f1c);
  border: 3px solid #fff;
}
.lg-card.is-facedown .lg-card__face { display: none; }
.lg-card.is-facedown .lg-card__back { display: block; }
/* 咪牌 */
.lg-card.is-squeeze { cursor: grab; touch-action: none; }
.lg-card.is-squeeze:active { cursor: grabbing; }
.lg-card.is-squeeze .lg-card__face { display: flex; z-index: 2; }
.lg-card.is-squeeze .lg-card__back { display: block; z-index: 1; }
.lg-card__hint {
  position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); white-space: nowrap;
  font-size: 11px; color: var(--gold); font-family: var(--font); pointer-events: none; animation: lg-breathe-text 1.6s infinite;
}
.lg-card.is-revealed { animation: lg-pop .3s ease-out; }
@keyframes lg-pop { 50% { transform: scale(1.08); } }
@keyframes lg-breathe-text { 50% { opacity: .45; } }

/* ------------------------------------------------------------ 籌碼 */
.lg-chips { display: flex; gap: 8px; padding: 10px 8px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.lg-chips::-webkit-scrollbar { display: none; }
.lg-chip {
  --c: var(--chip-gray);
  flex: 0 0 auto; width: 50px; height: 50px; border-radius: 50%; position: relative; cursor: pointer; padding: 0;
  border: 0; color: #fff; font-weight: 800; font-size: 14px;
  background:
    radial-gradient(circle, var(--c) 0 52%, transparent 53%),
    repeating-conic-gradient(var(--c) 0 20deg, #fff 20deg 30deg, var(--c) 30deg 45deg);
  box-shadow: 0 0 0 2px rgba(0, 0, 0, .35), 0 3px 6px rgba(0, 0, 0, .5);
  transition: transform .12s, box-shadow .12s, opacity .15s, filter .15s;
}
.lg-chip__v { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .7); text-shadow: 0 1px 2px rgba(0, 0, 0, .6); font-size: 12px; }
.lg-chip.is-selected { transform: translateY(-5px); box-shadow: 0 0 0 3px var(--gold), 0 8px 12px rgba(0, 0, 0, .55); }
.lg-chip.is-unaffordable { opacity: .35; filter: grayscale(.8); }
.lg-chips.is-disabled .lg-chip { opacity: .35; cursor: not-allowed; }
.lg-chip--blue { --c: var(--chip-blue); }
.lg-chip--green { --c: var(--chip-green); }
.lg-chip--orange { --c: var(--chip-orange); }
.lg-chip--black { --c: var(--chip-black); }
.lg-chip--purple { --c: var(--chip-purple); }
.lg-chip--yellow { --c: var(--chip-yellow); color: #3a2c00; }
.lg-chip--yellow .lg-chip__v { text-shadow: none; border-color: rgba(0, 0, 0, .45); }
.lg-chip--gray { --c: var(--chip-gray); }
/* 籌碼堆 */
.lg-chipstack { position: relative; display: flex; align-items: center; gap: 3px; height: 18px; padding-left: 18px; }
.lg-chipstack__chip {
  position: absolute; left: 0; top: calc(9px - var(--i) * 2px - 1px); width: 18px; height: 10px; border-radius: 50%;
  background: var(--c, var(--chip-gray)); border: 1px dashed rgba(255, 255, 255, .85);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .6);
}
.lg-chipstack__amt {
  margin-left: 3px; padding: 0 5px; border-radius: 999px; background: rgba(0, 0, 0, .72); color: #fff;
  font-size: 10px; font-weight: 700; white-space: nowrap; line-height: 16px; font-family: var(--font);
}

/* ------------------------------------------------------------ 動作列 / 下注列 */
.lg-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px 8px 0; }
.lg-actions:empty { display: none; }
.lg-actions .lg-btn { flex: 1 1 auto; max-width: 220px; }
.lg-deal { min-width: 140px; }
.lg-window-bar { display: flex; justify-content: center; padding-top: 8px; }
.lg-window-bar:empty { display: none; }
.lg-betbar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; flex-wrap: wrap; }
.lg-betbar__sp { flex: 1; }
.lg-betbar__total { white-space: nowrap; }
.lg-betbar__total b { color: var(--gold); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ 提示面板（練習） */
.lg-strategy { margin: 12px 8px 0; padding: 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
.lg-strategy__title { font-size: 1em; color: var(--gold); }
.lg-hint { color: var(--push); font-size: .9em; }
.lg-hint--danger { color: var(--lose); }

/* ------------------------------------------------------------ 表格 / 分頁 */
.lg-tablewrap { overflow-x: auto; max-width: 100%; }
.lg-datatable { border-collapse: collapse; width: 100%; font-size: .9em; font-variant-numeric: tabular-nums; }
.lg-datatable caption { text-align: left; color: var(--muted); padding: 4px 0; caption-side: top; }
.lg-datatable th, .lg-datatable td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.lg-datatable th { color: var(--muted); font-weight: 600; background: var(--panel-2); position: sticky; top: 0; }
.lg-datatable tr.is-hl td, .lg-datatable td.is-hl { background: rgba(217, 180, 81, .18); color: var(--gold); }
.lg-tabs__bar { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); }
.lg-tabs__btn { min-height: 40px; padding: 6px 12px; background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; color: var(--muted); }
.lg-tabs__btn.is-active { color: var(--gold); border-bottom-color: var(--gold); }
.lg-tabs__panel { padding: 10px 0; }

/* ------------------------------------------------------------ Toast / Modal */
.lg-toasts { position: fixed; top: calc(var(--topbar-h) + 8px); left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 24px); }
.lg-toast { background: rgba(35, 44, 54, .97); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 999px; box-shadow: var(--shadow); font-size: .92em; animation: lg-toast-in .2s ease-out; text-align: center; }
.lg-toast--warn { border-color: var(--push); }
.lg-toast.is-out { opacity: 0; transition: opacity .25s; }
@keyframes lg-toast-in { from { opacity: 0; transform: translateY(-8px); } }
.lg-modal-backdrop { position: fixed; inset: 0; z-index: 150; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; padding: 16px; animation: lg-fade .15s; }
.lg-modal-backdrop.is-out { opacity: 0; transition: opacity .15s; }
.lg-modal { width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); animation: lg-rise .2s ease-out; }
.lg-modal--wide { max-width: 720px; }
.lg-modal__title { font-size: 1.15em; margin-bottom: 10px; }
.lg-modal__body { color: var(--text); }
.lg-modal__body h3 { font-size: 1em; color: var(--gold); margin-top: .6em; }
.lg-modal__actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
@keyframes lg-fade { from { opacity: 0; } }
@keyframes lg-rise { from { opacity: 0; transform: translateY(16px); } }

/* ------------------------------------------------------------ 結果面板（練習/教學） */
.lg-result {
  position: fixed; left: 50%; bottom: 0; z-index: 90; width: min(100%, 640px); transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--border); border-bottom: 0; border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .55); padding: 6px 16px calc(14px + env(safe-area-inset-bottom));
  animation: lg-slide-up .25s ease-out; max-height: 70vh; overflow: auto; transition: transform .15s;
}
.lg-result.is-out { opacity: 0; transition: opacity .2s; }
.lg-result__head { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; position: relative; touch-action: none; cursor: grab; }
.lg-result__grip { position: absolute; top: 2px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: #45515e; }
.lg-result__title { flex: 1; }
.lg-result__net { font-weight: 800; font-size: 1.2em; font-variant-numeric: tabular-nums; }
.lg-result.is-win .lg-result__net { color: var(--win); }
.lg-result.is-lose .lg-result__net { color: var(--lose); }
.lg-result.is-push .lg-result__net { color: var(--push); }
.lg-result.is-win { border-top: 3px solid var(--win); }
.lg-result.is-lose { border-top: 3px solid var(--lose); }
.lg-result.is-push { border-top: 3px solid var(--push); }
.lg-result__x { min-width: var(--tap); min-height: var(--tap); border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); }
.lg-result__rows { display: grid; gap: 8px; }
.lg-result__row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.lg-result__k { color: var(--muted); font-size: .85em; line-height: 1.3; }
.lg-result__k .en { display: block; }
.lg-result__v { font-variant-numeric: tabular-nums; }
.lg-result__v .lg-card { vertical-align: middle; }
.lg-result__actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
@keyframes lg-slide-up { from { transform: translate(-50%, 100%); } }

/* 真實模式：派彩閃示 */
.lg-flash {
  position: fixed; left: 50%; top: 42%; z-index: 95; transform: translate(-50%, -50%);
  font-size: 44px; font-weight: 900; padding: 8px 22px; border-radius: 16px; background: rgba(0, 0, 0, .72);
  pointer-events: none; animation: lg-flash 1.2s ease-out forwards; white-space: nowrap;
}
.lg-flash.is-win { color: var(--win); }
.lg-flash.is-lose { color: var(--lose); }
.lg-flash.is-push { color: var(--push); }
@keyframes lg-flash { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }

/* ------------------------------------------------------------ 教學 spotlight */
.lg-spot--hl {
  position: relative; z-index: 5;
  outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 10px;
  animation: lg-breathe 1.4s ease-in-out infinite;
}
.lg-dimmed { opacity: .35 !important; transition: opacity .25s; }
@keyframes lg-breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 180, 81, .75); } 50% { box-shadow: 0 0 0 8px rgba(217, 180, 81, 0), 0 0 22px rgba(217, 180, 81, .55); } }

/* ------------------------------------------------------------ 教學底部工作表 */
.lg-tutor {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 80;
  width: min(100%, 640px); max-height: 46vh; display: flex; flex-direction: column;
  background: #18202a; border: 1px solid var(--gold-soft); border-bottom: 0; border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .6); padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
}
.lg-tutor.is-min .lg-tutor__scroll, .lg-tutor.is-min .lg-tutor__bar { display: none; }
.lg-tutor__top { display: flex; align-items: center; gap: 6px; }
.lg-tutor__tabs { flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.lg-tutor__tab { min-height: 34px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: transparent; cursor: pointer; white-space: nowrap; font-size: .82em; color: var(--muted); }
.lg-tutor__tab.is-active { border-color: var(--gold); color: var(--gold); }
.lg-tutor__tab:disabled { opacity: .35; }
.lg-tutor__min { min-width: 40px; min-height: 34px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; }
.lg-tutor__head { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.lg-tutor__title { flex: 1; font-size: 1.05em; margin: 0; }
.lg-tutor__count { color: var(--muted); font-size: .85em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lg-tutor__bar { height: 3px; background: #2d3843; border-radius: 2px; margin: 6px 0; overflow: hidden; }
.lg-tutor__bar > span { display: block; height: 100%; background: var(--gold); transition: width .25s; }
.lg-tutor__scroll { overflow-y: auto; flex: 1; min-height: 0; }
.lg-tutor__body p { margin: 0 0 .5em; }
.lg-tutor__body b { color: var(--gold); }
.lg-tutor__body table { font-size: .85em; }
.lg-tutor__action { margin-top: 6px; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--gold); background: rgba(217, 180, 81, .08); }
.lg-tutor__action.is-done { border-style: solid; border-color: var(--win); background: rgba(61, 220, 132, .08); }
.lg-tutor__badge { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--gold); color: #1b1606; font-size: .78em; font-weight: 700; margin-right: 4px; }
.lg-tutor__action.is-done .lg-tutor__badge { background: var(--win); }
.lg-tutor__hint { font-size: .85em; color: var(--muted); margin-top: 3px; }
.lg-tutor__nav { display: flex; gap: 8px; justify-content: space-between; padding-top: 8px; }
.lg-tutor__nav .lg-btn { flex: 1; }

/* ------------------------------------------------------------ 破產覆蓋層 */
.lg-broke { position: fixed; inset: 0; z-index: 120; background: rgba(8, 10, 12, .88); display: flex; align-items: center; justify-content: center; padding: 16px; animation: lg-fade .25s; }
.lg-broke__box { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--lose); border-radius: 16px; padding: 20px; }
.lg-broke__box h2 { color: var(--lose); }
.lg-broke__actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }

/* ------------------------------------------------------------ 首頁 */
.lg-page--home { padding: 0 12px 32px; }
.lg-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 20px 0 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.lg-hero__title { font-size: 1.6em; margin: 0; background: linear-gradient(90deg, #f3dc8c, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lg-hero__sub { color: var(--muted); margin: 2px 0 0; }
.lg-hero__right { display: flex; align-items: center; gap: 10px; }
.lg-hero__balance { display: flex; flex-direction: column; align-items: flex-end; }
.lg-hero__balance small { color: var(--muted); font-size: .8em; }
.lg-hero__balance .lg-balance { font-size: 1.9em; font-weight: 800; color: var(--gold); line-height: 1.1; }
.lg-cat { margin-top: 18px; }
.lg-cat__title { font-size: 1.15em; display: flex; align-items: baseline; gap: 6px; }
.lg-cards-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .lg-cards-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .lg-cards-grid { grid-template-columns: 1fr 1fr 1fr; } }
.lg-gcard { background: linear-gradient(160deg, #1d2833, var(--panel)); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.lg-gcard:hover, .lg-gcard.is-open { border-color: var(--gold-soft); }
.lg-gcard__head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.lg-gcard__name { font-size: 1.1em; margin: 0; }
.lg-gcard__en { color: var(--muted); font-size: .82em; }
.lg-gcard__summary { color: #cfd6dc; font-size: .9em; margin: 0; }
.lg-gcard__edge { font-size: .85em; color: var(--gold); }
.lg-gcard__stats { font-size: .82em; color: var(--muted); }
.lg-gcard__modes { display: flex; gap: 6px; margin-top: 4px; }
.lg-gcard__modes .lg-btn { flex: 1; padding: 4px 6px; font-size: .85em; }
.lg-ring {
  --p: 0; flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
  background: conic-gradient(var(--win) calc(var(--p) * 1%), #2d3843 0);
  display: grid; place-items: center;
}
.lg-ring > span { width: 36px; height: 36px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lg-home__lb { margin-top: 26px; }
.lg-lb td:first-child, .lg-lb th:first-child { width: 28px; text-align: center; color: var(--muted); }
.lg-lb__edge { white-space: nowrap; font-weight: 700; color: var(--gold); }
.lg-lb__edge small { display: block; font-weight: 400; color: var(--muted); font-size: .8em; }
.lg-lb__room td { color: var(--muted); border-top: 2px solid var(--border); }
.lg-lb__room .lg-lb__edge { white-space: normal; color: var(--accent); font-weight: 600; }
.lg-lb a { color: var(--text); }
.lg-foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: .85em; }

/* ------------------------------------------------------------ 老虎機 */
.lg-slot { position: relative; padding: 8px; border-radius: 14px; background: linear-gradient(180deg, #2a1236, #150a1c); box-shadow: inset 0 0 0 3px #b8943a, inset 0 0 0 6px #5b3a1d, var(--shadow); }
.lg-slot__grid { display: grid; grid-template-columns: repeat(var(--reels), 1fr); gap: 4px; }
.lg-reel { display: grid; grid-template-rows: repeat(var(--rows), 1fr); gap: 4px; }
.lg-reel.is-stop { animation: lg-reel-stop .18s ease-out; }
@keyframes lg-reel-stop { 40% { transform: translateY(5px); } }
.lg-slot__cell {
  position: relative; aspect-ratio: 1 / 1; min-height: 44px; overflow: hidden; border-radius: 8px;
  background: linear-gradient(180deg, #fdfaf1, #e7dfc9); display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, .3);
}
.lg-slot__sym { font-size: clamp(18px, 7vw, 34px); font-weight: 900; line-height: 1; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: #333; }
.lg-slot__sym svg { width: 70%; height: 70%; }
.lg-slot__sym.is-long { font-size: clamp(10px, 3.2vw, 16px); letter-spacing: -.02em; }
.lg-slot__cell.is-blur .lg-slot__sym { filter: blur(1.5px); }
.lg-slot__cell.is-win { box-shadow: inset 0 0 0 3px var(--gold), 0 0 16px rgba(217, 180, 81, .8); animation: lg-win-cell .8s ease-in-out infinite; }
.lg-slot.has-win .lg-slot__cell:not(.is-win) { opacity: .55; }
.lg-slot__cell.is-locked { box-shadow: inset 0 0 0 3px var(--accent); }
.lg-slot__cell.is-locked::after { content: "HOLD"; position: absolute; top: 2px; left: 3px; font-size: 8px; font-weight: 800; color: var(--accent); }
.lg-slot__value { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; background: rgba(0, 0, 0, .35); }
.lg-slot__lines { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); pointer-events: none; }
@keyframes lg-win-cell { 50% { transform: scale(1.04); } }
.lg-betpanel { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; padding: 10px 8px; }
.lg-betpanel.is-disabled { opacity: .6; }
.lg-betpanel__group { display: flex; flex-direction: column; gap: 2px; }
.lg-betpanel__k { font-size: .78em; color: var(--muted); }
.lg-betpanel__stepper { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.lg-betpanel__btn { min-width: 36px; padding: 0; font-size: 18px; }
.lg-betpanel__v { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.lg-betpanel__max { background: #6a1b1b; border-color: #a33; }
.lg-betpanel.is-max .lg-betpanel__max { background: var(--lose); color: #fff; }
.lg-betpanel__total { flex: 1 1 auto; text-align: right; font-size: .92em; white-space: nowrap; align-self: center; }
.lg-betpanel__total b { color: var(--gold); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ 桌機 */
@media (min-width: 900px) {
  body { font-size: 16px; }
  .lg-page--game.has-strategy { max-width: 1220px; }
  .lg-page--game.has-strategy .lg-game-wrap { display: grid; grid-template-columns: minmax(0, 900px) 300px; gap: 12px; align-items: start; }
  .lg-page--game.has-strategy .lg-strategy { margin: 0; position: sticky; top: calc(var(--topbar-h) + 8px); max-height: calc(100vh - 80px); overflow: auto; }
}
@media (max-width: 440px) {
  .lg-seg__btn { padding: 6px 12px; }
  .lg-seg__btn .en, .lg-tutor__tab .en, .lg-switch .en { display: none; }
}

/* ------------------------------------------------------------ 減少動態 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .lg-flash { animation: none; }
}


/* ==== src/games/_demo.css ==== */
/* 示範遊戲「猜大小」— 遊戲樣式只用自己的前綴（demo-） */
.demo-table { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.demo-cardslot { min-height: 116px; }
.demo-rule { text-align: center; font-size: .85em; opacity: .85; }
.demo-spots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 10px; }
.demo-spot { min-height: 96px; padding-bottom: 28px; }
.demo-spot .lg-spot__zh { font-size: 1.6em; }
.demo-spot__rule { font-size: .72em; opacity: .7; }
.demo-hint { margin: 8px 8px 0; }


/* ==== src/games/baccarat.css ==== */
/* 百家樂 Baccarat — 樣式只用 bac- 前綴。桌面配置見 docs/05-game-rules/baccarat.md §4 */
.bac-table { display: flex; flex-direction: column; gap: 10px; --bac-red: #ff8f8f; --bac-blue: #8fbaff; --bac-green: #7ee2a8; }

/* ---- 牌區：莊左、閒右（面向荷官） */
.bac-cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.bac-hand { min-width: 0; border: 1px dashed var(--line-soft); border-radius: 12px; padding: 6px 4px 8px; transition: box-shadow .2s; }
.bac-hand.is-winner { box-shadow: 0 0 0 2px var(--win), 0 0 16px rgba(61, 220, 132, .45); }
.bac-hand__head { display: flex; justify-content: center; align-items: center; gap: 6px; font-weight: 700; font-size: .85em; margin-bottom: 4px; }
.bac-hand.is-banker .bac-hand__name { color: var(--bac-red); }
.bac-hand.is-player .bac-hand__name { color: var(--bac-blue); }
.bac-hand__cards { min-height: 72px; gap: 4px; flex-wrap: nowrap; }
.bac-hand .lg-card { --w: 46px; --h: 66px; }
.bac-table[data-variant="squeeze"] .bac-hand__cards { padding-bottom: 20px; min-height: 92px; }
.bac-card--third { margin-left: 4px; box-shadow: 0 0 0 2px var(--gold), 0 2px 6px rgba(0, 0, 0, .45); }
.bac-order {
  position: absolute; top: -8px; right: -8px; z-index: 3; width: 20px; height: 20px; border-radius: 50%;
  background: var(--gold); color: #1a1a1a; font: 700 12px/20px var(--font); text-align: center;
}

/* ---- 下注格 */
.bac-pairs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.bac-main { display: grid; gap: 8px; }
.bac-spot { min-width: 0; }
.bac-spot--main { min-height: 64px; }
.bac-spot--main .lg-spot__zh { font-size: 1.35em; }
.bac-spot--banker { border-color: rgba(255, 143, 143, .75); }
.bac-spot--banker .lg-spot__zh, .bac-spot--bankerPair .lg-spot__zh { color: var(--bac-red); }
.bac-spot--player { border-color: rgba(143, 186, 255, .75); }
.bac-spot--player .lg-spot__zh, .bac-spot--playerPair .lg-spot__zh { color: var(--bac-blue); }
.bac-spot--tie { border-color: rgba(126, 226, 168, .75); }
.bac-spot--tie .lg-spot__zh { color: var(--bac-green); }
.bac-spot__rule { font-size: .66em; opacity: .72; line-height: 1.25; }
.bac-note { font-size: .7em; color: var(--push); line-height: 1.25; margin-top: 2px; }
.bac-note small { font-size: .95em; opacity: .85; }
.bac-risk { display: none; font-size: .66em; color: var(--lose); font-weight: 700; line-height: 1.25; }
.bac-hints-on .bac-risk { display: block; }
.bac-sides { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.bac-sides--1 { grid-template-columns: minmax(0, 1fr); }
.bac-sides .lg-spot__en { font-size: .6em; letter-spacing: .04em; }
.bac-sides .lg-spot__odds { font-size: .72em; }

/* ---- 路單：珠盤路 6 行 × N 欄（可橫捲） */
.bac-road { border-top: 1px solid var(--line-soft); padding-top: 6px; }
.bac-road__head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: .8em; }
.bac-road__title { font-weight: 700; }
.bac-road__count { font-variant-numeric: tabular-nums; opacity: .9; }
.bac-road__scroll { overflow-x: auto; margin-top: 4px; border-radius: 6px; background: #f6f1e3; padding: 3px; }
.bac-bead {
  --c: 22px;
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(6, var(--c)); grid-auto-columns: var(--c);
  gap: 1px; width: max-content; background: #d8cfb6;
}
.bac-bead__c {
  position: relative; width: var(--c); height: var(--c); background: #f6f1e3;
  display: flex; align-items: center; justify-content: center; font: 700 11px/1 var(--font); color: #fff;
}
.bac-bead__c.is-B, .bac-bead__c.is-P, .bac-bead__c.is-T { background-clip: content-box; padding: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.bac-bead__c.is-B { background-color: #d0202b; }
.bac-bead__c.is-P { background-color: #2463d6; }
.bac-bead__c.is-T { background-color: #1f9d55; }
.bac-bead__bp, .bac-bead__pp { position: absolute; width: 7px; height: 7px; border-radius: 50%; border: 1px solid #fff; }
.bac-bead__bp { top: 0; left: 0; background: #d0202b; }
.bac-bead__pp { bottom: 0; right: 0; background: #2463d6; }
.bac-road__note { font-size: .72em; opacity: .75; margin-top: 3px; }

/* ---- 提示 / 教學互動題 */
.bac-hint { margin: 8px 8px 0; }
.bac-quiz { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.bac-quiz__opt { min-width: 86px; }
.bac-quiz__opt.is-right { border-color: var(--win); color: var(--win); }
.bac-quiz__opt.is-wrong { border-color: var(--lose); color: var(--lose); }

@media (min-width: 600px) {
  .bac-hand .lg-card { --w: 56px; --h: 80px; }
  .bac-hand__cards { min-height: 86px; }
  .bac-sides { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .bac-sides--1 { grid-template-columns: minmax(0, 1fr); }
  .bac-bead { --c: 26px; }
}


/* ==== src/games/blackjack.css ==== */
/* 21 點 Blackjack — 半圓桌（荷官在直邊、5 座位在弧邊）。前綴 bj- */
.bj-table {
  padding: 10px 8px 26px;
  border-radius: 18px 18px 50% 50% / 18px 18px 26% 26%;
}
.bj-felt { position: relative; min-width: 340px; display: flex; flex-direction: column; gap: 2px; }

/* 荷官區：棄牌盒（荷官右手 = 畫面左）、莊家牌、牌靴（荷官左手 = 畫面右） */
.bj-top { display: grid; grid-template-columns: 54px 1fr 54px; align-items: start; gap: 6px; }
.bj-shoe, .bj-discard {
  min-height: 62px; padding: 4px 2px; border-radius: 8px; text-align: center; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .72em;
}
.bj-shoe { background: linear-gradient(160deg, #6b4a26, #3b2411); border: 2px solid #8a6a3a; color: var(--line); box-shadow: 0 3px 6px rgba(0, 0, 0, .45); }
.bj-discard { border: 2px dashed var(--line-soft); background: rgba(0, 0, 0, .18); }
.bj-box__zh { font-weight: 700; }
.bj-box__en { font-size: .82em; opacity: .75; letter-spacing: .08em; }
.bj-box__n { font-size: .85em; color: var(--gold); font-variant-numeric: tabular-nums; }
.bj-dealer { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.bj-dcards { gap: 0; min-height: 84px; flex-wrap: nowrap; }
.bj-dcards .lg-card + .lg-card { margin-left: -22px; }
.bj-total { margin-left: 4px; }

/* 桌面印字 */
.bj-print { text-align: center; color: var(--line); line-height: 1.25; margin-top: 2px; }
.bj-print b { display: block; color: var(--gold); letter-spacing: .1em; font-size: .8em; }
.bj-print span { display: block; letter-spacing: .1em; font-size: .64em; }
.bj-print small { display: block; font-size: .64em; opacity: .7; }

/* 弧形保險線 */
.bj-insline { display: flex; flex-direction: column; align-items: center; }
.bj-arcwrap { width: 100%; }
.bj-arc { display: block; width: 100%; height: auto; overflow: visible; }
.bj-arc text { fill: var(--gold); font-size: 12.5px; font-weight: 700; letter-spacing: 2.5px; font-family: var(--font); }
.bj-arc .bj-arc-line { fill: none; stroke: var(--line-soft); stroke-width: 2; }
.bj-ins-spot {
  flex-direction: row; gap: 5px; min-height: 44px; min-width: 120px; margin-top: -4px;
  padding: 4px 12px 20px; border-radius: 999px; border-style: dashed;
}
.bj-ins-spot .lg-spot__zh { font-size: .9em; }
.bj-ins-spot .lg-spot__odds { margin-top: 0; }

/* 座位：5 → 1（畫面左 → 右），弧形排列（中間座位最低） */
.bj-seats {
  display: grid; align-items: end; gap: 4px; margin-top: 6px;
  grid-template-columns: minmax(44px, 1fr) minmax(44px, 1fr) auto minmax(44px, 1fr) minmax(44px, 1fr);
}
.bj-seat { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.bj-seat--5, .bj-seat--1 { margin-bottom: 58px; }
.bj-seat--4, .bj-seat--2 { margin-bottom: 20px; }
.bj-seat__ring { width: 44px; height: 44px; border-radius: 50%; border: 2px dashed var(--line-soft); opacity: .6; }
.bj-seat__label { font-size: .68em; color: var(--line); opacity: .8; text-align: center; line-height: 1.2; white-space: nowrap; }
.bj-seat__label small { display: block; color: var(--gold); font-size: .95em; }
.bj-felt.is-split .bj-seats { grid-template-columns: 28px 28px auto 28px 28px; }
.bj-felt.is-split .bj-seat__ring { width: 24px; height: 24px; }
.bj-felt.is-split .bj-seat--empty .bj-seat__label { display: none; }

/* 你的手牌（最多 4 手） */
.bj-hands { display: flex; gap: 6px; justify-content: center; align-items: flex-end; }
.bj-hand {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px; border-radius: 12px; border: 2px solid transparent; transition: border-color .2s, background .2s;
}
.bj-hand.is-active { border-color: var(--gold); background: rgba(217, 180, 81, .1); }
.bj-hcards { display: flex; align-items: flex-end; min-height: 80px; }
.bj-hands.is-many .bj-hcards { min-height: 56px; }
.bj-hcards .lg-card--md + .lg-card { margin-left: -34px; }
.bj-hcards .lg-card--sm + .lg-card { margin-left: -24px; }
.bj-hcards:empty::before {
  content: ""; width: 56px; height: 80px; border-radius: 7px; border: 1px dashed rgba(243, 233, 201, .25);
}
.bj-hands.is-many .bj-hcards:empty::before { width: 40px; height: 56px; }
.bj-hand__meta { display: flex; align-items: center; gap: 4px; min-height: 22px; }
.bj-tag { font-size: .72em; font-weight: 800; padding: 1px 7px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bj-tag.is-win { background: var(--win); color: #062312; }
.bj-tag.is-blackjack { background: var(--gold); color: #1b1606; }
.bj-tag.is-lose { background: var(--lose); color: #2a0707; }
.bj-tag.is-push { background: var(--push); color: #2a2107; }
.bj-tag.is-note { background: rgba(0, 0, 0, .4); color: var(--line); font-weight: 600; }
.bj-spot { width: 76px; height: 76px; min-width: 76px; border-radius: 50%; padding: 4px 4px 20px; }
.bj-spot .lg-spot__zh { font-size: .95em; }
.bj-spot .lg-spot__en { font-size: .58em; }
.bj-spot .lg-spot__odds { font-size: .6em; white-space: nowrap; }
.bj-hands.is-many .bj-spot { width: 64px; height: 64px; min-width: 64px; }
.bj-old .lg-card { opacity: .45; }

.lg-card.bj-in { animation: bj-in .28s ease-out; }
@keyframes bj-in { from { opacity: 0; transform: translate(36px, -70px) rotate(10deg); } }
@media (prefers-reduced-motion: reduce) { .lg-card.bj-in { animation: none; } }

/* 提示 / 餘額不足 */
.bj-advice {
  margin: 8px 8px 0; padding: 6px 10px; border-radius: 8px; text-align: center;
  background: rgba(255, 209, 102, .1); border: 1px solid rgba(255, 209, 102, .35);
}
.bj-advice small { color: var(--muted); }
.bj-note { margin: 6px 8px 0; font-size: .85em; color: var(--lose); text-align: center; }

/* 動作列（真實模式加手勢文字） */
.bj-actions .lg-btn { min-width: 76px; }
.bj-actions.is-real .lg-btn { flex-direction: column; gap: 0; line-height: 1.2; padding: 6px 10px; white-space: normal; }
.bj-gesture { display: block; font-size: .72em; font-weight: 500; opacity: .8; }

/* 策略表（教學與提示面板） */
.bj-strategy .lg-datatable { font-size: .78em; }
.bj-strategy .lg-datatable th, .bj-strategy .lg-datatable td { padding: 3px 4px; text-align: center; border: 1px solid var(--border); }
.bj-strategy .lg-datatable tbody th { white-space: nowrap; }
.bj-c--S { background: rgba(255, 92, 92, .22); }
.bj-c--D, .bj-c--Ds { background: rgba(79, 156, 255, .28); }
.bj-c--P { background: rgba(61, 220, 132, .25); }
.bj-strategy td.is-hl { outline: 2px solid var(--gold); outline-offset: -2px; background: rgba(217, 180, 81, .55); color: #fff; font-weight: 800; }
.bj-strat .lg-muted { font-size: .8em; }

/* 教學練習題 */
.bj-quiz { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.bj-quiz .lg-btn.is-picked { border-color: var(--gold); background: rgba(217, 180, 81, .22); }


/* ==== src/games/caribbean-stud.css ==== */

/* ==== src/games/casino-holdem.css ==== */
/* Casino Hold'em — 前綴 ch- */
.ch-table { display: flex; flex-direction: column; gap: 6px; align-items: stretch; padding-bottom: 12px; }
.ch-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ch-hand { min-height: 84px; }
.ch-badge { min-height: 1.3em; font-size: .78em; color: var(--line); opacity: .9; text-align: center; line-height: 1.3; }
.ch-badge:empty { visibility: hidden; }
.ch-badge.is-win { color: var(--win); font-weight: 700; opacity: 1; }
.ch-board { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; }
.ch-slot {
  width: 56px; height: 80px; flex: 0 0 auto; border-radius: 7px;
  border: 2px dashed var(--line-soft); display: flex; align-items: center; justify-content: center;
}
.ch-slot:not(:empty) { border-color: transparent; }
.ch-slot:empty::before { content: attr(data-label); color: var(--line); opacity: .55; font-weight: 800; letter-spacing: .1em; }
.ch-slot[data-slot="3"] { margin-left: 4px; }
.ch-rule { text-align: center; font-size: .74em; color: var(--gold); opacity: .9; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 3px 4px; margin: 2px 12px; }
.ch-spots { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 10px; margin-top: 4px; }
.ch-spot { min-height: 84px; border-radius: 50% / 42%; padding: 6px 4px 26px; }
.ch-spot--ante { border-width: 3px; }
.ch-spot--call { border-style: dashed; }
.ch-spot--call[data-bet-disabled] { opacity: .8; cursor: default; }
.ch-spot--call.has-bet { border-style: solid; }
.ch-spot--aa { border-color: var(--gold-soft); }
.ch-spot.is-lose { opacity: .55; }
.ch-spot .lg-spot__zh { font-size: 1em; }
.ch-ptbtn { align-self: flex-end; margin-top: 2px; }
.ch-hint { margin: 8px 8px 0; }
.ch-actions .lg-btn[hidden] { display: none; }

/* 結果面板 */
.ch-res { display: flex; flex-direction: column; gap: 4px; line-height: 1.6; }
.ch-res__k { display: inline-block; min-width: 5.5em; color: var(--muted); font-size: .88em; margin-right: 4px; }
.ch-res__sep { display: inline-block; width: 6px; }
.ch-mc { display: inline-block; min-width: 1.9em; margin: 0 2px 2px 0; padding: 0 3px; border-radius: 4px; background: #fff; color: #1a1a1a; font-weight: 800; font-size: .9em; text-align: center; line-height: 1.45; font-variant-numeric: tabular-nums; }
.ch-mc.is-red { color: #c62828; }
.ch-mc.is-hl { box-shadow: 0 0 0 2px var(--gold); }

@media (max-width: 360px) {
  .ch-slot { width: 48px; height: 70px; }
  .ch-board .lg-card { --w: 48px; --h: 70px; }
  .ch-board { gap: 4px; }
