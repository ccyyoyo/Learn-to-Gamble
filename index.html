      }
      function newAI(k) {
        return { name: pickName(), stack: LG.rng.int(8, 20) * 50, persona: LG.rng.pick(PERSONA_IDS), idx: k };
      }
      function createTable(nOpp, humanStack) {
        const players = [{ name: '你', stack: humanStack, isHuman: true }];
        if (isTut) {
          ['TAG', 'LAG', 'STATION'].forEach((p, k) => { S.usedNames.add(T.tutorialNames[k]); players.push({ name: T.tutorialNames[k], stack: 1000, persona: p }); });
        } else for (let k = 0; k < nOpp; k++) players.push(newAI(k + 1));
        S.table = new Table({ players, button: isTut ? 0 : LG.rng.int(0, players.length - 1) });
        buildSeats();
      }

      // ------------------------------------------------------------ 桌面 DOM（一次建好）
      function buildTable() {
        potEl = el('div.pr-pot', { html: `${term(T.pot.zh, T.pot.en.toUpperCase())} <b>${fmt(0)}</b>` });
        sidePotsEl = el('div.pr-sidepots');
        boardEl = el('div.pr-board', { 'aria-label': '公共牌 Community cards' },
          [0, 1, 2, 3, 4].map((k) => el('div.pr-board__slot', { dataset: { slot: k } })));
        statusEl = el('div.pr-status', { 'aria-live': 'polite' });
        seatsEl = el('div.pr-seats');
        dbtnEl = el('span.pr-dbtn', { title: '按鈕 Dealer button', text: 'D' });
        ovalEl = el('div.pr-oval', [
          el('div.pr-rail'),
          el('div.pr-center', [potEl, boardEl, sidePotsEl]),
          seatsEl,
        ]);
        tableEl = el('div.lg-table.pr-table', [ovalEl]);

        foldBtn = el('button', { type: 'button', class: 'lg-btn pr-btn pr-btn--fold', dataset: { action: 'fold' }, html: btnLabel(T.fold.zh, T.fold.en), on: { click: () => submit({ type: 'fold' }) } });
        callBtn = el('button', { type: 'button', class: 'lg-btn pr-btn pr-btn--call', dataset: { action: 'call' }, on: { click: onCall } });
        raiseBtn = el('button', { type: 'button', class: 'lg-btn lg-btn--primary pr-btn pr-btn--raise', dataset: { action: 'raise' }, on: { click: onRaise } });
        dealBtn = el('button', { type: 'button', class: 'lg-btn lg-btn--primary lg-deal pr-deal', dataset: { action: 'deal' }, html: term(T.deal.zh, T.deal.en), hidden: true, on: { click: onDeal } });
        actionsEl = el('div.lg-actions.pr-actions', [dealBtn, foldBtn, callBtn, raiseBtn]);

        slider = el('input', { type: 'range', class: 'pr-raise__slider', min: 0, max: 0, step: 1, 'aria-label': '加注金額 Raise amount' });
        slider.addEventListener('input', () => { S.lastQuick = null; paintRaise(); });
        amtEl = el('output.pr-raise__amt');
        const quick = (id, label) => el('button', { type: 'button', class: 'lg-btn lg-btn--sm pr-quick', dataset: { size: id }, text: label, on: { click: () => onQuick(id) } });
        raiseRow = el('div.pr-raise', [
          el('div.pr-raise__top', [el('span.pr-raise__k', { html: term('金額', 'Amount') }), amtEl]),
          slider,
          el('div.pr-raise__quick', [quick('half', T.quick.half), quick('threeq', T.quick.threeq), quick('pot', T.quick.pot), quick('allin', T.quick.allin)]),
        ]);
        hintEl = el('div.lg-hint.pr-hint', { hidden: true, 'aria-live': 'polite' });
        barEl = el('div.pr-bar');
        historyBody = el('div.pr-history__body');
        historyEl = el('details.pr-history', [el('summary', { html: term(T.history.zh, T.history.en) }), historyBody]);
        historyEl.addEventListener('toggle', () => { if (historyEl.open) S.historyOpened = true; });

        root.append(statusEl, tableEl, actionsEl, raiseRow, hintEl, barEl, historyEl);
        setActionsEnabled(false);
      }

      function buildSeats() {
        const t = S.table;
        seatsEl.innerHTML = '';
        const slots = SLOTS[t.n] || SLOTS[6];
        seatEls = t.seats.map((s, i) => {
          const [x, y] = slots[i];
          const e = el('div', {
            class: ['pr-seat', s.isHuman && 'pr-seat--you'], dataset: { seat: i, side: sideOf(slots[i]) },
            style: { left: x + '%', top: y + '%' },
          }, [
            el('div.pr-seat__cards'),
            el('div.pr-seat__box', [
              el('div.pr-seat__name'),
              el('div.pr-seat__stack'),
              el('div.pr-seat__tag', { hidden: true }),
              el('span.pr-pos', { hidden: true }),
            ]),
            el('div.pr-seat__act'),
            el('div.pr-seat__bet'),
          ]);
          seatsEl.appendChild(e);
          return e;
        });
        paintAll();
      }

      // ------------------------------------------------------------ 繪製
      function paintAll() {
        if (!S.table) return;
        S.table.seats.forEach((s, i) => paintSeat(i));
        paintCenter();
        paintStatus();
        paintBar();
        paintHistory();
      }

      function seatCardsKey(s, faceUp) { return s.inHand && !s.folded ? s.hole.map((c) => c.id).join('') + (faceUp ? '+' : '-') : s.folded && s.inHand ? 'folded' : 'none'; }

      function paintSeat(i) {
        const t = S.table, s = t.seats[i], e = seatEls[i];
        if (!e) return;
        const showPersona = !ctx.isReal && s.persona && s.shown;
        e.querySelector('.pr-seat__name').innerHTML = `${ui.esc(s.name)}${s.isHuman ? ' <i class="en">You</i>' : ''}`;
        const tagEl = e.querySelector('.pr-seat__tag');
        tagEl.innerHTML = showPersona ? `<span class="pr-tag pr-tag--${s.persona.toLowerCase()}">${PERSONAS[s.persona].zh} <i class="en">${PERSONAS[s.persona].en}</i></span>` : '';
        tagEl.hidden = !showPersona;
        e.querySelector('.pr-seat__stack').textContent = fmt(s.stack);
        const playing = t.phase !== 'idle';
        e.classList.toggle('is-turn', t.phase === 'play' && t.toAct === i);
        e.classList.toggle('is-folded', playing && s.inHand && s.folded);
        e.classList.toggle('is-out', playing && !s.inHand);
        e.classList.toggle('is-allin', s.allIn && t.phase === 'play');
        const won = t.phase === 'done' && t.result && t.result.won[i] > 0;
        e.classList.toggle('is-winner', !!won);

        // 暗牌
        const faceUp = s.isHuman || s.shown;
        const key = seatCardsKey(s, faceUp);
        const cardsEl = e.querySelector('.pr-seat__cards');
        if (cardsEl.dataset.key !== key) {
          cardsEl.dataset.key = key;
          cardsEl.innerHTML = '';
          if (s.inHand && s.hole.length && (!s.folded || s.isHuman)) {
            s.hole.forEach((c) => cardsEl.appendChild(ui.card(faceUp ? c : null, { faceDown: !faceUp, size: s.isHuman ? 'md' : 'sm', dim: s.folded })));
          }
        }
        // 下注籌碼
        const betEl = e.querySelector('.pr-seat__bet');
        const betAmt = t.phase === 'play' ? s.bet : 0;
        if (Number(betEl.dataset.amount || 0) !== betAmt) {
          betEl.dataset.amount = String(betAmt);
          betEl.innerHTML = '';
          if (betAmt > 0) betEl.appendChild(ui.chipStack(betAmt));
        }
        // 動作文字
        const actEl = e.querySelector('.pr-seat__act');
        let act = '';
        if (won) act = `贏 +${fmt(t.result.won[i])}`;
        else if (t.phase === 'done' && s.shown && t.result.hands[i] && !ctx.isReal) act = t.result.hands[i].name.zh;
        else if (playing && s.lastAction) act = actionText(s.lastAction.type, s.lastAction.type === 'fold' || s.lastAction.type === 'check' ? 0 : s.lastAction.amount);
        actEl.innerHTML = act;
        actEl.hidden = !act;
        // 位置：D / SB / BB
        const pos = t.phase === 'idle' ? t.positions() : t.pos;
        const posEl = e.querySelector('.pr-pos');
        const tag = pos ? (pos.sb === i ? 'SB' : pos.bb === i ? 'BB' : '') : '';
        posEl.textContent = tag;
        posEl.hidden = !tag;
        posEl.title = tag === 'BB' ? '大盲 Big blind RM 10' : tag ? '小盲 Small blind RM 5' : '';
        if (pos && pos.button === i && dbtnEl.parentNode !== e) e.appendChild(dbtnEl);
      }

      function paintCenter() {
        const t = S.table;
        const pot = t.phase === 'play' ? t.potTotal() : t.phase === 'done' ? t.result.potTotal : 0;
        potEl.innerHTML = `${term(T.pot.zh, T.pot.en.toUpperCase())} <b>${fmt(pot)}</b>`
          + (t.phase === 'done' && t.result.sawFlop ? `<span class="pr-pot__rake">${term(T.rake.zh, T.rake.en)} ${fmt(t.result.rake)}</span>` : '')
          + (t.phase === 'done' && !t.result.sawFlop ? '<span class="pr-pot__rake">No flop no drop</span>' : '');
        potEl.dataset.pot = String(pot);
        // 邊池
        let side = '';
        if (t.phase === 'play' && t.seats.some((s) => s.allIn && s.inHand && !s.folded)) {
          const { pots } = t.potsNow();
          if (pots.length > 1) side = pots.map((p, k) => `${k ? `${T.sidePot.zh} ${k}` : T.mainPot.zh} ${fmt(p.amount)}`).join(' · ');
        } else if (t.phase === 'done' && t.result.pots.length > 1) {
          side = t.result.pots.map((p, k) => `${k ? `${T.sidePot.zh} ${k}` : T.mainPot.zh} ${fmt(p.amount)}`).join(' · ');
        }
        sidePotsEl.textContent = side;
        sidePotsEl.hidden = !side;
        // 公共牌（依 S.shownBoard 逐街揭露）
        const slots = boardEl.children;
        for (let k = 0; k < 5; k++) {
          const c = k < S.shownBoard ? t.board[k] : null;
          const slot = slots[k];
          const id = c ? c.id : '';
          if (slot.dataset.id === id) continue;
          slot.dataset.id = id;
          slot.innerHTML = '';
          if (c) {
            const ce = ui.card(c, { faceDown: true, size: 'sm' });
            slot.appendChild(ce);
            ui.flip(ce, c);
          }
        }
      }

      function paintStatus() {
        const t = S.table;
        let txt;
        if (!t) txt = '買入後入座 <i class="en">Buy in to sit</i>';
        else if (t.phase === 'play') {
          const who = t.seats[t.toAct];
          txt = `#${t.handNo} ${streetText(t.street)} · ${who ? (who.isHuman ? `<b>${term(T.yourTurn.zh, T.yourTurn.en)}</b>` : `輪到 ${ui.esc(who.name)}`) : ''}`;
        } else if (t.phase === 'done') txt = `#${t.handNo} 結束 <i class="en">Hand over</i>`;
        else txt = term(T.waiting.zh, T.waiting.en);
        statusEl.innerHTML = txt;
      }

      function paintBar() {
        const t = S.table;
        const h = t ? t.seats[S.humanIdx] : null;
        const stack = h ? h.stack + (t.phase === 'play' ? h.committed : 0) : 0;
        const sessionNet = h ? stack - S.boughtIn : 0;
        barEl.innerHTML = '';
        barEl.append(
          el('div.pr-bar__kv', { html: `${term(T.stack.zh, T.stack.en)} <b>${fmt(h ? h.stack : 0)}</b>` }),
          el('div.pr-bar__kv', { html: `${term(T.hands.zh, T.hands.en)} <b>${S.handsPlayed}</b>` }),
          isTut ? el('div.pr-bar__kv', { html: '教學示範籌碼 <i class="en">Demo chips</i>' })
            : el('div.pr-bar__kv', { html: `盈虧 <i class="en">Net</i> <b class="${sessionNet > 0 ? 'lg-win' : sessionNet < 0 ? 'lg-lose' : ''}">${fmtSigned(sessionNet)}</b>` }),
          isTut ? null : el('button', { type: 'button', class: 'lg-btn lg-btn--sm lg-btn--ghost pr-leave', dataset: { action: 'leave-table' }, html: term(T.leave.zh, T.leave.en), on: { click: onLeave } }),
        );
      }

      function paintHistory() {
        const t = S.table;
        const cur = t && t.phase !== 'idle' ? handHistoryHtml(t.handNo, t.log, t.phase === 'done' ? null : '進行中') : '';
        const past = S.history.slice().reverse().filter((x) => !(t && t.phase !== 'idle' && x.handNo === t.handNo));
        historyBody.innerHTML = (cur || '') + past.map((x) => x.html).join('') || '<p class="lg-muted">還沒有手牌。</p>';
      }
      function handHistoryHtml(no, log, tag) {
        const byStreet = [];
        let cur = null;
        log.forEach((l) => {
          const st = l.result ? 'result' : l.street || 'preflop';
          if (!cur || cur.st !== st) { cur = { st, lines: [] }; byStreet.push(cur); }
          cur.lines.push(l.text);
        });
        return `<div class="pr-hh" data-hand="${no}"><div class="pr-hh__head">第 ${no} 手 <i class="en">Hand #${no}</i>${tag ? ` · ${tag}` : ''}</div>`
          + byStreet.map((b) => `<div class="pr-hh__st"><b>${b.st === 'result' ? '結果 <i class="en">Result</i>' : streetText(b.st)}</b> ${b.lines.join('；')}</div>`).join('')
          + '</div>';
      }

      // ------------------------------------------------------------ 動作列
      function setActionsEnabled(on) {
        [foldBtn, callBtn, raiseBtn].forEach((b) => { b.disabled = !on; });
        raiseRow.querySelectorAll('button, input').forEach((b) => { b.disabled = !on; });
        raiseRow.classList.toggle('is-disabled', !on);
        actionsEl.classList.toggle('is-waiting', !on);
      }

      function paintActions() {
        const t = S.table;
        const myTurn = t && t.phase === 'play' && t.toAct === S.humanIdx && !!S.resolveHuman;
        const showDeal = !ctx.isReal && !!t && S.phase === 'idle';
        dealBtn.hidden = !showDeal;
        [foldBtn, callBtn, raiseBtn].forEach((b) => { b.hidden = showDeal; });
        if (!myTurn) {
          setActionsEnabled(false);
          callBtn.innerHTML = btnLabel(`${T.check.zh}/${T.call.zh}`, 'Check / Call');
          raiseBtn.innerHTML = btnLabel(`${T.bet.zh}/加注`, 'Bet / Raise');
          amtEl.textContent = '—';
          return;
        }
        setActionsEnabled(true);
        const L = t.legal(S.humanIdx);
        callBtn.innerHTML = L.toCall === 0 ? btnLabel(T.check.zh, T.check.en)
          : btnLabel(T.call.zh, L.toCall >= t.seats[S.humanIdx].stack ? 'Call · All-in' : T.call.en, L.toCall);
        if (!L.canRaise) {
          raiseBtn.disabled = true;
          raiseRow.querySelectorAll('button, input').forEach((b) => { b.disabled = true; });
          raiseRow.classList.add('is-disabled');
        }
        slider.min = String(L.minTo);
        slider.max = String(L.maxTo);
        if (!(Number(slider.value) >= L.minTo && Number(slider.value) <= L.maxTo) || S.sliderHand !== `${t.handNo}-${t.street}-${t.currentBet}`) {
          slider.value = String(L.minTo);
          S.sliderHand = `${t.handNo}-${t.street}-${t.currentBet}`;
        }
        paintRaise();
      }

      function raiseTarget() {
        const t = S.table;
        const L = t.legal(S.humanIdx);
        let v = Math.round(Number(slider.value) || L.minTo);
        v = Math.max(L.minTo, Math.min(L.maxTo, v));
        return { L, to: v };
      }
      function paintRaise() {
        const t = S.table;
        if (!t || t.phase !== 'play') return;
        const { L, to } = raiseTarget();
        const allIn = to >= L.maxTo;
        amtEl.textContent = fmt(to);
        raiseBtn.innerHTML = allIn ? btnLabel(T.allin.zh, T.allin.en, to)
          : L.isBet ? btnLabel(T.bet.zh, T.bet.en, to) : btnLabel(T.raise.zh, T.raise.en, to);
        raiseRow.querySelectorAll('[data-size]').forEach((b) => b.classList.toggle('is-on', b.dataset.size === S.lastQuick));
      }

      /** ½池 / ¾池 / 池 / 全下：加注到 = 目前最高注 + 比例 ×（底池 + 跟注額） */
      function quickTo(id) {
        const t = S.table;
        const L = t.legal(S.humanIdx);
        if (id === 'allin') return L.maxTo;
        const frac = id === 'half' ? 0.5 : id === 'threeq' ? 0.75 : 1;
        const target = L.currentBet + frac * (L.pot + L.toCall);
        return Math.max(L.minTo, Math.min(L.maxTo, Math.round(target)));
      }
      function onQuick(id) {
        if (!S.resolveHuman) return;
        S.lastQuick = id;
        slider.value = String(quickTo(id));
        paintRaise();
      }
      function onCall() {
        const L = S.table.legal(S.humanIdx);
        submit({ type: L.toCall === 0 ? 'check' : 'call' });
      }
      function onRaise() {
        const { L, to } = raiseTarget();
        if (!L.canRaise) return;
        submit({ type: 'raise', to });
      }

      function humanTurn() {
        return new Promise((resolve) => {
          S.resolveHuman = resolve;
          paintActions();
          paintStatus();
          paintHint();
          if (ctx.isReal) {
            ctx.dealer.say('輪到你', 'Your action');
            S.timer = ui.countdown(RULES.actSeconds, {
              onDone: () => { S.timer = null; S.timeouts += 1; const L = S.table.legal(S.humanIdx); ui.toast('時間到：自動' + (L.canCheck ? '過牌 Check' : '棄牌 Fold')); submit({ type: L.canCheck ? 'check' : 'fold' }, true); },
            });
          }
        });
      }
      function submit(a, auto) {
        if (!S.resolveHuman) return;
        const r = S.resolveHuman;
        S.resolveHuman = null;
        if (S.timer) { S.timer.cancel(); S.timer = null; }
        if (!auto) S.humanActions += 1;
        setActionsEnabled(false);
        hintEl.hidden = true;
        r(a);
      }

      // ------------------------------------------------------------ 練習提示
      function paintHint() {
        const t = S.table;
        const myTurn = t && t.phase === 'play' && t.toAct === S.humanIdx && S.resolveHuman;
        if (!ctx.hints || !myTurn) { hintEl.hidden = true; return; }
        const key = `${t.handNo}-${t.street}-${t.currentBet}-${t.board.length}`;
        if (!S.hint || S.hint.key !== key) {
          const h = t.seats[S.humanIdx];
          const nOpp = Math.max(1, t.liveSeats().length - 1);
          const eq = LG.poker.equity(h.hole, t.board, nOpp, RULES.hintIters);
          S.hint = { key, ...advise(t, S.humanIdx, eq) };
        }
        const a = S.hint;
        hintEl.hidden = false;
        hintEl.innerHTML = `<b>提示</b>：勝率 <b>${pctStr(a.eq)}</b>（模擬 1,000 次）· 底池賠率 ${a.oddsText} → 建議 <b>${a.label}</b><br><span class="pr-hint__why">${a.reason}</span>`;
      }

      // ------------------------------------------------------------ 一手流程
      function onDeal() {
        if (S.phase !== 'idle' || !S.table) return;
        runHand();
      }

      function tutorialPreset() {
        if (!isTut || S.handsStarted > 0) return {};
        const P = LG.cards.parseMany;
        return { holes: { 0: P('AS KS') }, board: P('KH 7D 2C 9S 4H') };
      }

      async function runHand() {
        const t = S.table;
        if (!t.positions()) { ui.toast('人數不足，無法開始'); return; }
        if (S.resultPanel) { S.resultPanel.close(); S.resultPanel = null; }
        S.phase = 'hand';
        S.shownBoard = 0;
        S.hint = null;
        t.startHand({ preset: tutorialPreset() });
        S.handsStarted += 1;
        ctx.dealer.say('發牌', 'Dealing');
        paintActions();
        paintAll();
        while (t.phase === 'play') {
          const i = t.toAct;
          paintAll();
          let a;
          if (t.seats[i].isHuman) {
            a = await humanTurn();
          } else {
            await ctx.wait(RULES.aiDelay[0] + LG.rng.random() * (RULES.aiDelay[1] - RULES.aiDelay[0]));
            if (!ctx.alive()) return;
            a = aiDecide(t, i);
          }
          if (!ctx.alive()) return;
          try { t.act(i, a); } catch (e) {
            LG.debug('illegal action → fallback', e.message);
            const L = t.legal(i);
            t.act(i, { type: L.canCheck ? 'check' : 'fold' });
          }
          paintActions();
          paintAll();
          await revealStreets();
          if (!ctx.alive()) return;
        }
        await revealStreets();
        if (!ctx.alive()) return;
        await endHand();
      }

      /** 公共牌逐街翻開（全下時一次跑完也會分段顯示） */
      async function revealStreets() {
        const t = S.table;
        while (S.shownBoard < t.board.length) {
          const next = S.shownBoard < 3 ? 3 : S.shownBoard + 1;
          const st = next === 3 ? 'flop' : next === 4 ? 'turn' : 'river';
          await ctx.wait(350);
          S.shownBoard = next;
          ctx.dealer.say(T.streets[st].zh, T.streets[st].en);
          paintCenter();
          await ctx.wait(450);
        }
      }

      async function endHand() {
        const t = S.table, r = t.result, h = t.seats[S.humanIdx];
        S.handsPlayed += 1;
        const ex = explainHand(t, S.humanIdx, { showPersona: !ctx.isReal });
        // 先記帳（等待動畫時離桌也不會漏記）
        if (h.inHand) ctx.recordRound({ wagered: ex.wagered, net: ex.net, outcome: ex.net > 0 ? 'win' : ex.net < 0 ? 'lose' : 'push' });
        if (r.showdown) ctx.dealer.say('攤牌', 'Showdown');
        paintAll();
        await ctx.wait(r.showdown ? 700 : 300);
        if (!ctx.alive()) return;
        ctx.dealer.say('派彩', 'Paying out');
        S.history.push({ handNo: t.handNo, html: handHistoryHtml(t.handNo, t.log) });
        if (S.history.length > 20) S.history.shift();
        if (h.inHand) {
          S.resultPanel = ctx.explain({
            title: `第 ${t.handNo} 手結果 <i class="en">Hand #${t.handNo}</i>`,
            hand: ex.hand, result: ex.result, formula: ex.formula, why: ex.why, net: ex.net,
            actions: ctx.isReal ? undefined : [
              { id: 'result-close', label: '收起 <i class="en">Close</i>' },
              { id: 'result-next', label: '下一手 <i class="en">Next hand</i>', primary: true, onClick: () => { if (S.phase === 'idle') setTimeout(onDeal, 0); } },
            ],
          });
        }
        S.phase = 'idle';
        replaceBustedAIs();
        paintAll();
        paintActions();
        if (h.stack <= 0) {
          if (isTut) { h.stack = 1000; ui.toast('教學示範籌碼已補滿 RM 1,000'); paintAll(); ctx.nextRound(afterHand); return; }
          ctx.nextRound(() => openBuyIn({ rebuy: true }));
          return;
        }
        ctx.nextRound(afterHand);
      }

      function afterHand() {
        if (!ctx.alive() || S.phase !== 'idle') return;
        if (ctx.isReal) runHand();
        else { paintActions(); }
      }

      function replaceBustedAIs() {
        const t = S.table;
        t.seats.forEach((s, i) => {
          if (s.isHuman || s.stack > 0) return;
          const p = isTut ? { name: s.name, stack: 1000, persona: s.persona } : newAI(i);
          if (p.name !== s.name) S.usedNames.delete(s.name);
          t.setPlayer(i, p);
          t._log(`${s.name} 離桌，${p.name} 入座（買入 ${fmt(p.stack)}）`);
          if (!isTut) ui.toast(`${ui.esc(s.name)} 籌碼輸光離桌，${ui.esc(p.name)} 入座`);
        });
      }

      // ------------------------------------------------------------ 買入 / 離桌
      function openBuyIn({ rebuy = false } = {}) {
        if (!ctx.alive()) return;
        if (S.modal) { S.modal.close(); S.modal = null; }
        const bal = Math.floor(ctx.bank.balance());
        if (bal < RULES.buyInMin) {
          if (ctx.isReal) { ctx.checkBroke(); ctx.nextRound(() => openBuyIn({ rebuy })); return; }
          S.modal = ui.modal({
            title: '餘額不足 <i class="en">Not enough balance</i>',
            body: `<p>${rebuy ? '桌上籌碼輸光了。' : ''}餘額 ${fmt(bal)}，不夠最低買入 ${fmt(RULES.buyInMin)}。練習模式可以重置籌碼，或離桌。</p>`,
            dismissable: false,
            actions: [
              { id: 'leave-table', label: term('回首頁', 'Home'), onClick: () => { S.modal = null; LG.router.go('#/'); } },
              { id: 'reset-bank', label: '重置籌碼 RM 1,000', primary: true, onClick: () => { S.modal = null; ctx.bank.reset(); setTimeout(() => openBuyIn({ rebuy }), 0); } },
            ],
          });
          return;
        }
        const max = Math.min(RULES.buyInMax, bal);
        let amount = max;
        let nOpp = S.nOpp;
        const out = el('output.pr-buyin__amt', { text: fmt(amount) });
        const range = el('input', { type: 'range', class: 'pr-buyin__range', min: RULES.buyInMin, max, step: 10, 'aria-label': '買入金額 Buy-in amount' });
        range.value = String(amount);
        const presets = el('div.pr-buyin__presets', [400, 600, 800, 1000].map((v) => el('button', {
          type: 'button', class: 'lg-btn lg-btn--sm', dataset: { buyin: v }, text: fmt(v), disabled: v > max,
          on: { click: () => { amount = v; range.value = String(v); out.textContent = fmt(v); } },
        })));
        range.addEventListener('input', () => { amount = Math.round(Number(range.value)); out.textContent = fmt(amount); });
        const oppBtns = RULES.oppChoices.map((k) => el('button', {
          type: 'button', class: ['lg-btn', 'lg-btn--sm', k === nOpp && 'is-on'], dataset: { opp: k }, text: `${k} 個 AI`,
          on: { click: (ev) => { nOpp = k; oppBtns.forEach((b) => b.classList.toggle('is-on', b === ev.currentTarget)); } },
        }));
        const body = el('div.pr-buyin', [
          el('p', { html: rebuy
            ? `你的桌上籌碼輸光了。要<b>再買入 <i class="en">Rebuy</i></b> 繼續，還是離桌？`
            : `撲克室不是跟賭場對賭：你拿籌碼上桌，跟其他玩家比。<br>從餘額（${fmt(bal)}）轉入 ${fmt(RULES.buyInMin)} – ${fmt(RULES.buyInMax).replace('RM ', '')}；離桌時桌上籌碼轉回餘額。` }),
          el('div.pr-buyin__row', [el('span', { html: term('買入金額', 'Buy-in') }), out]),
          range, presets,
          S.table ? null : el('div.pr-buyin__row', [el('span', { html: term('對手人數', 'Opponents') }), el('div.pr-buyin__opp', oppBtns)]),
          el('p.lg-muted', { html: `盲注 RM 5 / RM 10 · 抽水 5%（上限 RM 50）· <i class="en">No flop no drop</i>${ctx.isReal ? ' · 每次行動 30 秒' : ''}` }),
        ]);
        S.modal = ui.modal({
          title: rebuy ? `${term(T.rebuy.zh, T.rebuy.en)}` : `${term(T.buyIn.zh, T.buyIn.en)}`,
          body, dismissable: false, className: 'pr-buyin-modal',
          actions: [
            { id: 'leave-table', label: term(T.leave.zh, T.leave.en), onClick: () => { S.modal = null; LG.router.go('#/'); } },
            { id: 'buyin', label: `${term(T.buyIn.zh, T.buyIn.en)}`, primary: true, onClick: () => { S.modal = null; doBuyIn(Math.max(RULES.buyInMin, Math.min(max, amount)), nOpp); } },
          ],
        });
      }

      function doBuyIn(amount, nOpp) {
        if (!ctx.alive()) return;
        try { ctx.bank.debit(amount); } catch { ui.toast('籌碼不足 <i class="en">Insufficient chips</i>'); openBuyIn(); return; }
        S.boughtIn += amount;
        if (!S.table) { S.nOpp = nOpp; createTable(nOpp, amount); }
        else { const h = S.table.seats[S.humanIdx]; h.stack += amount; h.sittingOut = false; }
        ui.toast(`買入 ${fmt(amount)}，祝好運！`);
        S.phase = 'idle';
        paintAll();
        paintActions();
        if (ctx.isReal) ctx.later(() => { if (S.phase === 'idle') runHand(); }, 600);
      }

      function onLeave() {
        const t = S.table;
        const h = t && t.seats[S.humanIdx];
        if (t && t.phase === 'play' && h.inHand && !h.folded) {
          ui.confirm('這手還沒結束：離桌等於棄牌，已放進底池的籌碼拿不回來。確定離桌？', { okLabel: '離桌 <i class="en">Leave</i>' })
            .then((ok) => { if (ok) LG.router.go('#/'); });

      /** 離桌結算：桌上籌碼轉回餘額；局中離桌 = 棄牌（已投入的不退，照記一手輸） */
      function cashOut() {
        if (S.modal) { S.modal.close(); S.modal = null; }
        if (S.timer) { S.timer.cancel(); S.timer = null; }
        if (isTut || !S.table) return;
        const t = S.table, h = t.seats[S.humanIdx];
        if (t.phase === 'play' && h.inHand) {
          const r = { wagered: h.committed, net: -h.committed, outcome: h.committed > 0 ? 'lose' : 'push' };
          LG.stats.record(ctx.gameId, r);
          if (ctx.isReal) LG.stats.session.record(r);
        }
        if (h.stack > 0) {
          const back = h.stack;
          h.stack = 0;
          ctx.bank.credit(back);
          ui.toast(`離桌：桌上籌碼 ${fmt(back)} 已轉回餘額`);
        }
      }

            body: '<p>按鈕左邊是<b>小盲 SB</b>（RM 5），再左邊是<b>大盲 BB</b>（RM 10）。發牌前就要放，強迫有底池。</p>',

            highlight: ['.lg-topbar .lg-balance', '.pr-bar'] },

      }

      // ------------------------------------------------------------ instance
      return {
        state: S,
        demo,
        logic,
        table: () => S.table,
        mount(el0) {
          root = el0;
          root.classList.add('pr-root');
          buildTable();
          paintActions();
          paintStatus();
          paintBar();
          paintHistory();
          ctx.on('hints:change', () => { paintHint(); });
          if (ctx.isPractice) {
            ctx.strategyPanel(`<p><b>起手牌表</b>（Chen 分數排序）</p>${handChartHtml()}`
              + '<p>底池賠率：需要勝率 = 跟注額 ÷（底池 + 跟注額）。</p><p>抽水 5%，上限 RM 50；翻牌前結束不抽。</p>');
          }
          root.dataset.ready = '1';
          if (isTut) { demo.ensureSeated(); return; }
          ctx.ready.then(() => { if (ctx.alive()) openBuyIn(); });
        },
        unmount() { cashOut(); },
        tutorialSteps,
      };
    },
  });
})();

(() => {

  // ---------------------------------------------------------------- 規則常數
  /** 輪盤順序（順時針，自 0 起） */
  const WHEEL = Object.freeze([0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26]);
  const RED = Object.freeze([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
  const RED_SET = new Set(RED);
  const ODDS = { straight: 35, split: 17, street: 11, trio: 11, corner: 8, first4: 8, line: 5, column: 2, dozen: 2, even: 1 };
  const INSIDE = new Set(['straight', 'split', 'street', 'trio', 'corner', 'first4', 'line']);
  /** 真實模式限注（雲頂近似，見 00-common.md §3） */
  const REAL = { outsideMin: 25, outsideMax: 3000, insideMin: 10, insideTotalMin: 25, straightMax: 500, insideMax: 3000 };
  const COUNTDOWN = 20;       // 真實模式倒數秒數
  const BALL_AT = 10;         // 倒數剩 10 秒發球（球在轉時仍可下注）
  const NMB_AT = 5;           // 倒數剩 5 秒喊 No more bets
  const SPIN_MS = 3000;       // 球落格動畫（× LG.speed）
  const EDGE = 2.70;

  const rowOf = (n) => Math.ceil(n / 3);      // 1..12（直式由上到下）
  const colOf = (n) => (n - 1) % 3;           // 0..2（col-1 = 1,4,7…）
  const colorOf = (n) => (n === 0 ? 'green' : RED_SET.has(n) ? 'red' : 'black');

  // ---------------------------------------------------------------- 下注格定義
  /** id → {id, type, nums, odds, inside, x?, y?}；x/y = 熱區在直式號碼區的格線座標（x 0..3、y 0..14） */
  const SPOTS = new Map();
  function addSpot(id, type, nums, pos = {}) {
    SPOTS.set(id, Object.freeze({
      id, type, nums: Object.freeze([...nums].sort((a, b) => a - b)), odds: ODDS[type], inside: INSIDE.has(type), ...pos,
    }));
  }
  for (let n = 0; n <= 36; n++) addSpot(`n-${n}`, 'straight', [n]);
  [1, 2, 3].forEach((k) => addSpot(`split-0-${k}`, 'split', [0, k], { x: k - 0.5, y: 1 }));
  addSpot('trio-0-1-2', 'trio', [0, 1, 2], { x: 1, y: 1 });
  addSpot('trio-0-2-3', 'trio', [0, 2, 3], { x: 2, y: 1 });
  addSpot('corner-0', 'first4', [0, 1, 2, 3], { x: 0, y: 1 });
  for (let n = 1; n <= 36; n++) {
    const r = rowOf(n), c = colOf(n);
    if (c < 2) addSpot(`split-${n}-${n + 1}`, 'split', [n, n + 1], { x: c + 1, y: r + 0.5 });
    if (r < 12) addSpot(`split-${n}-${n + 3}`, 'split', [n, n + 3], { x: c + 0.5, y: r + 1 });
    if (c < 2 && r < 12) addSpot(`corner-${n}`, 'corner', [n, n + 1, n + 3, n + 4], { x: c + 1, y: r + 1 });
  }
  for (let r = 1; r <= 12; r++) {
    const s = 3 * r - 2;
    addSpot(`street-${s}`, 'street', [s, s + 1, s + 2], { x: 0, y: r + 0.5 });
    if (r < 12) addSpot(`line-${s}`, 'line', [s, s + 1, s + 2, s + 3, s + 4, s + 5], { x: 0, y: r + 1 });
  }
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const ALL = range(1, 36);
  addSpot('red', 'even', RED);
  addSpot('black', 'even', ALL.filter((n) => !RED_SET.has(n)));
  addSpot('odd', 'even', ALL.filter((n) => n % 2 === 1));
  addSpot('even', 'even', ALL.filter((n) => n % 2 === 0));
  addSpot('low', 'even', range(1, 18));
  addSpot('high', 'even', range(19, 36));
  [1, 2, 3].forEach((d) => addSpot(`dozen-${d}`, 'dozen', range(12 * d - 11, 12 * d)));
  [1, 2, 3].forEach((k) => addSpot(`col-${k}`, 'column', ALL.filter((n) => colOf(n) === k - 1)));
  const EVEN_ORDER = ['low', 'even', 'red', 'black', 'odd', 'high'];

  // ---------------------------------------------------------------- 純邏輯（Node 可測）
  /** spotId 的號碼集合（已排序陣列）；未知 spot → null */
  function spotNumbers(spotId) { const s = SPOTS.get(spotId); return s ? s.nums : null; }
  /** spotId 的賠率（淨賠倍數，35 = 35:1）；未知 spot → null */
  function payout(spotId) { const s = SPOTS.get(spotId); return s ? s.odds : null; }

  /** 下注格名稱 {zh, en} */
  function spotName(spotId) {
    const s = SPOTS.get(spotId);
    if (!s) return { zh: spotId, en: spotId };
    const t = T.type[s.type];
    const nums = s.nums;
    switch (s.type) {
      case 'straight': return { zh: `直注 ${nums[0]}`, en: `Straight ${nums[0]}` };
      case 'split': case 'trio': case 'corner': case 'first4':
        return { zh: `${t.zh} ${nums.join('-')}`, en: `${t.en} ${nums.join('-')}` };
      case 'street': return { zh: `街注 ${nums[0]}-${nums[2]}`, en: `Street ${nums[0]}-${nums[2]}` };
      case 'line': return { zh: `線注 ${nums[0]}-${nums[5]}`, en: `Six line ${nums[0]}-${nums[5]}` };
      case 'dozen': { const d = Number(spotId.split('-')[1]); return { zh: `第 ${d} 打`, en: T.dozenEn[d - 1] }; }
      case 'column': { const k = Number(spotId.split('-')[1]); return { zh: `第 ${k} 列`, en: `Column ${k}` }; }
      default: {
        const o = T.outside[spotId];
        return spotId === 'low' || spotId === 'high' ? { zh: `${o.zh} ${o.en}`, en: spotId === 'low' ? 'Low' : 'High' } : o;
      }
    }
  }
  const spotLabel = (id) => spotName(id).zh;

  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve',
    'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = { 20: 'twenty', 30: 'thirty' };
  function numberWord(n) {
    const w = n < 20 ? ONES[n] : TENS[n - (n % 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
    return w[0].toUpperCase() + w.slice(1);
  }
  /** 荷官報號：{zh:'17 黑 單', en:'Seventeen black odd'} */
  function announce(n) {
    if (n === 0) return { zh: '0 綠', en: 'Zero green' };
    const red = RED_SET.has(n), odd = n % 2 === 1;
    return { zh: `${n} ${red ? '紅' : '黑'} ${odd ? '單' : '雙'}`, en: `${numberWord(n)} ${red ? 'red' : 'black'} ${odd ? 'odd' : 'even'}` };
  }
  /** 號碼屬性（中文） */
  function describe(n) {
    if (n === 0) return '綠色 0：不屬於紅黑、單雙、大小、打、列';
    return [RED_SET.has(n) ? '紅' : '黑', n % 2 ? '單' : '雙', n <= 18 ? '小 1–18' : '大 19–36',
      `第 ${Math.ceil(n / 12)} 打`, `第 ${colOf(n) + 1} 列`].join(' · ');
  }

  /**
   * 結算。entries = [[spotId, stake]]
   * @returns {{number, wagered, returned, net, lines:[{spot, stake, win, odds, pay, returned, formula, why}]}}
   *  returned = 拿回（含本金）；lines 依「外注 → 內注」排序（派彩順序）
   */
  function settle(entries, n) {
    let wagered = 0, returned = 0;
    const lines = entries.map(([spot, stake]) => {
      const s = SPOTS.get(spot);
      if (!s) throw Error('roulette: unknown spot ' + spot);
      stake = round2(stake);
      wagered += stake;
      const win = s.nums.includes(n);
      const name = spotLabel(spot);
      const set = s.nums.length <= 6 ? `{${s.nums.join(', ')}}` : `${s.nums.length} 個號碼`;
      if (win) {
        const pay = round2(stake * s.odds);
        const back = round2(stake + pay);
        returned += back;
        return { spot, stake, win: true, odds: s.odds, pay, returned: back,
          formula: `${name} ${fmt(stake)} × ${s.odds} = +${fmt(pay)}（淨贏；拿回 ${fmt(back)} 含本金）`,
          why: `${name}：${set} 含 ${n} → 中` };
      }
      return { spot, stake, win: false, odds: s.odds, pay: -stake, returned: 0,
        formula: `${name} ${fmt(stake)} → −${fmt(stake)}`,
        why: `${name}：${set} 不含 ${n} → 輸` };
    });
    lines.sort((a, b) => Number(SPOTS.get(a.spot).inside) - Number(SPOTS.get(b.spot).inside));
    wagered = round2(wagered); returned = round2(returned);
    return { number: n, wagered, returned, net: round2(returned - wagered), lines };
  }

  /** 內注合計 */
  function insideTotal(entries) {
    return round2(entries.reduce((a, [spot, amt]) => a + (SPOTS.get(spot) && SPOTS.get(spot).inside ? amt : 0), 0));
  }

  /** 真實模式每格限額（spotRules） */
  function realSpotRules() {
    const rules = {};
    for (const [id, s] of SPOTS) {
      rules[id] = s.inside
        ? { min: REAL.insideMin, max: s.type === 'straight' ? REAL.straightMax : REAL.insideMax }
        : { min: REAL.outsideMin, max: REAL.outsideMax };
    }
    return rules;
  }

  const pct = (x) => `${(x * 100).toFixed(1)}%`;
  /** 注別總表（提示面板 / 教學） */
  const TYPE_ROWS = [
    ['直注 Straight', 1, 35], ['分注 Split', 2, 17], ['街注 Street／三數 Trio', 3, 11], ['角注 Corner／首四 First four', 4, 8],
    ['線注 Six line', 6, 5], ['打 Dozen／列 Column', 12, 2], ['紅黑／單雙／大小', 18, 1],
  ];

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: 'roulette',
    category: 'table',
    order: 3,
    name: T.name,
    summary: T.summary,
    houseEdge: [
      { bet: { zh: '所有注（單零）', en: 'All bets (single zero)' }, edge: EDGE, best: true },
      { bet: { zh: '直注 35:1', en: 'Straight' }, edge: EDGE },
      { bet: { zh: '紅黑／單雙／大小 1:1', en: 'Even money' }, edge: EDGE },
    ],
    limits: { real: { min: REAL.outsideMin, max: REAL.outsideMax }, practice: { min: 10, max: 100000 } },
    denoms: [10, 25, 50, 100, 500, 1000],
    countdown: COUNTDOWN,
    logic: {
      WHEEL, RED, SPOTS, ODDS, REAL, EDGE, spotNumbers, payout, settle, spotName, spotLabel, announce, numberWord,
      describe, colorOf, insideTotal, realSpotRules,
    },

    create(ctx) {
      const real = ctx.isReal;
      const state = {
        phase: 'idle', rounds: 0, spins: 0, staked: 0, result: null, history: [],
        spin: null, ballLaunched: false, forced: null,
      };
      const labels = {};
      for (const id of SPOTS.keys()) labels[id] = spotLabel(id);
      const bets = new LG.Bets(real
        ? { min: REAL.insideMin, max: Infinity, perSpotMin: REAL.insideMin, perSpotMax: REAL.outsideMax, spotRules: realSpotRules(), labels }
        : { min: ctx.limits.min, max: Infinity, perSpotMin: ctx.limits.min, perSpotMax: ctx.limits.max, labels });
      if (real) {
        // 自訂驗證：每格限額（spotRules）之外，加上「內注合計 ≥ RM 25」
        const base = bets.validate.bind(bets);
        bets.validate = () => {
          const v = base();
          if (v.errors.some((e) => e.reason === 'EMPTY')) return v;
          const inside = insideTotal(bets.entries());
          if (inside > 0 && inside < REAL.insideTotalMin - 1e-9) {
            v.errors.push({ spot: null, reason: 'BELOW_MIN', limit: REAL.insideTotalMin, zh: T.insideMin(inside) });
            v.ok = false;
            v.zh = v.errors.map((e) => e.zh).join('；');
          }
          return v;
        };
      }

      let root, tableEl, board, hintEl, tray, layer, bar, lastEl, historyEl, dollyEl = null;
      let wheelG, ballG, ball;
      const spotEls = new Map();
      const pocketEls = new Map();
      const anim = { wheel: 0, ball: 0, r: 69, raf: 0, mode: 'idle', token: 0 };

      // ---- 桌面 ------------------------------------------------------------
      const gridVars = (p, l) => `--pr:${p[0]};--pc:${p[1]};--prs:${p[2] || 1};--pcs:${p[3] || 1};`
        + `--lr:${l[0]};--lc:${l[1]};--lrs:${l[2] || 1};--lcs:${l[3] || 1}`;

      function cell(id, cls, style, zh, en, odds) {
        const s = SPOTS.get(id);
        const nm = spotName(id);
        const e = el('div', {
          class: ['lg-spot', 'rl-cell', ...cls], dataset: { bet: id }, style,
          title: `${nm.zh} ${nm.en} ${s.odds}:1`, 'aria-label': `${nm.zh} ${nm.en} ${s.odds}:1`,
        }, [
          el('span.lg-spot__zh', { text: zh }),
          en ? el('span.lg-spot__en', { text: en }) : null,
          el('span.lg-spot__odds', { text: odds || `${s.odds}:1` }),
        ]);
        spotEls.set(id, e);
        return e;
      }

      function buildBoard() {
        board = el('div.rl-board');
        board.appendChild(cell('n-0', ['rl-num', 'is-green'], gridVars([1, 3, 1, 3], [1, 1, 3, 1]), '0'));
        for (let n = 1; n <= 36; n++) {
          const r = rowOf(n), c = colOf(n);
          board.appendChild(cell(`n-${n}`, ['rl-num', `is-${colorOf(n)}`], gridVars([r + 1, 3 + c], [3 - c, r + 1]), String(n)));
        }
        [1, 2, 3].forEach((k) => board.appendChild(
          cell(`col-${k}`, ['rl-out', 'rl-col'], gridVars([14, 2 + k], [4 - k, 14]), `第${k}列`, T.colEn)));
        [1, 2, 3].forEach((d) => board.appendChild(
          cell(`dozen-${d}`, ['rl-out', 'rl-dozen'], gridVars([2 + 4 * (d - 1), 2, 4], [4, 2 + 4 * (d - 1), 1, 4]), `第${d}打`, T.dozenEn[d - 1])));
        EVEN_ORDER.forEach((id, i) => {
          const o = T.outside[id];
          board.appendChild(cell(id, ['rl-out', 'rl-even', `rl-even--${id}`], gridVars([2 + 2 * i, 1, 2], [5, 2 + 2 * i, 1, 2]), o.zh, o.en));
        });
        // 格線熱區
        const hot = el('div.rl-hot', { style: gridVars([1, 3, 14, 3], [1, 1, 3, 14]) });
        for (const s of SPOTS.values()) {
          if (s.x === undefined) continue;
          const nm = spotName(s.id);
          const h = el('div', {
            class: ['lg-spot', 'rl-hs', `rl-hs--${s.type}`], dataset: { bet: s.id },
            style: `--x:${s.x};--y:${s.y}`, title: `${nm.zh} ${nm.en} ${s.odds}:1`, 'aria-label': `${nm.zh} ${nm.en} ${s.odds}:1`,
          });
          spotEls.set(s.id, h);
          hot.appendChild(h);
        }
        board.appendChild(hot);
        return board;
      }

      function buildWheel() {
        const P = (r, a) => { const t = (a * Math.PI) / 180; return `${(r * Math.sin(t)).toFixed(2)},${(-r * Math.cos(t)).toFixed(2)}`; };
        const th = 360 / 37;
        const svg = el('svg', { viewBox: '-100 -100 200 200', class: 'rl-wheel', role: 'img', 'aria-label': '輪盤 Roulette wheel' });
        svg.appendChild(el('circle', { r: 99, class: 'rl-wheel__rim' }));
        svg.appendChild(el('circle', { r: 95, class: 'rl-wheel__track' }));
        wheelG = el('g', { class: 'rl-wheel__rot' });
        WHEEL.forEach((n, i) => {
          const a0 = (i - 0.5) * th, a1 = (i + 0.5) * th;
          const p = el('path', {
            class: ['rl-pocket', `is-${colorOf(n)}`], dataset: { n },
            d: `M${P(88, a0)} A88 88 0 0 1 ${P(88, a1)} L${P(60, a1)} A60 60 0 0 0 ${P(60, a0)} Z`,
          });
          pocketEls.set(n, p);
          wheelG.appendChild(p);
          wheelG.appendChild(el('text', { class: 'rl-pocket__n', x: 0, y: -79, transform: `rotate(${(i * th).toFixed(2)})`, text: String(n) }));
        });
        wheelG.appendChild(el('circle', { r: 60, class: 'rl-wheel__cone' }));
        wheelG.appendChild(el('circle', { r: 36, class: 'rl-wheel__hub' }));
        for (let k = 0; k < 4; k++) wheelG.appendChild(el('path', { class: 'rl-wheel__turret', d: 'M-3,0 L0,-30 L3,0 Z', transform: `rotate(${k * 90})` }));
        wheelG.appendChild(el('circle', { r: 7, class: 'rl-wheel__knob' }));
        svg.appendChild(wheelG);
        ballG = el('g', { class: 'rl-ball-rot' });
        ball = el('circle', { class: 'rl-ball', cx: 0, cy: -69, r: 4.6 });
        ballG.appendChild(ball);
        svg.appendChild(ballG);
        return svg;
      }

      function buildTable() {
        lastEl = el('div.rl-last', { dataset: { role: 'last' } });
        historyEl = el('div.rl-history', { 'aria-label': '最近 12 個號碼 Last 12' });
        const info = el('div.rl-info', [
          el('div.rl-info__k', { html: T.last }), lastEl,
          el('div.rl-history-wrap', [el('div.rl-info__k', { html: `${T.history}<br><small>${T.historyNote}</small>` }), historyEl]),
        ]);
        tableEl = el('div.lg-table.rl-table', [
          el('div.rl-wheelzone', [el('div.rl-wheelbox', [buildWheel()]), info]),
          el('p.rl-legend', { html: T.legend }),
          buildBoard(),
        ]);
        const actions = el('div.lg-actions', { dataset: { dealSlot: '' } });
        const chips = el('div');
        const barEl = el('div');
        hintEl = el('div.lg-hint.rl-hint', { hidden: true });
        root.append(tableEl, hintEl, actions, chips, barEl);
        tray = ui.chipTray(chips, { denoms: ctx.denoms, selected: real ? 25 : 10 });
        layer = ui.betLayer(tableEl, { bets, chipTray: tray, gameId: ctx.gameId });
        bar = ui.betBar(barEl, { bets, layer });
        paintLast();
        render();
      }

      // ---- 輪盤動畫 --------------------------------------------------------
      const reduced = () => { try { return !!(globalThis.matchMedia && globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch { return false; } };
      const now = () => (globalThis.performance ? performance.now() : Date.now());
      const raf = (fn) => (globalThis.requestAnimationFrame ? requestAnimationFrame(fn) : setTimeout(() => fn(now()), 16));
      const caf = (id) => { if (globalThis.cancelAnimationFrame) cancelAnimationFrame(id); clearTimeout(id); };
      function render() {
        if (!wheelG) return;
        wheelG.setAttribute('transform', `rotate(${(anim.wheel % 360).toFixed(2)})`);
        ballG.setAttribute('transform', `rotate(${(anim.ball % 360).toFixed(2)})`);
        ball.setAttribute('cy', (-anim.r).toFixed(2));
      }
      /** 發球：球在外軌自由轉（下注仍開放） */
      function launchBall() {
        if (anim.mode !== 'idle' || !wheelG) return;
        anim.mode = 'orbit';
        anim.r = 92;
        pocketEls.forEach((p) => p.classList.remove('is-hit'));
        const tok = ++anim.token;
        let last = now();
        const tick = () => {
          if (anim.token !== tok || anim.mode !== 'orbit' || !ctx.alive()) return;
          const t = now(), dt = t - last; last = t;
          const k = dt / Math.max(0.05, LG.speed);
          anim.wheel += 0.04 * k;
          anim.ball -= 0.8 * k;
          render();
          anim.raf = raf(tick);
        };
        anim.raf = raf(tick);
      }
      /** 球落格：SPIN_MS（× LG.speed）減速停在號碼 n；回傳 Promise */
      function land(n, { record = true } = {}) {
        caf(anim.raf);
        const tok = ++anim.token;
        const dur = reduced() ? 0 : LG.ms(SPIN_MS);
        const w0 = anim.wheel, w1 = w0 + 140;
        const b0 = anim.ball, r0 = anim.mode === 'orbit' ? anim.r : 92;
        const want = b0 - 720;
        let b1 = w1 + WHEEL.indexOf(n) * (360 / 37);
        b1 -= 360 * Math.ceil((b1 - want) / 360);
        anim.mode = 'landing';
        pocketEls.forEach((p) => p.classList.remove('is-hit'));
        const t0 = now();
        const ease = (t) => 1 - Math.pow(1 - t, 3);
        const tick = () => {
          if (anim.token !== tok || !ctx.alive()) return;
          const t = dur ? Math.min(1, (now() - t0) / dur) : 1;
          const e = ease(t);
          anim.wheel = w0 + (w1 - w0) * e;
          anim.ball = b0 + (b1 - b0) * e;
          anim.r = r0 + (69 - r0) * Math.max(0, (t - 0.55) / 0.45);
          render();
          if (t < 1) anim.raf = raf(tick);
        };
        anim.raf = raf(tick);
        return ctx.wait(reduced() ? 150 : SPIN_MS).then(() => {
          if (anim.token !== tok) return;
          caf(anim.raf);
          anim.wheel = w1 % 360; anim.ball = b1 % 360; anim.r = 69; anim.mode = 'idle';
          render();
          const p = pocketEls.get(n);
          if (p && record) p.classList.add('is-hit');
        });
      }

      // ---- 桌面狀態 --------------------------------------------------------
      function paintLast() {
        const n = state.result;
        lastEl.innerHTML = '';
        if (n === null) { lastEl.appendChild(el('span.rl-last__n.is-empty', { text: '–' })); }
        else {
          const a = announce(n);
          lastEl.dataset.n = String(n);
          lastEl.append(
            el('span', { class: ['rl-last__n', `is-${colorOf(n)}`], text: String(n) }),
            el('span.rl-last__t', { html: `${a.zh}<br><i class="en">${a.en}</i>` }),
          );
        }
        historyEl.innerHTML = '';
        state.history.forEach((h, i) => historyEl.appendChild(el('span', { class: ['rl-hist', `is-${colorOf(h)}`, i === 0 && 'is-new'], text: String(h), dataset: { n: h } })));
      }
      function placeDolly(n) {
        removeDolly();
        const c = spotEls.get(`n-${n}`);
        if (!c) return;
        dollyEl = el('span.rl-dolly', { title: T.dolly, 'aria-label': T.dolly });
        c.appendChild(dollyEl);
      }
      function removeDolly() { if (dollyEl) { dollyEl.remove(); dollyEl = null; } }
      function clearMarks() {
        if (!tableEl) return;
        tableEl.querySelectorAll('.is-win, .is-lose').forEach((x) => x.classList.remove('is-win', 'is-lose'));
      }
      function markBets(r) {
        clearMarks();
        r.lines.forEach((l) => { const e = spotEls.get(l.spot); if (e) e.classList.add(l.win ? 'is-win' : 'is-lose'); });
      }

      // ---- 練習提示 --------------------------------------------------------
      function paintHints() {
        if (!hintEl) return;
        const on = ctx.isPractice && ctx.hints;
        hintEl.hidden = !on;
        if (!on) return;
        const es = bets.entries();
        if (!es.length) { hintEl.innerHTML = `提示：${T.hintEmpty}`; return; }
        hintEl.innerHTML = '提示：' + es.map(([id]) => {
          const s = SPOTS.get(id);
          return `<span class="rl-hint__row">${spotLabel(id)} · ${s.odds}:1 · 命中 ${s.nums.length}/37 = ${pct(s.nums.length / 37)}</span>`;
        }).join('') + `<span class="rl-hint__row">${T.evNote}</span>`;
      }
      function strategyTable() {
        return ui.table([['注別', '號碼數', '賠率', '命中率', '優勢'],
          ...TYPE_ROWS.map(([nm, k, o]) => [nm, String(k), `${o}:1`, pct(k / 37), `${EDGE.toFixed(2)}%`])], { caption: '每種注優勢都一樣：2.70%' });
      }

      // ---- 一局流程 --------------------------------------------------------
      function roll() {
        if (state.forced !== null) { const n = state.forced; state.forced = null; return n; }
        return LG.rng.int(0, 36);
      }
      function startRound() {
        if (!ctx.alive()) return;
        state.phase = 'betting';
        state.ballLaunched = false;
        state.spin = null;
        if (real) { clearMarks(); removeDolly(); }   // 荷官拿走 dolly 後才能再下注
        bets.unlock();
        ctx.bettingWindow({ bets, seconds: COUNTDOWN, label: T.spinBtn, onTick: real ? onTick : undefined, onClose: onNoMoreBets });
      }
      function onTick(n) {
        if (state.phase !== 'betting') return;
        if (n <= BALL_AT && !state.ballLaunched) { state.ballLaunched = true; launchBall(); }
        if (n <= NMB_AT) callNoMoreBets();
      }
      /** 真實模式：倒數剩 5 秒喊 No more bets，球開始減速落格 */
      function callNoMoreBets() {
        if (state.phase !== 'betting') return;
        state.phase = 'closing';
        ctx.dealer.say('停止下注', 'No more bets');
        bets.lock();
        state.result = roll();
        state.spin = land(state.result);
      }
      async function onNoMoreBets({ ok, validation }) {
        if (!ctx.alive()) return;
        if (state.phase === 'betting') {           // 練習/教學按「轉球」
          state.phase = 'closing';
          state.result = roll();
          state.spin = land(state.result);
        }
        const n = state.result;
        const play = !!ok;
        if (play) { state.staked = bets.total(); ctx.bank.debit(state.staked); }
        else if (bets.total() > 0) ui.toast(validation.zh || '下注不合法', { type: 'warn', ms: 2600 });
        state.phase = 'spinning';
        await state.spin;
        if (!ctx.alive()) return;
        finishRound(n, play);
      }
      function finishRound(n, play) {
        state.phase = 'settled';
        state.spins += 1;
        state.history.unshift(n);
        if (state.history.length > 12) state.history.length = 12;
        paintLast();
        placeDolly(n);
        const a = announce(n);
        ctx.dealer.say(a.zh, a.en);
        if (play) {
          const r = settle(bets.entries(), n);
          ctx.bank.credit(r.returned);
          state.staked = 0;
          state.rounds += 1;
          markBets(r);
          ctx.recordRound({ wagered: r.wagered, net: r.net, outcome: r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'push' });
          const wins = r.lines.filter((l) => l.win).length;
          const hasOutside = r.lines.some((l) => !SPOTS.get(l.spot).inside);
          ctx.explain({
            hand: `開出 <b class="rl-badge is-${colorOf(n)}">${n}</b> ${describe(n)}`,
            result: `${a.zh} <i class="en">${a.en}</i> — 中 ${wins} / ${r.lines.length} 注`,
            formula: r.lines.map((l) => l.formula).join('<br>') + `<br>淨 <b>${money.fmtSigned(r.net)}</b>（派彩順序：外注 → 內注）`,
            why: r.lines.map((l) => l.why).join('<br>') + (n === 0 && hasOutside ? `<br>${T.zeroOutside}` : '') + `<br>${T.evNote}`,
            net: r.net,
          });
        }
        bets.clear();                               // 上一注存在 bets.last → 重複上注
        if (!real) bets.unlock();                   // 真實：dolly 拿走（下一局開始）前維持鎖定
        ctx.checkBroke();
        if (real) ctx.nextRound(startRound);
        else ctx.later(() => ctx.nextRound(startRound), 1500);   // 讓報號留在橫幅上一下
      }

      // 練習/教學：一碰桌面（改注）就視為荷官已拿走 dolly
      bets.subscribe(() => {
        paintHints();
        if (!real && !bets.locked && (state.phase === 'betting' || state.phase === 'settled') && bets.total() > 0) {
          removeDolly(); clearMarks();
        }
      });

      // ---- 教學 ------------------------------------------------------------
      const demo = {
        showBanner(zh, en) { ctx.dealer.say(zh, en); },
        showDolly(n) { placeDolly(n); },
        clearDolly() { removeDolly(); },
        /** 把元素捲到畫面上方 28%（避免被教學工作表蓋住） */
        focus(sel) {
          const e = root && root.querySelector(sel);
          if (!e || !e.getBoundingClientRect || !globalThis.scrollBy) return;
          const r = e.getBoundingClientRect();
          globalThis.scrollBy(0, r.top - (globalThis.innerHeight || 800) * 0.28);
        },
        setBets(obj) { if (bets.locked || state.phase === 'spinning' || state.phase === 'closing') return; bets.restore(obj); },
        /** 示範發球（不開獎）：轉 2 秒後落在隨機格 */
        spinShow() {
          if (anim.mode !== 'idle' || state.phase === 'spinning' || state.phase === 'closing') return;
          launchBall();
          ctx.later(() => { if (anim.mode === 'orbit' && state.phase !== 'spinning' && state.phase !== 'closing') land(LG.rng.pick([...WHEEL]), { record: false }); }, 2000);
        },
        /** 測試/示範：指定下一球號碼 */
        forceNext(n) { state.forced = n; },
        ensureBetting() { if (state.phase === 'idle') startRound(); },
      };

      const hs = (id) => [`[data-bet="${id}"]`];
      const placeStep = (id, section, title, bodyHtml, spot) => ({
        id, section, title, body: bodyHtml, highlight: hs(spot),
        setup: (inst) => inst.demo.focus(`[data-bet="${spot}"]`),
        action: {
          label: `在發亮的熱區放一枚籌碼（${spotLabel(spot)}）`,

        },
      });

      function tutorialSteps() {
        const edgeTable = '<table class="lg-datatable"><tr><th>注</th><th>賠率</th><th>命中</th><th>優勢</th></tr>'
          + TYPE_ROWS.map(([nm, k, o]) => `<tr><td>${nm.split(/[ ／]/)[0]}</td><td>${o}:1</td><td>${k}/37</td><td>2.70%</td></tr>`).join('')
          + '</table>';
        return [
          // ===== layout 桌面
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：輪盤桌面',
            body: `<p>上方是${T.wheel}，下方是下注桌布 <i class="en">Layout</i>。先認識每一格，再學 7 種內注怎麼放。</p>`,
            highlight: ['.rl-table'] },
          { id: 'layout-numbers', section: 'layout', title: '號碼區 1–36',
            body: '<p>12 橫排 × 3 格，每排 3 個號碼（1-2-3、4-5-6…）。紅、黑各 18 個。</p>',
            highlight: ['.rl-num.is-red', '.rl-num.is-black'] },
          { id: 'layout-zero', section: 'layout', title: '0 格 <i class="en">Zero</i>',
            body: '<p>綠色的 0 不算紅黑、單雙、大小，也不在任何打或列裡。</p>',
            highlight: hs('n-0') },
          { id: 'layout-columns', section: 'layout', title: '列 <i class="en">Column</i> 2 to 1',
            body: '<p>底端三格「2 to 1」各押一整直列 12 個號碼，賠 2:1。第 1 列 = 1、4、7…34。</p>',
            highlight: ['[data-bet^="col-"]'], setup: (inst) => inst.demo.focus('[data-bet="col-1"]') },
          { id: 'layout-dozens', section: 'layout', title: '打 <i class="en">Dozen</i>',
            body: '<p>第 1 打 = 1–12、第 2 打 = 13–24、第 3 打 = 25–36，賠 2:1。</p>',
            highlight: ['[data-bet^="dozen-"]'] },
          { id: 'layout-even', section: 'layout', title: '紅黑、單雙、大小',
            body: '<p>這六格都賠 1:1：紅 <i class="en">Red</i>／黑 <i class="en">Black</i>、單 <i class="en">Odd</i>／雙 <i class="en">Even</i>、小 1–18／大 19–36。</p>',
            highlight: EVEN_ORDER.map((x) => `[data-bet="${x}"]`) },
          placeStep('layout-straight', 'layout', '直注 <i class="en">Straight</i> 35:1',
            '<p>點號碼格<b>正中央</b> = 只押這一個號碼，賠 35:1。</p>', 'n-17'),
          placeStep('layout-split', 'layout', '分注 <i class="en">Split</i> 17:1',
            '<p>點兩個相鄰號碼<b>中間的線</b> = 同時押這兩號，賠 17:1。例：17 與 20。</p>', 'split-17-20'),
          placeStep('layout-street', 'layout', '街注 <i class="en">Street</i> 11:1',
            '<p>點一排號碼<b>外側的端線</b>（靠「打」那邊）= 押整排 3 個號碼，賠 11:1。例：16-17-18。</p>', 'street-16'),
          placeStep('layout-corner', 'layout', '角注 <i class="en">Corner</i> 8:1',
            '<p>點四個號碼的<b>交叉點</b> = 押這 4 個號碼，賠 8:1。例：17-18-20-21。</p>', 'corner-17'),
          placeStep('layout-line', 'layout', '線注 <i class="en">Six line</i> 5:1',
            '<p>點兩排外側端線的<b>交界</b> = 押上下兩排共 6 個號碼，賠 5:1。例：16–21。</p>', 'line-16'),
          placeStep('layout-trio', 'layout', '三數 <i class="en">Trio</i> 11:1',
            '<p>點 0 與 1、2 的交叉點 = 押 0-1-2，賠 11:1（0-2-3 同理）。</p>', 'trio-0-1-2'),
          placeStep('layout-first-four', 'layout', '首四 <i class="en">First four</i> 8:1',
            '<p>點 0 下緣的<b>外側角</b> = 押 0-1-2-3 四個號碼，賠 8:1。</p>', 'corner-0'),
          { id: 'layout-wheel', section: 'layout', title: '輪盤順序 <i class="en">Wheel</i>',
            body: '<p>輪盤上號碼不是照 1–36 排，而是紅黑交錯，0 夾在 32 和 26 之間。</p>',
            highlight: ['.rl-wheel'], setup: (inst) => inst.demo.focus('.rl-wheel') },
          // ===== flow 流程
          { id: 'flow-intro', section: 'flow', title: '這段你會學到：一局怎麼進行',
            body: '<p>請下注 → 發球 → 停止下注 → 球落格 → 放 dolly → 收輸注、派彩。</p>',
            highlight: ['.lg-dealer-banner'],
            setup: (inst) => { inst.demo.ensureBetting(); inst.demo.showBanner('請下注', 'Place your bets'); } },
          { id: 'flow-ball', section: 'flow', title: '球在轉，還能下注',
            body: '<p>荷官發球 <i class="en">Spin</i> 後，球在外圈轉的前幾秒你仍可放籌碼。</p>',
            highlight: ['.rl-wheel'], setup: (inst) => { inst.demo.focus('.rl-wheel'); inst.demo.spinShow(); } },
          { id: 'flow-no-more-bets', section: 'flow', title: '停止下注 <i class="en">No more bets</i>',

            highlight: ['.lg-dealer-banner'], setup: (inst) => inst.demo.showBanner('停止下注', 'No more bets') },
          { id: 'flow-dolly', section: 'flow', title: '標記 <i class="en">Dolly</i>',
            body: '<p>球停後荷官把 dolly 放在開出的號碼上。<b>dolly 沒拿走之前，不能碰任何籌碼。</b></p>',
            highlight: ['[data-bet="n-17"]'],
            setup: (inst) => { inst.demo.showDolly(17); inst.demo.focus('[data-bet="n-17"]'); inst.demo.showBanner('17 黑 單', 'Seventeen black odd'); } },
          { id: 'flow-chips', section: 'flow', title: '輪盤籌碼 <i class="en">Roulette chips</i>',
            body: '<p>真賭場每位玩家換一種顏色的個人色碼籌碼，荷官靠顏色分辨誰的注。這裡用一般籌碼代替。</p>',
            highlight: ['.lg-chips'] },
          { id: 'flow-spin', section: 'flow', title: '轉一球 <i class="en">Spin</i>',
            body: '<p>桌上已有你剛放的籌碼。按「轉球」看球落格、dolly、派彩。</p>',
            highlight: ['[data-action="deal"]'],

            action: { label: '按「轉球 Spin」玩一局', check: (inst) => inst.state.rounds > 0 || '桌上要有籌碼，再按「轉球」' } },
          // ===== payout 賠率
          { id: 'payout-intro', section: 'payout', title: '這段你會學到：賠率怎麼算',
            body: '<p>35:1 = 押 1 淨贏 35，另外拿回本金。輸了只輸那一注。</p>',
            highlight: ['[data-bet="n-17"] .lg-spot__odds'] },
          { id: 'payout-straight', section: 'payout', title: '直注 35:1',
            body: '<p>直注 17 押 RM 10，開 17：<br><b>RM 10 × 35 = RM 350</b>（淨贏）<br>拿回 RM 360（含本金）。</p>',
            highlight: hs('n-17'), setup: (inst) => { inst.demo.setBets({ 'n-17': 10 }); inst.demo.showDolly(17); inst.demo.focus('[data-bet="n-17"]'); } },
          { id: 'payout-split', section: 'payout', title: '分注 17:1',
            body: '<p>分注 17-20 押 RM 10，開 20：<br><b>RM 10 × 17 = RM 170</b>（淨贏）<br>拿回 RM 180（含本金）。</p>',
            highlight: hs('split-17-20'), setup: (inst) => { inst.demo.setBets({ 'split-17-20': 10 }); inst.demo.showDolly(20); } },
          { id: 'payout-outside', section: 'payout', title: '外注 1:1',
            body: '<p>紅押 RM 25，開 19（紅）：<br><b>RM 25 × 1 = RM 25</b>（淨贏）<br>拿回 RM 50（含本金）。</p>',
            highlight: hs('red'), setup: (inst) => { inst.demo.setBets({ red: 25 }); inst.demo.showDolly(19); inst.demo.focus('[data-bet="red"]'); } },
          { id: 'payout-combo', section: 'payout', title: '一球同時算 3 注',
            body: '<p>直注 17 RM 10、分注 17-20 RM 10、紅 RM 25，開 17 黑：<br>+RM 350 +RM 170 −RM 25 = <b>淨 +RM 495</b></p>',
            highlight: ['[data-bet="n-17"]', '[data-bet="split-17-20"]', '[data-bet="red"]'],
            setup: (inst) => { inst.demo.setBets({ 'n-17': 10, 'split-17-20': 10, red: 25 }); inst.demo.showDolly(17); inst.demo.focus('[data-bet="n-17"]'); } },
          // ===== strategy 策略
          { id: 'strategy-edge', section: 'strategy', title: '這段你會學到：莊家優勢 <i class="en">House edge</i>',
            body: `<p>單零輪盤每一注優勢都是 <b>2.70%</b>（= 1/37）。</p>${edgeTable}`,
            highlight: null },
          { id: 'strategy-variance', section: 'strategy', title: '差別只是波動',
            body: '<p>直注很少中，中一次賠很多；紅黑常中，賠得少。長期每押 RM 100 平均都輸 RM 2.70。</p>',
            highlight: ['[data-bet="n-17"]', '[data-bet="red"]'] },
          { id: 'strategy-hot', section: 'strategy', title: '別信「熱門號」',
            body: '<p>最近 12 個號碼<b>只是紀錄，不能預測</b>。每一球都是獨立的 1/37，輪盤沒有記憶。</p>',
            highlight: ['.rl-history-wrap'], setup: (inst) => inst.demo.focus('.rl-wheel') },
          { id: 'strategy-zero', section: 'strategy', title: '0 讓外注輸',
            body: '<p>優勢來自 0：押紅時 18 個號碼贏、19 個輸。本桌沒有 La Partage，開 0 外注全輸。</p>',
            highlight: hs('n-0'), setup: (inst) => inst.demo.focus('[data-bet="n-0"]') },
          { id: 'strategy-do', section: 'strategy', title: '該押',
            body: '<p>任選一種注、固定小額。想玩久一點押紅黑／單雙；想要刺激就小額直注。</p>',
            highlight: EVEN_ORDER.map((x) => `[data-bet="${x}"]`) },
          { id: 'strategy-dont', section: 'strategy', title: '別押',
            body: '<p>別把 37 個號碼全鋪滿：每號 RM 10 共 RM 370，中一號拿回 RM 360，<b>每球固定輸 RM 10</b>。</p>',
            highlight: ['.rl-num'] },
          { id: 'strategy-budget', section: 'strategy', title: '預算',
            body: '<p>今晚只帶 RM 500，輸完就走。注碼小一點能玩久一點，但長期仍是 −2.70%。</p>',
            highlight: ['.lg-topbar .lg-balance'] },
        ];
      }

      // ---- instance ----------------------------------------------------------
      return {
        bets,
        state,
        tray: () => tray,
        demo,
        el: (id) => spotEls.get(id),
        mount(el0) {
          root = el0;
          buildTable();
          paintHints();
          ctx.on('hints:change', paintHints);
          if (ctx.isPractice) ctx.strategyPanel(strategyTable());
          root.dataset.ready = '1';
          startRound();
        },
        unmount() {
          anim.token += 1;
          caf(anim.raf);
          if (state.staked > 0) { ctx.bank.credit(state.staked); state.staked = 0; }
          if (layer) layer.destroy();
          if (bar) bar.destroy();
        },
        tutorialSteps,
      };
    },
  });
})();

  // ---------------------------------------------------------------- 文案
  const T = {

  // ---------------------------------------------------------------- 下注格定義
