// ============================================================================
// 四級累積獎金機「金龍」（id: slot-progressive）— 規格 docs/05-game-rules/slot-progressive.md
//
// 5×3、20 線（LINES_20），基礎符號同 slot-video 賠付表（主題「金龍」），另加 JACKPOT 符號（每軸 1 停點）。
// 3 個以上 JACKPOT（任意位置）→ 獎金輪盤 Jackpot Wheel（12 格：MINI 6、MINOR 4、MAJOR 1、GRAND 1）。
// 只有最大注（每線 RM 5 × 20 = RM 100）有資格中 GRAND；非最大注時 GRAND 格變 MAJOR，
// 而且獎金按「總注 ÷ RM 100」比例支付（實作決定，見 docs/change-requests/slot-progressive.md）。
// 四級獎池存 LG.store.jackpots['slot-progressive']：種子 20 / 50 / 500 / 10,000，
// 每轉成長 總注 × 0.5% / 0.5% / 0.8% / 1.2%（不論注額都貢獻），中獎後該級回種子。
// RTP 92%（最大注，獎池以種子期望計）。
// ============================================================================
(() => {
  const { ui, money, slots, slotView } = LG;
  const { el, term } = ui;
  const { fmt, round2 } = money;
  const ID = 'slot-progressive';
  const cents = (n) => fmt(n, { cents: true });

  // ---------------------------------------------------------------- 文案
  const T = {
    name: { zh: '四級累積獎金機', en: 'Progressive Jackpot' },
    summary: '3 個 JACKPOT 轉輪盤，四級獎池；GRAND 只給最大注。',
    spin: term('旋轉', 'SPIN'),
    spinning: ['轉動中', 'Spinning'],
    paying: ['派彩', 'Paying out'],
    ready: ['按「旋轉」開始', 'Press SPIN'],
    wheel: ['獎金輪盤！', 'Jackpot Wheel'],
    noMoney: '餘額不足：請調低每線注',
    win: term('贏分', 'WIN'),
    maxOnly: '僅最大注 <i class="en">MAX BET ONLY</i>',
    levels: {
      mini: { zh: '迷你', en: 'MINI' },
      minor: { zh: '小獎', en: 'MINOR' },
      major: { zh: '大獎', en: 'MAJOR' },
      grand: { zh: '頭獎', en: 'GRAND' },
    },
  };

  // ---------------------------------------------------------------- 規則常數
  const LINES = slots.LINES_20;
  const NLINES = LINES.length;
  const LINE_BETS = [0.1, 0.2, 0.5, 1, 2, 5];
  const MAX_BET = NLINES * LINE_BETS[LINE_BETS.length - 1];   // RM 100
  const TRIGGER = 3;
  const SEEDS = { mini: 20, minor: 50, major: 500, grand: 10000 };
  const GROWTH = { mini: 0.005, minor: 0.005, major: 0.008, grand: 0.012 };
  const LEVELS = ['grand', 'major', 'minor', 'mini'];
  /** 輪盤 12 格（順時針，第 0 格在正上方起算） */
  const WHEEL = ['grand', 'mini', 'minor', 'mini', 'minor', 'mini', 'major', 'mini', 'minor', 'mini', 'minor', 'mini'];

  const SYMS = {
    WILD: { zh: '金龍', en: 'WILD', label: '龍', color: '#fff3b0', bg: 'linear-gradient(160deg,#c9302c,#6b0f0c)' },
    PHX: { zh: '鳳凰', en: 'Phoenix', label: '鳳', color: '#c2410c', bg: 'linear-gradient(180deg,#fff4d6,#f5c96a)' },
    LION: { zh: '醒獅', en: 'Lion Dance', label: '獅', color: '#b91c1c', bg: 'linear-gradient(180deg,#fff7df,#f4dc97)' },
    LANT: { zh: '燈籠', en: 'Lantern', label: '燈', color: '#fff', bg: 'linear-gradient(180deg,#e0453a,#a3150f)' },
    KOI: { zh: '錦鯉', en: 'Koi', label: '鯉', color: '#e0621b', bg: 'linear-gradient(180deg,#fffaf0,#f7e3c4)' },
    A: { zh: 'A', en: 'Ace', label: 'A', color: '#9a1b1b' },
    K: { zh: 'K', en: 'King', label: 'K', color: '#1b6d3a' },
    Q: { zh: 'Q', en: 'Queen', label: 'Q', color: '#6b2a8c' },
    J: { zh: 'J', en: 'Jack', label: 'J', color: '#a0521b' },
    T: { zh: '10', en: 'Ten', label: '10', color: '#2a5b9a' },
    N: { zh: '9', en: 'Nine', label: '9', color: '#6b6b6b' },
    JP: {
      zh: 'JACKPOT', en: 'Jackpot', label: 'JACKPOT', bg: 'radial-gradient(circle,#8a1414,#2a0404)',
      svg: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#f5c542" stroke-width="2"/><text x="20" y="18" text-anchor="middle" font-size="10" font-weight="900" fill="#ffe38a">JACK</text><text x="20" y="29" text-anchor="middle" font-size="10" font-weight="900" fill="#ffe38a">POT</text></svg>',
    },
  };
  const PAYTABLE = {
    WILD: { 5: 1000 },
    PHX: { 3: 50, 4: 200, 5: 1000 },
    LION: { 3: 25, 4: 100, 5: 400 },
    LANT: { 3: 20, 4: 60, 5: 200 },
    KOI: { 3: 15, 4: 40, 5: 120 },
    A: { 3: 10, 4: 25, 5: 75 },
    K: { 3: 10, 4: 25, 5: 75 },
    Q: { 3: 5, 4: 15, 5: 50 },
    J: { 3: 5, 4: 15, 5: 50 },
    T: { 3: 5, 4: 10, 5: 40 },
    N: { 3: 5, 4: 10, 5: 40 },
  };
  const PAY_ORDER = ['WILD', 'PHX', 'LION', 'LANT', 'KOI', 'A', 'K', 'Q', 'J', 'T', 'N'];

  // ---------------------------------------------------------------- 轉軸帶
  function interleave(items) {
    const list = items.filter(([, c]) => c > 0).map(([u, c]) => ({ u, w: c, cur: 0 }));
    const total = list.reduce((s, x) => s + x.w, 0);
    const out = [];
    for (let k = 0; k < total; k++) {
      let best = null;
      for (const x of list) { x.cur += x.w; if (!best || x.cur > best.cur) best = x; }
      best.cur -= total;
      out.push(best.u);
    }
    return out;
  }
  /** 一軸：{syms:[[符號, 停點數]], jp:JACKPOT 停點數}；JACKPOT 均勻插入（彼此相隔很遠，一軸最多露出 1 個） */
  function buildStrip(spec) {
    const out = interleave(spec.syms);
    const n = spec.jp || 0;
    const F = out.length;
    for (let k = n - 1; k >= 0; k--) out.splice(Math.floor(((k + 0.5) * F) / n), 0, 'JP');
    return out;
  }
  // 各軸停點數（以 exactRTP 精確調到最大注 RTP 92%；見單元測試）
  const MID_SYMS = [['WILD', 4], ['PHX', 2], ['LION', 2], ['LANT', 3], ['KOI', 3], ['A', 3], ['K', 3], ['Q', 3], ['J', 3], ['T', 3], ['N', 3]];
  const OUT_SYMS = [['PHX', 2], ['LION', 3], ['LANT', 4], ['KOI', 3], ['A', 3], ['K', 3], ['Q', 3], ['J', 3], ['T', 3], ['N', 3]];
  // 金龍 WILD 只在第 2–4 軸；每軸 1 個 JACKPOT
  const STRIP_SPEC = [0, 1, 2, 3, 4].map((r) => ({ syms: r >= 1 && r <= 3 ? MID_SYMS : OUT_SYMS, jp: 1 }));
  const STRIPS = STRIP_SPEC.map(buildStrip);
  // 精確值（由 exactRTP 算出、單元測試核對）：非最大注 RTP、最大注平均幾轉中一次 GRAND（觸發 1/142.6 × 1/12）
  const exactNonMax = 0.8664;
  const grandOneIn = 1711;

  // ---------------------------------------------------------------- 純邏輯
  const isMaxBet = (bet) => bet >= MAX_BET - 1e-9;
  /** 輪盤 12 格：非最大注 GRAND 格變 MAJOR */
  const wheelSegments = (isMax) => WHEEL.map((lv) => (lv === 'grand' && !isMax ? 'major' : lv));
  /** 獎金 = 獎池 × min(1, 總注 ÷ RM 100)（最大注拿全額） */
  const payRatio = (bet) => Math.min(1, bet / MAX_BET);
  const jackpotPrize = (level, pools, bet) => round2(pools[level] * payRatio(bet));

  function evalBase(grid, lineBet) {
    const r = slots.evalLines(grid, LINES, PAYTABLE, { wild: 'WILD', scatter: 'JP' });
    return { wins: r.wins, mult: r.total, win: round2(r.total * lineBet) };
  }
  const jpCount = (grid) => slots.countScatter(grid, 'JP');
  const isTrigger = (grid) => jpCount(grid).count >= TRIGGER;

  /** 完整一轉（純邏輯）。pools = 當下獎池；segment 可指定（測試用） */
  function playSpin({ bet, lineBet, pools, grid, segment }) {
    const g = grid || slots.spin(STRIPS, 3);
    const base = evalBase(g, lineBet);
    const jp = jpCount(g);
    let wheel = null;
    if (jp.count >= TRIGGER) {
      const isMax = isMaxBet(bet);
      const segs = wheelSegments(isMax);
      const idx = segment ?? LG.rng.int(0, segs.length - 1);
      const level = segs[idx];
      wheel = { isMax, segs, idx, level, pool: round2(pools[level]), ratio: payRatio(bet), prize: jackpotPrize(level, pools, bet) };
    }
    const win = round2(base.win + (wheel ? wheel.prize : 0));
    return { grid: g, base, jp, wheel, win, bet, lineBet };
  }

  // ---- 累積獎金（LG.store）
  const jackpots = {
    get() {
      const j = (LG.store.peek().jackpots || {})[ID] || {};
      const o = {};
      for (const lv of LEVELS) o[lv] = Number.isFinite(j[lv]) ? j[lv] : SEEDS[lv];
      return o;
    },
    /** 每轉：四級各 +總注 × 成長比例（非最大注也照樣貢獻） */
    grow(bet) {
      LG.store.update((s) => {
        const cur = s.jackpots[ID] || { ...SEEDS };
        const next = {};
        for (const lv of LEVELS) next[lv] = Math.round(((Number(cur[lv]) || SEEDS[lv]) + bet * GROWTH[lv]) * 1e6) / 1e6;
        s.jackpots[ID] = next;
      });
      return jackpots.get();
    },
    claim(level) {
      LG.store.update((s) => { s.jackpots[ID] = { ...jackpots.get(), [level]: SEEDS[level] }; });
      return jackpots.get();
    },
    reset() { LG.store.update((s) => { s.jackpots[ID] = { ...SEEDS }; }); },
  };

  // ---- 精確分析
  /** 輪盤期望獎金（RM；獎池以種子計） */
  function wheelEV(bet = MAX_BET, pools = SEEDS) {
    const segs = wheelSegments(isMaxBet(bet));
    return segs.reduce((s, lv) => s + pools[lv] * payRatio(bet), 0) / segs.length;
  }
  /** 3+ JACKPOT 機率（精確，由轉軸帶） */
  function triggerProb(strips = STRIPS) {
    let dist = [1];
    for (const st of strips) {
      const d = [0, 0, 0, 0];
      for (let i = 0; i < st.length; i++) {
        let c = 0;
        for (let y = 0; y < 3; y++) if (st[(i + y) % st.length] === 'JP') c++;
        d[c] += 1 / st.length;
      }
      const nd = new Array(dist.length + 3).fill(0);
      dist.forEach((a, i) => d.forEach((b, j) => { nd[i + j] += a * b; }));
      dist = nd;
    }
    return dist.slice(TRIGGER).reduce((a, b) => a + b, 0);
  }
  function lineRTP(strips = STRIPS) {
    const freqs = strips.map((st) => {
      const m = {};
      st.forEach((x) => { m[x] = (m[x] || 0) + 1; });
      return Object.entries(m).map(([k, v]) => [k, v / st.length]);
    });
    let ev = 0;
    const g = [];
    const rec = (r, p) => {
      if (r === 5) { ev += p * slots.evalLines(g, [[0, 0, 0, 0, 0]], PAYTABLE, { wild: 'WILD', scatter: 'JP' }).total; return; }
      for (const [x, f] of freqs[r]) { g[r] = [x]; rec(r + 1, p * f); }
    };
    rec(0, 1);
    return ev;
  }
  /** 精確 RTP（獎池種子期望）→ {lines, wheel, total, trigger} */
  function exactRTP({ bet = MAX_BET, strips = STRIPS } = {}) {
    const lines = lineRTP(strips);
    const trigger = triggerProb(strips);
    const wheel = (trigger * wheelEV(bet)) / bet;
    return { lines, wheel, total: lines + wheel, trigger };
  }
  /** simulateRTP 設定：線獎實際模擬；觸發時輪盤以種子期望值計 */
  function rtpConfig({ bet = MAX_BET, strips = STRIPS } = {}) {
    const lineBet = bet / NLINES;
    const ev = wheelEV(bet);
    return {
      bet,
      strips,
      evaluate(grid) {
        return evalBase(grid, 1).mult * lineBet + (isTrigger(grid) ? ev : 0);
      },
    };
  }

  // ---------------------------------------------------------------- 示範盤面
  const DEMO_BASE = [['A', 'PHX', 'K'], ['Q', 'LANT', 'J'], ['KOI', 'T', 'A'], ['K', 'N', 'LION'], ['J', 'Q', 'T']];
  const DEMO_JP_CELLS = [[0, 2], [2, 0], [4, 1], [3, 2]];
  function demoGrid(n) {
    const g = DEMO_BASE.map((c) => c.slice());
    DEMO_JP_CELLS.slice(0, n).forEach(([r, y]) => { g[r][y] = 'JP'; });
    return g;
  }

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: ID,
    category: 'slots',
    order: 4,
    name: T.name,
    summary: T.summary,
    houseEdge: [{ bet: { zh: '總體（最大注，RTP 92%）', en: 'Overall (max bet)' }, edge: 8.0, best: true }],
    limits: { real: { min: 2, max: 100 }, practice: { min: 2, max: 100 } },
    logic: {
      SYMS, PAYTABLE, STRIPS, STRIP_SPEC, LINES, SEEDS, GROWTH, WHEEL, MAX_BET, LINE_BETS, TRIGGER, LEVELS,
      interleave, buildStrip, isMaxBet, wheelSegments, payRatio, jackpotPrize, evalBase, jpCount, isTrigger, playSpin,
      jackpots, wheelEV, triggerProb, lineRTP, exactRTP, rtpConfig, demoGrid,
    },

    create(ctx) {
      const state = { rounds: 0, wheels: 0, busy: false, ready: false, last: null, pending: null, forced: null, forcedSegment: null, paytableOpened: false };
      let root, machine, view, panel, spinBtn, hintEl, winEl, noteEl, jpEls = {}, wheelModal = null, alive = true;

      function buildTable() {
        jpEls = {};
        const plaques = LEVELS.map((lv) => {
          const v = el('b.pg-jp__v', { dataset: { role: `jp-${lv}` } });
          jpEls[lv] = v;
          return el(`div.pg-jp.pg-jp--${lv}`, { dataset: { jp: lv } }, [
            el('span.pg-jp__k', { html: `${T.levels[lv].en} <i class="en">${T.levels[lv].zh}</i>` }), v,
            lv === 'grand' ? el('span.pg-jp__maxonly', { html: T.maxOnly }) : null,
          ]);
        });
        noteEl = el('div.pg-note', { dataset: { role: 'maxnote' } });
        const reels = el('div.pg-reels');
        winEl = el('b.pg-meter__win', { dataset: { role: 'win' }, text: cents(0) });
        machine = el('div.lg-table.pg-machine', [
          el('div.pg-jackpots', plaques),
          noteEl,
          reels,
          el('div.pg-meter', [el('span', { html: `${T.win} ` }), winEl, el('span.pg-meter__sep', { text: '·' }), el('span', { html: `3 個 ${term('JACKPOT', 'Wheel')} → 輪盤` })]),
        ]);
        hintEl = el('div.lg-hint.pg-hint', { hidden: true });
        const actions = el('div.lg-actions.pg-actions');
        const betHost = el('div.pg-bet');
        root.append(machine, hintEl, actions, betHost);

        view = slotView.create(reels, { reels: 5, rows: 3, symbols: SYMS, strips: STRIPS });
        view.setGrid(DEMO_BASE);
        const pt = slotView.paytableButton(actions, { render: renderPaytable });
        pt.addEventListener('click', () => { state.paytableOpened = true; });
        spinBtn = el('button', { type: 'button', class: 'lg-btn lg-btn--primary pg-spin', dataset: { action: 'spin' }, html: T.spin });
        spinBtn.addEventListener('click', () => { doSpin(); });
        actions.appendChild(spinBtn);
        panel = slotView.betPanel(betHost, { lines: [NLINES], lineBets: LINE_BETS, lineBet: 0.1, onChange: () => { paintJackpots(); paintHints(); } });
        paintJackpots();
      }

      function paintJackpots() {
        const j = jackpots.get();
        const bet = panel.bet(), isMax = isMaxBet(bet);
        LEVELS.forEach((lv) => { jpEls[lv].textContent = cents(j[lv]); });
        machine.querySelector('[data-jp="grand"]').classList.toggle('is-inactive', !isMax);
        machine.classList.toggle('is-max', isMax);
        noteEl.innerHTML = isMax
          ? '最大注 <i class="en">MAX BET</i>：四級獎金全額、有 GRAND 資格'
          : `非最大注：沒有 GRAND，獎金只付 ${Math.round(payRatio(bet) * 100)}%（總注 ${cents(bet)} ÷ RM 100）`;
      }
      const setWin = (n) => { winEl.textContent = cents(n); };
      const setBusy = (b) => { state.busy = b; spinBtn.disabled = b || !state.ready; panel.setEnabled(!b); };

      function paintHints() {
        if (!hintEl) return;
        hintEl.hidden = !ctx.hints;
        const bet = panel ? panel.bet() : 2;
        hintEl.innerHTML = isMaxBet(bet)
          ? `提示：最大注每轉 ${cents(bet)}。RM 500 只夠 5 轉——預算不夠最大注，就別玩累積獎金機。`
          : `提示：你每轉仍付總注 3%（${cents(bet * 0.03)}）養獎池，卻沒有 GRAND 資格、獎金只拿 ${Math.round(payRatio(bet) * 100)}%。要玩就最大注，否則換一台。`;
      }

      function renderPaytable() {
        const lb = panel.lineBet(), bet = panel.bet();
        const rows = PAY_ORDER.map((s) => {
          const p = PAYTABLE[s];
          return `<tr><td>${SYMS[s].zh} <i class="en">${SYMS[s].en}</i></td><td>${p[3] ?? '—'}</td><td>${p[4] ?? '—'}</td><td>${p[5] ?? '—'}</td></tr>`;
        }).join('');
        const j = jackpots.get();
        const jpRows = LEVELS.map((lv) => `<tr><td>${T.levels[lv].en} ${T.levels[lv].zh}</td><td>${cents(j[lv])}</td><td>${fmt(SEEDS[lv])}</td><td>${(GROWTH[lv] * 100).toFixed(1)}%</td><td>${WHEEL.filter((x) => x === lv).length}</td></tr>`).join('');
        return `<p>線獎倍數乘<b>每線注</b>（目前 ${cents(lb)}），不是總注。20 條固定線，由左至右連續。金龍 <i class="en">WILD</i> 只在第 2–4 軸。</p>
          <table class="lg-datatable"><thead><tr><th>符號</th><th>3 連</th><th>4 連</th><th>5 連</th></tr></thead><tbody>${rows}</tbody></table>
          <h3>獎金輪盤 <i class="en">Jackpot Wheel</i></h3>
          <ul class="lg-list"><li><b>3 個以上 JACKPOT</b>（任意位置）→ 轉獎金輪盤一次。JACKPOT 本身不賠線。</li>
          <li>輪盤 12 格：MINI 6、MINOR 4、MAJOR 1、GRAND 1。</li>
          <li><b>只有最大注（每線 RM 5 × 20 = RM 100）有 GRAND</b>；非最大注時 GRAND 格變 MAJOR，而且獎金按「總注 ÷ RM 100」比例支付。</li>
          <li>中獎後該級獎池回到種子值。</li></ul>
          <table class="lg-datatable"><thead><tr><th>級別</th><th>目前</th><th>種子</th><th>每轉成長（總注 ×）</th><th>輪盤格數</th></tr></thead><tbody>${jpRows}</tbody></table>
          <p class="lg-muted">獎池成長來自每一轉的總注（合計 3%），不論你押多少都照扣。RTP 92%（最大注，獎池以種子值計），莊家優勢 8%；非最大注約 ${(exactNonMax * 100).toFixed(1)}%。目前總注 ${cents(bet)}。</p>`;
      }

      // ---- 一轉
      async function doSpin() {
        if (state.busy || !state.ready || !alive) return;
        const bet = panel.bet(), lineBet = panel.lineBet();
        if (!ctx.bank.canAfford(bet)) { ui.toast(T.noMoney, { type: 'warn' }); ctx.checkBroke(); return; }
        setBusy(true);
        ctx.bank.debit(bet);
        const pools = jackpots.grow(bet);
        paintJackpots();
        const grid = state.forced || undefined;
        const segment = state.forced ? state.forcedSegment : null;
        state.forced = null; state.forcedSegment = null;
        const out = playSpin({ bet, lineBet, pools, grid, segment });
        state.pending = { win: out.win, claim: out.wheel ? out.wheel.level : null };
        ctx.dealer.say(...T.spinning);
        setWin(0);
        view.reset();
        await view.spin(out.grid);
        if (!alive) return;
        if (out.base.wins.length) {
          out.base.wins.forEach((w) => { view.showLine(LINES[w.line]); view.highlight(w.cells); });
          setWin(out.base.win);
        }
        if (out.wheel) {
          view.highlight(out.jp.cells);
          ctx.dealer.say(...T.wheel);
          await ctx.wait(700);
          if (!alive) return;
          await playWheel(out);
          if (!alive) return;
        } else if (out.base.wins.length) {
          await ctx.wait(300);
          if (!alive) return;
        }
        settle(out);
      }

      /** 輪盤 modal：旋轉 3 秒 → 指針停 → 中獎級別放大 → 按「收下」 */
      function playWheel(out) {
        const w = out.wheel;
        state.wheels += 1;
        return new Promise((resolve) => {
          const n = w.segs.length, deg = 360 / n;
          const colors = { mini: '#2e7d32', minor: '#1565c0', major: '#6a1b9a', grand: '#c62828' };
          const grad = w.segs.map((lv, i) => `${colors[lv]} ${i * deg}deg ${(i + 1) * deg}deg`).join(',');
          const labels = w.segs.map((lv, i) => el('span', {
            class: ['pg-wheel__label', `is-${lv}`, !w.isMax && WHEEL[i] === 'grand' ? 'is-swapped' : null],
            dataset: { seg: i, level: lv },
            style: `transform:translateX(-50%) rotate(${i * deg + deg / 2}deg)`,
          }, [el('b', { text: T.levels[lv].en })]));
          const disc = el('div.pg-wheel__disc', { style: `background:conic-gradient(${grad})` }, labels);
          const result = el('div.pg-wheel__result', { 'aria-live': 'polite', html: w.isMax ? '最大注：有 GRAND 格' : '非最大注：GRAND 格已換成 MAJOR' });
          const body = el('div.pg-wheelwrap', [
            el('div.pg-wheel', [el('div.pg-wheel__pointer', { 'aria-hidden': 'true' }), disc, el('div.pg-wheel__hub', { text: 'JACKPOT' })]),
            result,
          ]);
          let stopped = false;
          wheelModal = ui.modal({
            title: '獎金輪盤 <i class="en">Jackpot Wheel</i>',
            body,
            dismissable: false,
            className: 'pg-wheel-modal',
            actions: [{ id: 'wheel-collect', label: '收下 <i class="en">Collect</i>', primary: true, onClick: () => (stopped ? undefined : false) }],
            onClose: () => { wheelModal = null; resolve(); },
          });
          const btn = wheelModal.el.querySelector('[data-action="wheel-collect"]');
          if (btn) btn.disabled = true;
          const final = 360 * 5 + (360 - (w.idx * deg + deg / 2));
          disc.style.transition = `transform ${LG.ms(3000)}ms cubic-bezier(.12,.7,.2,1)`;
          requestAnimationFrame(() => requestAnimationFrame(() => { disc.style.transform = `rotate(${final}deg)`; }));
          ctx.wait(3000 + 80).then(() => {
            stopped = true;
            const lab = disc.querySelector(`[data-seg="${w.idx}"]`);
            if (lab) lab.classList.add('is-hit');
            body.classList.add('is-done');
            const ratioTxt = w.ratio < 1 ? ` × ${Math.round(w.ratio * 100)}%` : '';
            result.innerHTML = `<b class="pg-wheel__win is-${w.level}">${T.levels[w.level].en} ${T.levels[w.level].zh}</b><span>${cents(w.pool)}${ratioTxt} = <b>${cents(w.prize)}</b></span>`;
            setWin(round2(out.base.win + w.prize));
            if (btn) { btn.disabled = false; try { btn.focus({ preventScroll: true }); } catch { /* */ } }
          });
        });
      }

      function finalize() {
        const p = state.pending;
        if (!p) return null;
        state.pending = null;
        if (p.win > 0) ctx.bank.credit(p.win);
        if (p.claim) jackpots.claim(p.claim);
        return p;
      }

      function settle(out) {
        finalize();
        paintJackpots();
        setWin(out.win);
        const net = round2(out.win - out.bet);
        state.last = { bet: out.bet, win: out.win, net, wheel: out.wheel ? out.wheel.level : null, jp: out.jp.count };
        state.rounds += 1;
        if (out.win > 0) ctx.dealer.say(...T.paying); else ctx.dealer.say(...T.ready);
        ctx.recordRound({ wagered: out.bet, net, outcome: net > 0 ? 'win' : net < 0 ? 'lose' : 'push' });
        ctx.explain(explainOf(out));
        setBusy(false);
        paintHints();
        ctx.checkBroke();
      }

      function explainOf(out) {
        const { bet, lineBet } = out;
        const lineTxt = out.base.wins.map((w) => `第 ${w.lineNo} 線：${SYMS[w.sym].zh} ×${w.count}`);
        const hand = `JACKPOT 符號 ${out.jp.count} 個${out.jp.count >= TRIGGER ? '（觸發輪盤）' : '（需 3 個）'}`
          + (lineTxt.length ? `<br>${lineTxt.join('；')}` : '<br>沒有連線');
        const result = out.win > 0 ? `中獎 <i class="en">WIN</i> ${cents(out.win)}${out.wheel ? `（${T.levels[out.wheel.level].en}）` : ''}` : `未中獎，本次投入 ${cents(bet)}`;
        const f = out.base.wins.map((w) => `第 ${w.lineNo} 線 ${SYMS[w.sym].zh}×${w.count}：${w.mult} × ${cents(lineBet)} = ${cents(w.mult * lineBet)}`);
        if (out.wheel) {
          const w = out.wheel;
          f.push(w.ratio < 1
            ? `輪盤 ${T.levels[w.level].en}：獎池 ${cents(w.pool)} × (${cents(bet)} ÷ RM 100) = ${cents(w.prize)}`
            : `輪盤 ${T.levels[w.level].en}：獎池 ${cents(w.pool)}（最大注全額）`);
        }
        f.push(`總贏 ${cents(out.win)} − 總注 ${cents(bet)} = 淨 <b>${money.fmtSigned(round2(out.win - bet))}</b>`);
        let why;
        if (out.wheel) {
          why = out.wheel.isMax

// ============================================================================
// 5 軸 20 線影片機（財神 / 龍）id: slot-video — 規格 docs/05-game-rules/slot-video.md
//
// 5×3、20 條固定線（LG.slots.LINES_20）、線由左至右、一線只取最高、倍數乘「每線注」。
// WILD 龍（只出現在軸 2–4）替代所有非 Scatter 符號。SCATTER 金幣任意位置：
//   3 / 4 / 5 個 → 10 / 15 / 20 次免費轉 + 即時獎「總注 × 2」；免費轉中可再觸發（同樣加次數與即時獎）。
//   免費轉沿用觸發時的線數與每線注，不扣款，自動連續轉。
//
// 轉軸帶（最終版；符號代碼 W 龍 / CS 財神 / GI 金元寶 / RP 紅包 / KO 鯉魚 / A K Q J / T=10 / N=9 / SC 金幣）
//   每軸組成：CS2 GI2 RP3 KO3 A3 K3 Q4 J4 T4 N4（軸 3 的 T 為 3、軸 5 的 N 為 3）
//   軸 1（34）：+ SC2            軸 2（38）：+ SC1 W5     軸 3（37）：+ SC1 W5
//   軸 4（38）：+ SC1 W5（軸 2 反序）   軸 5（33）：+ SC2
//   每軸 Scatter 間距 ≥ 3，一個畫面每軸最多 1 個金幣。完整序列見下方 STRIPS。
// 精確 RTP（逐軸符號機率解析計算，含免費轉：RTP = V / (1 − q·m)）= 94.047%
//   線獎 79.20% + 金幣即時獎 2.54% = 單轉 V 81.74%；觸發率 q = 1/78.6；平均給 m = 10.29 次；免費轉貢獻 12.31%。
// simulateRTP（含免費轉期望，LG.rng.seed(123)，500,000 轉）= 93.884%（命中率 45.4%）；每轉標準差約 2.7 倍總注（500k 標準誤 ≈ 0.38%）。
// ============================================================================
(() => {
  const { ui, money } = LG;
  const { el } = ui;
  const { fmt, round2 } = money;
  const cents = (n) => fmt(n, { cents: true });

  // ---------------------------------------------------------------- 文案
  const T = {
    credit: { zh: '餘額', en: 'CREDIT' },
    bet: { zh: '總注', en: 'BET' },
    win: { zh: '贏分', en: 'WIN' },
    spin: 'SPIN 轉',
    lines: '線數 <i class="en">Lines</i>',
    lineBet: '每線注 <i class="en">Bet/Line</i>',
    freeLeft: (n) => `FREE SPINS ${n} LEFT`,
    freeZh: (n, w) => `免費轉剩 ${n} 次 · 已贏 ${cents(w)}`,
    freeStart: (n) => `觸發免費轉 ${n} 次！<i class="en">Free spins</i>`,
    retrigger: (n) => `再觸發！+${n} 次免費轉`,
    noMoney: '餘額不足，降低每線注或線數',
    overMax: (max) => `每轉最高 ${cents(max)}`,
    underMin: (min) => `每轉最低 ${cents(min)}`,
    realIntro: (lim) => `真實模式：每轉 <b>${lim}</b>（固定 20 線），<b>沒有倒數</b>，按 SPIN 就轉，只顯示輸贏金額。`,
    noWin: (bet) => `未中獎，本次投入 ${cents(bet)}`,
  };

  // ---------------------------------------------------------------- 符號、賠付、轉軸帶
  const SYMBOLS = {
    W: { zh: '龍', en: 'WILD', note: '百搭' },
    CS: { zh: '財神', en: 'Fortune God' },
    GI: { zh: '元寶', en: 'Gold Ingot' },
    RP: { zh: '紅包', en: 'Red Packet' },
    KO: { zh: '鯉魚', en: 'Koi' },
    A: { zh: 'A', en: 'A' },
    K: { zh: 'K', en: 'K' },
    Q: { zh: 'Q', en: 'Q' },
    J: { zh: 'J', en: 'J' },
    T: { zh: '10', en: '10' },
    N: { zh: '9', en: '9' },
    SC: { zh: '金幣', en: 'SCATTER', note: '分散' },
  };
  /** 倍數 × 每線注 */
  const PAYTABLE = {
    W: { 5: 1000 },
    CS: { 3: 50, 4: 200, 5: 1000 },
    GI: { 3: 25, 4: 100, 5: 400 },
    RP: { 3: 20, 4: 60, 5: 200 },
    KO: { 3: 15, 4: 40, 5: 120 },
    A: { 3: 10, 4: 25, 5: 75 },
    K: { 3: 10, 4: 25, 5: 75 },
    Q: { 3: 5, 4: 15, 5: 50 },
    J: { 3: 5, 4: 15, 5: 50 },
    T: { 3: 5, 4: 10, 5: 40 },
    N: { 3: 5, 4: 10, 5: 40 },
  };
  const WILD = 'W', SCATTER = 'SC';
  const FREE_SPINS = { 3: 10, 4: 15, 5: 20 };
  const SCATTER_MULT = 2;               // 觸發時即時獎 = 總注 × 2
  const LINE_BETS = [0.1, 0.2, 0.5, 1, 2, 5];
  const LINE_OPTS = [1, 5, 10, 20];
  const LINES = LG.slots.LINES_20;

  const S = (s) => Object.freeze(s.trim().split(/\s+/));
  const R2 = 'SC T A CS Q K GI J T RP N N KO Q W A J W K T W RP CS Q KO GI J T A N N K Q W RP J W KO';
  const STRIPS = Object.freeze([
    S('CS KO GI A Q SC K J RP T T KO Q N A J N CS K GI RP Q SC KO J T A T N K Q RP J N'),
    S(R2),
    S('SC J CS A N GI K Q RP T J KO N W A Q W K J W T CS RP Q GI KO J A N N K W W RP T Q KO'),
    S(R2.split(' ').reverse().join(' ')),
    S('CS KO GI A J SC K Q RP N J KO T T A Q CS K J GI RP N SC KO Q A J T K T RP N Q'),
  ]);

  /**
   * 評一個畫面。
   * @param {string[][]} grid grid[reel][row]
   * @param {number} [nLines=20] 啟用線數（取 LINES_20 前 n 條）
   * @param {number} [lineBet=1]
   * @returns {{wins:Array<{line,lineNo,sym,count,mult,cells,amount}>, lineWin, scatter:{count,cells}, scatterWin, freeSpins, win, bet}}
   */
  function evalSpin(grid, nLines = 20, lineBet = 1) {
    const r = LG.slots.evalLines(grid, LINES.slice(0, nLines), PAYTABLE, { wild: WILD, scatter: SCATTER });
    const sc = LG.slots.countScatter(grid, SCATTER);
    const bet = round2(nLines * lineBet);
    const trig = sc.count >= 3;
    const wins = r.wins.map((w) => ({ ...w, amount: round2(w.mult * lineBet) }));
    const lineWin = round2(wins.reduce((s, w) => s + w.amount, 0));
    const scatterWin = trig ? round2(bet * SCATTER_MULT) : 0;
    return { wins, lineWin, scatter: sc, scatterWin, freeSpins: trig ? FREE_SPINS[Math.min(5, sc.count)] : 0, win: round2(lineWin + scatterWin), bet };
  }

  /** 一次付費轉（含其觸發的所有免費轉）的總贏，以「總注」為單位——給 simulateRTP 用 */
  function spinValue(grid) {
    let r = evalSpin(grid, 20, 1);
    let win = r.win, left = r.freeSpins;
    while (left > 0) {
      left -= 1;
      r = evalSpin(LG.slots.spin(STRIPS, 3), 20, 1);
      win += r.win;
      left += r.freeSpins;
    }
    return win / 20;
  }

  function simulate(spins = 500000, seed = 123) {
    if (seed !== null && seed !== undefined) LG.rng.seed(seed);
    const r = LG.slots.simulateRTP({ strips: STRIPS, rows: 3, evaluate: spinValue, bet: 1 }, spins);
    if (seed !== null && seed !== undefined) LG.rng.seed(null);
    return r;
  }

  /**
   * 精確 RTP（解析）。每條線各格的邊際分布 = 該軸符號頻率，且各軸獨立 → 單線期望可直接算；
   * Scatter 用每軸「視窗內金幣數」分布做卷積。免費轉：RTP = V / (1 − q·m)。需要軸 1 沒有 Wild。
   */
  function exactRTP(strips = STRIPS) {
    if (strips[0].includes(WILD)) throw Error('exactRTP 假設軸 1 沒有 Wild');
    const P = strips.map((s) => { const f = {}; s.forEach((x) => { f[x] = (f[x] || 0) + 1 / s.length; }); return f; });
    const p = (i, s) => P[i][s] || 0;
    let line = 0;
    for (const s of Object.keys(PAYTABLE)) {
      if (s === WILD || !p(0, s)) continue;
      const m = [1, 2, 3, 4].map((i) => p(i, s) + p(i, WILD));
      const pay = PAYTABLE[s];
      line += p(0, s) * (m[0] * m[1] * (1 - m[2]) * (pay[3] || 0)
        + m[0] * m[1] * m[2] * (1 - m[3]) * (pay[4] || 0)
        + m[0] * m[1] * m[2] * m[3] * (pay[5] || 0));
    }
    let dist = [1];
    strips.forEach((s) => {
      const d = [0, 0, 0, 0];
      for (let st = 0; st < s.length; st++) { let k = 0; for (let r = 0; r < 3; r++) if (s[(st + r) % s.length] === SCATTER) k++; d[k] += 1 / s.length; }
      const nd = Array(dist.length + 3).fill(0);
      dist.forEach((v, a) => d.forEach((w, b) => { nd[a + b] += v * w; }));
      dist = nd;
    });
    let q = 0, qm = 0;
    dist.forEach((v, k) => { if (k >= 3) { q += v; qm += v * FREE_SPINS[Math.min(5, k)]; } });
    const scatter = q * SCATTER_MULT;
    const V = line + scatter;
    const rtp = V / (1 - qm);
    return { rtp, line, scatter, V, q, m: qm / q, triggerEvery: 1 / q, free: rtp - V };
  }

  const symName = (s) => SYMBOLS[s].zh;
  const lineColor = (n) => `hsl(${(n * 47) % 360} 85% 60%)`;

  function paytableHtml(lineBet = 0.1) {
    const syms = Object.keys(PAYTABLE).filter((s) => s !== WILD);
    const rows = syms.map((s) => `<tr><td>${symName(s)} <i class="en">${SYMBOLS[s].en === SYMBOLS[s].zh ? '' : SYMBOLS[s].en}</i></td>${[3, 4, 5].map((n) => `<td class="sv-pt__m">${PAYTABLE[s][n]}×</td>`).join('')}</tr>`).join('');
    const mini = LINES.map((ln, i) => `<div class="sv-mini" title="第 ${i + 1} 線"><span class="sv-mini__n" style="color:${lineColor(i + 1)}">${i + 1}</span><div class="sv-mini__g">${[0, 1, 2].map((r) => ln.map((y) => `<i class="${y === r ? 'on' : ''}" style="${y === r ? `background:${lineColor(i + 1)}` : ''}"></i>`).join('')).join('')}</div></div>`).join('');
    return `<div class="sv-pt">
      <p class="sv-pt__key"><b>倍數 × 每線注</b>（不是總注！）。每線注 ${cents(lineBet)} 時，3 個財神 = 50 × ${cents(lineBet)} = <b>${cents(50 * lineBet)}</b>。</p>
      <table class="lg-datatable"><thead><tr><th>符號</th><th>3 連</th><th>4 連</th><th>5 連</th></tr></thead><tbody>${rows}</tbody></table>
      <ul class="lg-list">
        <li><b>WILD 龍</b> 百搭 <i class="en">Wild</i>：只出現在第 2–4 軸，替代所有符號（金幣除外）。5 連龍 1000× 是賠付表上的數字，但因為第 1、5 軸沒有龍，實際不會出現。</li>
        <li><b>SCATTER 金幣</b> 分散符號 <i class="en">Scatter</i>：任意位置 3 / 4 / 5 個 → <b>10 / 15 / 20 次免費轉 <i class="en">Free spins</i></b>，並即時贏「總注 × 2」。免費轉中可再觸發。金幣不算線。</li>
        <li>線由<b>最左邊第 1 軸</b>開始連續 3 個以上才算；一條線只算最高的一種；多條線中獎就加總。</li>
        <li>RTP <i class="en">Return to Player</i> 94%（其中約 12% 來自免費轉）。</li>
      </ul>
      <h3>20 條線 <i class="en">Paylines</i></h3><div class="sv-minis">${mini}</div></div>`;
  }

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: 'slot-video',
    category: 'slots',
    order: 2,
    name: { zh: '5 軸 20 線影片機', en: 'Video Slot 5×3 · 20 Lines' },
    summary: '財神與龍：20 條線、百搭、金幣免費轉——現代老虎機的標準配備。',
    houseEdge: [{ bet: { zh: '總體', en: 'Overall' }, edge: 6.0, best: true }],
    limits: { real: { min: 2, max: 100 }, practice: { min: 0.1, max: 100 } },
    logic: { STRIPS, SYMBOLS, PAYTABLE, FREE_SPINS, SCATTER_MULT, LINE_BETS, LINE_OPTS, WILD, SCATTER, evalSpin, spinValue, simulate, exactRTP },

    create(ctx) {
      const state = {
        phase: 'idle', staked: 0, spins: 0, freeSpinsPlayed: 0, free: null, shownLine: null, paytableOpened: false,
        wagered: 0, won: 0, lastResult: null,
      };
      let root, view, panel, spinB, freeEl, hintEl, meters = {}, labels = {}, winAnim = 0;
      let ready = !ctx.isReal;
      const exact = exactRTP();

      const symView = Object.fromEntries(Object.entries(SYMBOLS).map(([k, s]) => [k, {
        label: s.zh,
        svg: `<span class="sv-s sv-s--${k}"><b>${s.zh}</b>${k === WILD || k === SCATTER ? `<small>${s.en}</small>` : ''}</span>`,
      }]));

      function meter(key, t) {
        const v = el('b.sv-meter__v', { dataset: { role: key } });
        meters[key] = v;
        return el('div', { class: ['sv-meter', `sv-meter--${key}`] }, [el('span.sv-meter__k', { html: `${t.en} <i class="en">${t.zh}</i>` }), v]);
      }

      function labelCol(side) {
        const col = el('div', { class: ['sv-linenos', `sv-linenos--${side}`] });
        const rows = [0, 1, 2].map(() => el('div.sv-linenos__row'));
        rows.forEach((r) => col.appendChild(r));
        for (let n = side === 'l' ? 1 : 11; n <= (side === 'l' ? 10 : 20); n++) {
          const row = LINES[n - 1][side === 'l' ? 0 : 4];
          const b = el('button', { type: 'button', class: 'sv-lineno', dataset: { line: n }, 'aria-label': `第 ${n} 線`, style: `--c:${lineColor(n)}`, text: String(n) });
          b.addEventListener('click', () => toggleLine(n));
          labels[n] = b;
          rows[row].appendChild(b);
        }
        return col;
      }

      function build() {
        freeEl = el('div.sv-free', { 'aria-live': 'polite' }, [el('b.sv-free__en'), el('span.sv-free__zh')]);
        const head = el('div.sv-head', [el('div.sv-logo', { html: '財神到 <i class="en">FORTUNE DRAGON</i>' })]);
        const legend = el('div.sv-legend', [
          el('span.sv-legend__i', { dataset: { sym: 'W' }, html: `${symView.W.svg}<em>百搭 <i class="en">Wild</i>・軸 2–4</em>` }),
          el('span.sv-legend__i', { dataset: { sym: 'SC' }, html: `${symView.SC.svg}<em>分散 <i class="en">Scatter</i>・3 個免費轉</em>` }),
        ]);
        const reels = el('div.sv-reels');
        const board = el('div.sv-board', [labelCol('l'), reels, labelCol('r')]);
        const meterRow = el('div.sv-meters', [meter('credit', T.credit), meter('bet', T.bet), meter('win', T.win)]);
        const machine = el('div.sv-machine', [head, freeEl, legend, board, meterRow]);
        const ctrl = el('div.sv-controls');
        spinB = el('button', { type: 'button', class: 'lg-btn lg-btn--primary sv-spin', dataset: { action: 'spin' }, html: T.spin });
        hintEl = el('div.lg-hint.sv-hint', { hidden: true });
        root.append(machine, ctrl, el('div.sv-spinrow', [spinB]), hintEl);

        view = LG.slotView.create(reels, { reels: 5, rows: 3, symbols: symView, strips: STRIPS });
        view.setGrid(LG.slots.gridAt(STRIPS, [3, 8, 14, 20, 26]));
        const pb = LG.slotView.paytableButton(head, { render: () => paytableHtml(panel ? panel.lineBet() : 0.1) });
        pb.addEventListener('click', () => { state.paytableOpened = true; });
        panel = LG.slotView.betPanel(ctrl, {
          lines: ctx.isReal ? [20] : LINE_OPTS, lineBets: LINE_BETS, linesLabel: T.lines, lineBetLabel: T.lineBet,
          onChange: () => { paintMeters(); paintSpin(); paintLabels(); },
        });
        panel.el.children[0].classList.add('sv-linebet');
        panel.el.children[1].classList.add('sv-lines');
        spinB.addEventListener('click', () => { spinPaid(); });
        ctx.on('bank:change', () => { paintMeters(); paintSpin(); });
        paintMeters(); setWin(0); paintSpin(); paintLabels(); paintFree();
      }

      // ---- 畫面更新
      function paintMeters() {
        if (!meters.credit) return;
        meters.credit.textContent = cents(ctx.bank.balance());
        meters.bet.textContent = cents(state.free ? state.free.bet : panel.bet());
      }
      function setWin(n) { if (meters.win) { meters.win.textContent = cents(n); meters.win.dataset.win = String(n); } }
      function rollWin(from, to) {
        cancelAnimationFrame(winAnim);
        const dur = LG.ms(to > from ? 600 : 0);
        if (!dur || typeof requestAnimationFrame !== 'function') { setWin(to); return; }
        const t0 = performance.now();
        const step = (t) => {
          if (!ctx.alive()) return;
          const k = Math.min(1, (t - t0) / dur);
          setWin(k >= 1 ? to : round2(from + (to - from) * k));
          if (k < 1) winAnim = requestAnimationFrame(step);
        };
        winAnim = requestAnimationFrame(step);
      }
      const canSpin = () => ready && state.phase === 'idle' && ctx.bank.canAfford(panel.bet());
      function paintSpin() {
        if (!spinB) return;
        spinB.disabled = !canSpin();
        // 餘額付不起目前押注：SPIN 灰掉 + 提示一次（恢復可付後重置）
        const broke = ready && state.phase === 'idle' && !ctx.bank.canAfford(panel.bet());
        if (broke && !state.warnedAfford) ui.toast(T.noMoney, { type: 'warn' });
        state.warnedAfford = broke;
        spinB.classList.toggle('is-spinning', state.phase !== 'idle');
        if (panel) panel.setEnabled(state.phase === 'idle');
      }
      function paintLabels() {
        const n = state.free ? state.free.lines : panel.lines();
        Object.entries(labels).forEach(([k, b]) => b.classList.toggle('is-off', Number(k) > n));
      }
      function paintFree(demoN) {
        if (!freeEl) return;
        const f = state.free;
        const n = f ? f.left : demoN;
        const on = n !== undefined && n !== null;
        freeEl.hidden = !on;
        root.classList.toggle('is-free', on);
        if (on) {
          freeEl.firstChild.textContent = T.freeLeft(n);
          freeEl.lastChild.textContent = T.freeZh(n, f ? f.win : 0);
        }
      }
      function paintHints() {
        if (!hintEl) return;
        hintEl.hidden = !ctx.hints;
        const ret = state.wagered ? `本次已押 ${cents(state.wagered)}，拿回 ${cents(state.won)}（${((state.won / state.wagered) * 100).toFixed(1)}%）。` : '';
        hintEl.textContent = `提示：RTP 94%。免費轉平均每 ${Math.round(exact.triggerEvery)} 轉觸發一次，它的獎金本來就算在 94% 裡面，不是額外賺的。${ret}短期亂跳，沒有「快出了」。`;
      }

      /** 點線號：顯示該線路徑（再點一次收起） */
      function toggleLine(n) {
        if (state.phase !== 'idle') return;
        const same = state.shownLine === n;
        view.clear();
        Object.values(labels).forEach((b) => b.classList.remove('is-on', 'is-win'));
        if (same) { state.shownLine = null; return; }
        state.shownLine = n;
        view.showLine(LINES[n - 1], { color: lineColor(n) });
        labels[n].classList.add('is-on');
      }

      function showResult(r) {
        view.clear();
        Object.values(labels).forEach((b) => b.classList.remove('is-on', 'is-win'));
        state.shownLine = null;
        const cells = [];
        r.wins.forEach((w) => {
          view.showLine(LINES[w.line], { color: lineColor(w.lineNo) });
          labels[w.lineNo].classList.add('is-win');
          cells.push(...w.cells);
        });
        if (r.freeSpins) cells.push(...r.scatter.cells);
        if (cells.length) view.highlight(cells);
      }

      // ---- 一轉
      async function doSpin(nLines, lineBet) {
        const grid = LG.slots.spin(STRIPS, 3);
        const r = evalSpin(grid, nLines, lineBet);
        r.grid = grid;
        await view.spin(grid);
        if (ctx.alive()) showResult(r);
        return r;
      }

      async function spinPaid() {
        if (state.phase !== 'idle' || !ready) return;
        const nLines = panel.lines(), lineBet = panel.lineBet(), bet = panel.bet();
        if (bet < ctx.limits.min - 1e-9) { ui.toast(T.underMin(ctx.limits.min), { type: 'warn' }); return; }
        if (bet > ctx.limits.max + 1e-9) { ui.toast(T.overMax(ctx.limits.max), { type: 'warn' }); return; }
        if (!ctx.bank.canAfford(bet)) { ui.toast(T.noMoney, { type: 'warn' }); paintSpin(); return; }
        state.phase = 'spinning';
        ctx.bank.debit(bet);
        state.staked = bet;
        setWin(0);
        paintSpin();
        const r = await doSpin(nLines, lineBet);
        if (!ctx.alive()) return;
        if (r.win > 0) ctx.bank.credit(r.win);
        state.staked = 0;
        state.spins += 1;
        state.lastResult = r;
        const net = round2(r.win - bet);
        ctx.recordRound({ wagered: bet, net, outcome: net > 0 ? 'win' : net < 0 ? 'lose' : 'push' });
        rollWin(0, r.win);
        let fs = null;
        if (r.freeSpins) {
          state.phase = 'free';
          paintSpin();
          fs = await runFree(r.freeSpins, nLines, lineBet, bet, r.win);
          if (!ctx.alive() || !fs) return;
        }
        const total = round2(r.win + (fs ? fs.win : 0));
        state.wagered = round2(state.wagered + bet);
        state.won = round2(state.won + total);
        explain(r, fs, bet, nLines, lineBet, round2(total - bet));
        state.phase = 'idle';
        paintSpin();
        paintHints();
        ctx.checkBroke();
      }

      async function runFree(n, nLines, lineBet, bet, baseWin) {
        state.free = { left: n, total: n, win: 0, spins: 0, retriggers: 0, lines: nLines, lineBet, bet, best: null };
        paintFree(); paintMeters(); paintLabels();
        ui.toast(T.freeStart(n));
        await ctx.wait(900);
        while (state.free.left > 0) {
          if (!ctx.alive()) return null;
          state.free.left -= 1;
          state.free.spins += 1;
          paintFree();
          const r = await doSpin(nLines, lineBet);
          if (!ctx.alive()) return null;
          const f = state.free;
          if (r.win > 0) ctx.bank.credit(r.win);
          const before = round2(baseWin + f.win);
          f.win = round2(f.win + r.win);
          if (!f.best || r.win > f.best.win) f.best = r;
          state.freeSpinsPlayed += 1;
          ctx.recordRound({ wagered: 0, net: r.win, outcome: r.win > 0 ? 'win' : 'push' });
          rollWin(before, round2(baseWin + f.win));
          if (r.freeSpins) {
            f.left += r.freeSpins; f.total += r.freeSpins; f.retriggers += 1;
            ui.toast(T.retrigger(r.freeSpins));
          }
          paintFree();
          await ctx.wait(r.win > 0 ? 900 : 450);
        }
        const done = state.free;
        state.free = null;
        paintFree(); paintMeters(); paintLabels();
        return done;
      }

      function winLine(w, lineBet) {
        const name = w.sym === WILD ? 'WILD 龍' : symName(w.sym);
        const wilds = w.cells.filter(([rr, yy]) => state.lastGrid && state.lastGrid[rr][yy] === WILD).length;
        return `第 ${w.lineNo} 線 ${name} ×${w.count}${wilds ? `（含 ${wilds} 個龍）` : ''}：${w.mult} × ${cents(lineBet)} = ${cents(w.amount)}`;
      }

      function explain(r, fs, bet, nLines, lineBet, net) {
        state.lastGrid = r.grid;
        const parts = r.wins.map((w) => winLine(w, lineBet));
        if (r.scatterWin) parts.push(`金幣 ×${r.scatter.count}：總注 ${cents(bet)} × ${SCATTER_MULT} = ${cents(r.scatterWin)}（即時獎）`);
        if (fs) parts.push(`免費轉 ${fs.spins} 次${fs.retriggers ? `（再觸發 ${fs.retriggers} 次）` : ''}：共贏 ${cents(fs.win)}（不扣注）`);
        const total = round2(r.win + (fs ? fs.win : 0));
        const betText = `${nLines} 線 × ${cents(lineBet)} = ${cents(bet)}`;
        const hand = r.wins.length || r.scatter.count
          ? [r.wins.length ? `中獎線：${r.wins.map((w) => `<b>${w.lineNo}</b>`).join('、')}` : '', r.scatter.count ? `金幣 ${r.scatter.count} 個` : ''].filter(Boolean).join('；')
          : `${nLines} 條線都沒有從第 1 軸連 3 個以上`;
        let result;
        if (fs) result = `觸發免費轉 <i class="en">Free spins</i> ${fs.total} 次，總贏 <b>${cents(total)}</b>`;
        else if (total > 0) result = `中 ${r.wins.length} 線${r.scatterWin ? ' + 金幣' : ''}，總贏 <b>${cents(total)}</b>`;
        else result = '未中獎 <i class="en">No win</i>';
        const formula = total > 0
          ? `${parts.join('<br>')}<br>總贏 ${cents(total)} − 總注 ${cents(bet)}（${betText}）= 淨 <b>${money.fmtSigned(net)}</b>`
          : `${T.noWin(bet)}（${betText}）<br>淨 <b>${money.fmtSigned(net)}</b>`;
        let why;
        if (fs) why = `3 個以上金幣出現在任意位置就觸發，不用在線上。免費轉用同一組線與每線注自動轉，不扣錢；它的獎金本來就算在 RTP 94% 裡。`;
        else if (r.wins.length) why = `倍數乘的是<b>每線注</b>（${cents(lineBet)}），不是總注。線要從最左邊第 1 軸開始連續；龍可以替代其他符號。${r.wins.length > 1 ? '多條線同時中就加總。' : ''}${net < 0 ? '贏分少於總注，所以淨額還是輸——燈亮不等於賺。' : ''}`;
        else if (r.scatter.count) why = `金幣只有 ${r.scatter.count} 個，要 3 個才觸發免費轉。每一轉都是獨立的，沒有「快出了」。`;
        else why = '這一轉沒有任何線從第 1 軸連 3 個以上。每一轉都是獨立的，上一轉輸了不會讓下一轉更容易中。';
        ctx.explain({ net, hand, result, formula, why });
      }

      // ---- 教學示範
      const demo = {
        /** rows = [上列, 中列, 下列]，每列 5 個符號代碼（空白分隔） */
        setGrid(rows, nLines = 20, lineBet = 0.1) {
          if (state.phase !== 'idle') return;
          const R = rows.map((x) => x.trim().split(/\s+/));
          const grid = [0, 1, 2, 3, 4].map((c) => [R[0][c], R[1][c], R[2][c]]);
          view.reset();
          view.setGrid(grid);
          const r = evalSpin(grid, nLines, lineBet);
          showResult(r);
          return r;
        },
        showFree(n) { if (!state.free) paintFree(n); },
        clear() {
          if (!view || state.phase !== 'idle') return;
          view.clear();
          Object.values(labels).forEach((b) => b.classList.remove('is-on', 'is-win'));
          state.shownLine = null;
          if (!state.free) paintFree();
        },
      };
      const G_CS3 = ['A K Q J T', 'CS CS CS N Q', 'KO RP J A N'];
      const G_TWO = ['A A A K Q', 'CS CS CS N Q', 'KO RP J T N'];
      const G_WILD = ['Q N K J T', 'GI W GI A Q', 'KO RP J T N'];
      const G_SC = ['SC K Q N T', 'A J SC Q K', 'KO RP J A SC'];

      function tutorialSteps() {
        const steps = [
          // ===== layout
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：5 軸 20 線',
            body: '<p>5 個轉軸 × 3 列，有 20 條<b>賠付線 <i class="en">Paylines</i></b>。先看懂畫面，再轉。</p>',
            highlight: ['.sv-machine'] },
          { id: 'layout-lines', section: 'layout', title: `賠付線 <i class="en">Payline</i>`,
            body: '<p>兩側數字是線號。點一下就會畫出那條線怎麼走——不一定是直線。</p>',
            highlight: ['.sv-lineno[data-line="4"]', '.sv-reels'],
            action: { label: '點線號「4」看它的路徑（V 字形）', check: () => state.shownLine === 4 || '點左上方的「4」' } },
          { id: 'layout-linebet', section: 'layout', title: `每線注 <i class="en">Bet per line</i>`,
            body: '<p>每一條線押多少：RM 0.10 到 RM 5。<b>賠付表的倍數就是乘這個數</b>。</p>',
            highlight: ['.sv-linebet'] },
          { id: 'layout-total', section: 'layout', title: `總注 <i class="en">Total bet</i>`,
            body: '<p>總注 = 線數 × 每線注。例：20 × RM 0.10 = <b>RM 2.00</b>，每轉從餘額扣這麼多。</p>',
            highlight: ['.sv-lines', '.lg-betpanel__total'] },
          { id: 'layout-wild', section: 'layout', title: `百搭 <i class="en">Wild</i>：龍`,
            body: '<p>龍只出現在第 2–4 軸，可以<b>替代任何符號</b>（金幣除外）幫你連線。</p>',
            highlight: ['.sv-legend [data-sym="W"]'] },
          { id: 'layout-scatter', section: 'layout', title: `分散符號 <i class="en">Scatter</i>：金幣`,
            body: '<p>金幣不用在線上：<b>任意位置 3 個</b>就觸發免費轉。</p>',
            highlight: ['.sv-legend [data-sym="SC"]'] },
          { id: 'layout-paytable', section: 'layout', title: `怎麼讀賠付表 <i class="en">Pay Table</i>`,
            body: '<p>表上「50×」是 <b>× 每線注</b>，不是 × 總注！先打開看一次。</p>',
            highlight: ['[data-action="paytable"]'],
            action: { label: '按「賠付表 Pay Table」', check: () => state.paytableOpened || '按上方的「賠付表」' } },
          // ===== flow
          { id: 'flow-intro', section: 'flow', title: '這段你會學到：一轉的流程',
            body: '<p>SPIN → 五軸依序停 → 中獎線亮起 → 贏分加總進餘額。沒有荷官、沒有倒數。</p>',
            highlight: ['.sv-spinrow'] },
          { id: 'flow-spin', section: 'flow', title: `轉 <i class="en">SPIN</i>`,
            body: '<p>按 SPIN，總注立刻從 CREDIT 扣掉。</p>',
            highlight: ['[data-action="spin"]', '.sv-meters'],
            action: { label: '按「SPIN 轉」轉一次', check: () => state.spins > 0 || '按下方的 SPIN 轉' } },
          { id: 'flow-lines', section: 'flow', title: '停輪後線路亮起',
            body: '<p>中獎的線會畫出來、兩側線號發亮，中獎格會閃。</p>',
            highlight: ['.sv-board'], setup: () => demo.setGrid(G_TWO) },
          { id: 'flow-sum', section: 'flow', title: '贏分加總',
            body: '<p>所有中獎線的贏分<b>加起來</b>顯示在 WIN，再自動加進 CREDIT。</p>',
            highlight: ['.sv-meters'] },
          { id: 'flow-free', section: 'flow', title: `免費轉 <i class="en">Free spins</i> 怎麼觸發`,
            body: '<p>3 / 4 / 5 個金幣 → 10 / 15 / 20 次。背景變色、顯示剩餘次數，機器<b>自動連轉</b>，不扣錢。</p>',
            highlight: ['.sv-free', '.sv-reels'], setup: () => { demo.setGrid(G_SC); demo.showFree(10); } },
          // ===== payout
          { id: 'payout-intro', section: 'payout', title: '這段你會學到：怎麼算贏多少',
            body: '<p>一條線贏 = <b>倍數 × 每線注</b>；全部中獎線加起來才是這轉贏分。</p>',
            highlight: ['[data-action="paytable"]'] },
          { id: 'payout-one', section: 'payout', title: '一條線的例子',

            highlight: ['.sv-reels', '.sv-lineno[data-line="1"]', '.sv-lineno[data-line="2"]'], setup: () => demo.setGrid(G_TWO) },
          { id: 'payout-wild', section: 'payout', title: '龍幫忙連線',
            body: '<p>中線 元寶・龍・元寶 = 3 個元寶：<br><b>25 × RM 0.10 = RM 2.50</b>。龍不會另外賠。</p>',
            highlight: ['.sv-reels'], setup: () => demo.setGrid(G_WILD) },
          // ===== strategy
          { id: 'strategy-rtp', section: 'strategy', title: `RTP 是什麼 <i class="en">Return to Player</i>`,
            body: '<table class="lg-datatable"><tr><th>RTP</th><th>莊家優勢</th></tr><tr><td>94%</td><td>6%</td></tr></table><p>每押 RM 100，長期平均拿回 RM 94。</p>',

          { id: 'strategy-free', section: 'strategy', title: '免費轉不是「賺」',
            body: `<p>免費轉約佔 RTP 的 ${Math.round((exact.free / exact.rtp) * 100)}%，本來就算在 94% 裡。它是「延後發的獎金」，不是送你的錢。</p>`,
            highlight: ['.sv-legend [data-sym="SC"]'] },
          { id: 'strategy-size', section: 'strategy', title: '押大不改變比例',
            body: '<p>總注 RM 2 平均每轉輸 RM 0.12；總注 RM 100 平均輸 RM 6。<b>都是 6%</b>，押大只是輸得快。</p>',
            highlight: ['.lg-betpanel'] },
          { id: 'strategy-due', section: 'strategy', title: '沒有「快出了」',
            body: '<p>很久沒開免費轉，下一轉的機率還是一樣。<b>這只是紀錄，不能預測</b>。</p>',
            highlight: ['.sv-reels'] },
          { id: 'strategy-dont', section: 'strategy', title: '別押：追損',
            body: '<p>輸了就加大每線注想翻本？損失只會來得更快。別追損 <i class="en">Don\'t chase losses</i>。</p>',
            highlight: ['.sv-linebet'] },
          { id: 'strategy-budget', section: 'strategy', title: '該押：小注＋預算',
            body: '<p>用最小每線注慢慢玩。今晚只帶 RM 500，輸完就走。</p>',
            highlight: ['.sv-meter--credit'] },
        ];
        // 每步先清掉上一步的示範畫面（demo.clear 不會影響進行中的真實轉動/免費轉）
        return steps.map((s) => ({ ...s, setup: (inst) => { demo.clear(); if (s.setup) s.setup(inst); } }));
      }

      return {
        state,
        demo,
        panel: () => panel,
        view: () => view,
        spin: spinPaid,
        mount(el0) {
          root = el0;
          root.classList.add('sv-root');
          build();
          paintHints();
          ctx.on('hints:change', paintHints);
          if (ctx.isPractice) {
            ctx.strategyPanel(ui.table([
              ['來源', '佔 RTP'],
              ['線獎 <i class="en">Line wins</i>', `${(exact.line * 100).toFixed(1)}%`],
              ['金幣即時獎', `${(exact.scatter * 100).toFixed(1)}%`],
              ['免費轉 <i class="en">Free spins</i>', `${(exact.free * 100).toFixed(1)}%`],
              ['合計 RTP', `${(exact.rtp * 100).toFixed(1)}%`],
            ], { caption: `免費轉平均每 ${Math.round(exact.triggerEvery)} 轉觸發一次` }));
          }
          if (ctx.isReal) {
            Promise.resolve().then(() => {
              const b = document.querySelector('[data-action="real-start"]');
              const p = b && b.closest('.lg-modal') && b.closest('.lg-modal').querySelector('.lg-modal__body p');
              if (p) p.innerHTML = T.realIntro(`${cents(ctx.limits.min)} – ${cents(ctx.limits.max)}`);
            });
            ctx.ready.then(() => { ready = true; paintSpin(); });
          }
          root.dataset.ready = '1';
        },
        unmount() {
          cancelAnimationFrame(winAnim);
          if (state.staked > 0) { ctx.bank.credit(state.staked); state.staked = 0; }
          if (view) view.destroy();
        },
        tutorialSteps,
      };
    },
  });
})();


/* ==== src/games/three-card-poker.js ==== */
// ============================================================================
// Three Card Poker（id: three-card-poker）— 規格：docs/05-game-rules/three-card-poker.md
//
// 兩個獨立主注：Ante/Play（對莊）與 Pair Plus（只看自己）。可只押其一。
// 一局：Pair Plus / Ante → No more bets → 各 3 張 → 有 Ante 時玩家棄牌 Fold / 跟注 Play（= Ante 同額；
//      真實 30 秒未操作 = 棄牌）→ 莊開牌 → 莊 Q 高以上合格 → 結算（Ante、Play、Ante Bonus、Pair Plus 各一行）。
// 金流（CR-A1）：No more bets 後 debit(Ante + Pair Plus)；Play 時 debit(Ante)；結算 credit(拿回含本金)。
// 假設（見 docs/change-requests/three-card-poker.md）：Ante Bonus 需要有 Play（棄牌不領）；Pair Plus 棄牌仍結算。
// ============================================================================
(() => {
  const { ui, money, poker } = LG;
  const { el, term } = ui;
  const { fmt, round2, fmtSigned } = money;

  // ---------------------------------------------------------------- 常數
  const ID = 'three-card-poker';
  const DECIDE_SECONDS = 30;
  const ANTE_BONUS = { STRAIGHT: 1, TRIPS: 4, SF: 5 };
  const PAIR_PLUS = { PAIR: 1, FLUSH: 4, STRAIGHT: 6, TRIPS: 30, SF: 40 };
  const Q64 = poker.eval3(LG.cards.parseMany('QS 6H 4D')).score;   // Q-6-4 門檻
  const QUAL_MIN = poker.eval3(LG.cards.parseMany('QS 3H 2D')).score; // 莊 Q 高最小

  // ---------------------------------------------------------------- 文案
  const T = {
    pairPlus: { zh: '對子加注', en: 'Pair Plus', odds: '1:1–40:1' },
    ante: { zh: '底注', en: 'Ante', odds: '1:1' },
    play: { zh: '跟注', en: 'Play', odds: '1:1', note: '= Ante・看牌後自動放' },
    dealer: { zh: '莊家', en: 'Dealer' },
    you: { zh: '你', en: 'You' },
    qualifyPrint: 'DEALER PLAYS WITH QUEEN HIGH OR BETTER',
    qualifyZh: '莊家 Q 高牌以上才合格',
    fold: { zh: '棄牌', en: 'Fold' },
    playBtn: { zh: '跟注', en: 'Play' },
    playAuto: '「跟注 Play」格不用自己放：看牌後按「跟注」會自動放與 Ante 同額',
    needBet: '請押底注 <i class="en">Ante</i> 或對子加注 <i class="en">Pair Plus</i>',
    playWarn: (x) => `提醒：跟注時要再放與 Ante 同額（${fmt(x)}），餘額可能不夠`,
    noPlayCash: '餘額不足以跟注',
    decide: ['請決定：跟 或 棄', 'Play or fold?'],
    timeout: '30 秒未決定 → 視為棄牌 <i class="en">Fold</i>',
    ppTable: [['同花順', 'Straight Flush', '40:1'], ['三條', 'Three of a Kind', '30:1'], ['順子', 'Straight', '6:1'], ['同花', 'Flush', '4:1'], ['一對', 'Pair', '1:1']],
    abTable: [['同花順', 'Straight Flush', '5:1'], ['三條', 'Three of a Kind', '4:1'], ['順子', 'Straight', '1:1']],
    ranking: '同花順 > 三條 > <b>順子 > 同花</b> > 一對 > 高牌',
  };

  // ---------------------------------------------------------------- 純邏輯（Node 可測）
  const label = (c) => LG.cards.label(c);
  const labels = (cs) => cs.map(label).join(' ');
  const describe = (ev) => poker.describe(ev);
  const RZ = { 14: 'A', 13: 'K', 12: 'Q', 11: 'J', 10: '10' };
  const rz = (r) => RZ[r] || String(r);

  /** 莊家合格：Q 高牌以上 */
  function qualifies(dealer) {
    const de = Array.isArray(dealer) ? poker.eval3(dealer) : dealer;
    return de.score >= QUAL_MIN;
  }
  /** Q-6-4 策略：≥ Q-6-4 跟注 Play，否則棄牌 */
  function shouldPlay(player) {
    const pe = Array.isArray(player) ? poker.eval3(player) : player;
    return pe.score >= Q64;
  }
  function strategyText(pe) {
    if (pe.level > 0) return `你有${pe.name.zh}（一對以上）→ 跟注`;
    const [a, b, c] = pe.ranks;
    const s = `${rz(a)}-${rz(b)}-${rz(c)}`;
    return shouldPlay(pe) ? `${s} ≥ Q-6-4 → 跟注` : `${s} < Q-6-4 → 棄牌`;
  }

  const nm = (spot) => (spot === 'anteBonus' ? term('Ante 獎金', 'Ante Bonus') : term(T[spot].zh, T[spot].en));
  const line = (spot, stake, result, pay, formula, extra = {}) =>
    ({ spot, stake, result, pay: round2(pay), returned: round2(result === 'lose' ? 0 : stake + pay), formula, ...extra });

  /**
   * 結算。
   * @param {{ante?:number, play?:number, pairPlus?:number, folded?:boolean, player:Array, dealer:Array}} o
   * @returns {{pe, de, qualifies, cmp, folded, lines, wagered, returned, net, outcome, steps}}
   */
  function settle(o) {
    const { ante = 0, play = 0, pairPlus = 0, folded = false, player, dealer } = o;
    const pe = poker.eval3(player), de = poker.eval3(dealer);
    const q = qualifies(de);
    const cmp = Math.sign(pe.score - de.score);
    const lines = [];
    const steps = {};
    if (ante > 0) {
      if (folded) {
        steps.qualify = `你已棄牌，莊牌不影響 Ante（莊牌：${describe(de)}）`;
        steps.compare = '棄牌不比牌';
        lines.push(line('ante', ante, 'lose', -ante, `${nm('ante')} ${fmt(ante)} 輸（棄牌）= −${fmt(ante)}`));
      } else {
        steps.qualify = q
          ? `莊家 ${describe(de)} ≥ Q 高 → <b>合格</b> <i class="en">Dealer qualifies</i>`
          : `莊家 ${describe(de)} 不到 Q 高 → <b>不合格</b> <i class="en">Dealer does not qualify</i>`;
        const win = (spot, amt) => line(spot, amt, 'win', amt, `${nm(spot)} ${fmt(amt)} × 1 = +${fmt(amt)}（拿回 ${fmt(amt * 2)}）`);
        const push = (spot, amt) => line(spot, amt, 'push', 0, `${nm(spot)} ${fmt(amt)} 退回（push）= RM 0`);
        const lose = (spot, amt) => line(spot, amt, 'lose', -amt, `${nm(spot)} ${fmt(amt)} 輸 = −${fmt(amt)}`);
        if (!q) {
          steps.compare = '莊不合格 → 不比牌：Ante 賠 1:1、Play 退回';
          lines.push(win('ante', ante), push('play', play));
        } else if (cmp > 0) {
          steps.compare = `你的 ${describe(pe)} > 莊的 ${describe(de)} → <b>你贏</b>`;
          lines.push(win('ante', ante), win('play', play));
        } else if (cmp < 0) {
          steps.compare = `你的 ${describe(pe)} < 莊的 ${describe(de)} → <b>莊贏</b>`;
          lines.push(lose('ante', ante), lose('play', play));
        } else {
          steps.compare = `雙方同為 ${describe(pe)} → <b>平手</b> <i class="en">Push</i>`;
          lines.push(push('ante', ante), push('play', play));
        }
        const ab = ANTE_BONUS[pe.cat];
        if (ab) {
          const pay = round2(ante * ab);
          // Ante Bonus 不是另一注：stake 記 0，只把彩金加進拿回
          lines.push(line('anteBonus', 0, 'win', pay, `${nm('anteBonus')}：${pe.name.zh} ${ab}:1 → ${fmt(ante)} × ${ab} = +${fmt(pay)}（不論莊牌）`));
        }
      }
    } else {
      steps.qualify = `沒有押 Ante，莊牌只是亮出來（${describe(de)}）`;
      steps.compare = '只押 Pair Plus → 不比牌';
    }
    if (pairPlus > 0) {
      const m = PAIR_PLUS[pe.cat];
      if (m) {
        const pay = round2(pairPlus * m);
        lines.push(line('pairPlus', pairPlus, 'win', pay, `${nm('pairPlus')} ${fmt(pairPlus)} × ${m}（${pe.name.zh} ${m}:1）= +${fmt(pay)}（拿回 ${fmt(pairPlus + pay)}）`));
      } else {
        lines.push(line('pairPlus', pairPlus, 'lose', -pairPlus, `${nm('pairPlus')} ${fmt(pairPlus)}：沒有一對以上 → 輸 = −${fmt(pairPlus)}`));
      }
    }
    const wagered = round2(ante + (folded ? 0 : play) + pairPlus);
    const returned = round2(lines.reduce((s, l) => s + l.returned, 0));
    const net = round2(returned - wagered);
    return { pe, de, qualifies: q, cmp, folded, lines, wagered, returned, net, steps,
      outcome: net > 0 ? 'win' : net < 0 ? 'lose' : 'push' };
  }

  // ---------------------------------------------------------------- 註冊
  LG.registerGame({
    id: ID,
    category: 'poker-table',
    order: 2,
    name: { zh: '三張撲克', en: 'Three Card Poker' },
    summary: '三張牌比莊家，另有只看自己牌型的 Pair Plus。Q-6-4 以上就跟。',
    houseEdge: [
      { bet: { zh: '對子加注 Pair Plus（1-4-6-30-40）', en: 'Pair Plus' }, edge: 2.32, best: true },
      { bet: { zh: '底注 Ante/Play（Q-6-4 策略）', en: 'Ante/Play' }, edge: 3.37 },
    ],
    limits: { real: { min: 25, max: 500 }, practice: { min: 10, max: 100000 } },
    denoms: [10, 25, 50, 100, 500, 1000],
    countdown: 15,
    logic: { settle, qualifies, shouldPlay, strategyText, ANTE_BONUS, PAIR_PLUS, Q64, QUAL_MIN, DECIDE_SECONDS },

    create(ctx) {
      const state = { phase: 'idle', player: [], dealer: [], staked: 0, rounds: 0, decision: null, forced: null, last: null };
      const lim = ctx.limits;
      const bets = new LG.Bets({
        min: lim.min, max: Infinity, perSpotMin: lim.min, perSpotMax: lim.max,
        spotRules: {
          pairPlus: { min: lim.min, max: lim.max, label: '對子加注 Pair Plus' },
          ante: { min: lim.min, max: lim.max, label: '底注 Ante' },
          play: { min: 0, max: Infinity, label: '跟注 Play' },
        },
      });
      const shoe = LG.cards.newShoe(1, { cutCard: 0 });
      let root, tableEl, dealerHand, playerHand, dealerRank, playerRank, hintEl, tray, layer, bar, acts, decideCd = null;

      // ---------------------------------------------------------- 桌面
      function spot(id, extra = []) {
        return el('div', { class: ['lg-spot', 'tcp-spot', `tcp-spot--${id}`], dataset: { bet: id } }, [
          el('span.lg-spot__zh', { text: T[id].zh }),
          el('span.lg-spot__en', { text: T[id].en }),
          el('span.lg-spot__odds', { text: T[id].odds }),
          ...extra,
        ]);
      }
      const payTable = (cls, title, rows) => el('div', { class: ['tcp-pay', cls] }, [
        el('div.tcp-pay__title', { html: title }),
        ...rows.map(([z, e, o]) => el('div.tcp-pay__row', [el('span', { html: `${z} <i class="en">${e}</i>` }), el('b', { text: o })])),
      ]);
      function buildTable() {
        tableEl = el('div.lg-table.tcp-table', [
          el('div.tcp-area', [
            el('div.lg-table__label', { html: `${T.dealer.zh} ${T.dealer.en.toUpperCase()}` }),
            dealerHand = el('div.lg-hand.tcp-hand.tcp-dealer', { dataset: { role: 'dealer' } }),
            dealerRank = el('div.tcp-rank', { dataset: { role: 'dealer-rank' } }),
          ]),
          el('div.tcp-print', [
            el('div.tcp-qualify', { html: `<span class="tcp-qualify__en">${T.qualifyPrint}</span><span class="tcp-qualify__zh">${T.qualifyZh}</span>` }),
            el('div.tcp-pays', [
              payTable('tcp-pay--pp', 'PAIR PLUS', T.ppTable),
              payTable('tcp-pay--ab', 'ANTE BONUS', T.abTable),
            ]),
          ]),
          el('div.tcp-area', [
            playerHand = el('div.lg-hand.tcp-hand.tcp-player', { dataset: { role: 'player' } }),
            playerRank = el('div.tcp-rank', { dataset: { role: 'player-rank' } }),
            el('div.lg-table__label', { html: `${T.you.zh} ${T.you.en.toUpperCase()}` }),
          ]),
          el('div.tcp-spots', [
            spot('pairPlus'),
            spot('ante'),
            spot('play', [el('span.tcp-spot__note', { text: T.play.note })]),
          ]),
        ]);
        hintEl = el('div.lg-hint.tcp-hint', { hidden: true });
        const actions = el('div.lg-actions.tcp-actions', { dataset: { dealSlot: '' } });
        const chips = el('div');
        const barEl = el('div');
        root.append(tableEl, hintEl, actions, chips, barEl);
        acts = ui.actionBar(actions, [
          { id: 'fold', label: T.fold.zh, en: T.fold.en, hidden: true, onClick: () => decide('fold') },
          { id: 'play', label: T.playBtn.zh, en: T.playBtn.en, primary: true, hidden: true, onClick: () => decide('play') },
        ]);
        tray = ui.chipTray(chips, { denoms: ctx.denoms, selected: ctx.isReal ? 25 : 10 });
        layer = ui.betLayer(tableEl, { bets, chipTray: tray, gameId: ctx.gameId, canPlace });
        bar = ui.betBar(barEl, { bets, layer });
        renderHands([], [], { placeholders: true });
      }

      function canPlace(spotId, amount) {
        if (spotId === 'play') return T.playAuto;
        if (spotId === 'ante') {
          const ante = round2(bets.get('ante') + amount);
          const need = round2(bets.total() + amount + ante);
          if (!ctx.bank.canAfford(need) && ctx.bank.canAfford(round2(bets.total() + amount))) ui.toast(T.playWarn(ante), { type: 'warn' });
        }
        return true;
      }

      function renderHand(container, cards, down) {
        container.innerHTML = '';
        const out = [];
        for (let i = 0; i < 3; i++) {
          const c = cards[i] || null;
          const e = ui.card(c, { faceDown: !c || down, dim: !c, size: 'lg' });
          container.appendChild(e);
          out.push(e);
        }
        return out;
      }
      function renderHands(player, dealer, { revealDealer = true, placeholders = false } = {}) {
        renderHand(playerHand, player, placeholders);
        renderHand(dealerHand, dealer, !revealDealer);
        playerRank.innerHTML = player.length === 3 ? describe(poker.eval3(player)) : '';
        dealerRank.innerHTML = revealDealer && dealer.length === 3 ? describe(poker.eval3(dealer)) : '';
      }
      function markSpots(lines) {
        tableEl.querySelectorAll('[data-bet]').forEach((s) => {
          const l = lines && lines.find((x) => x.spot === s.dataset.bet);
          s.classList.toggle('is-win', !!l && l.result === 'win');
          s.classList.toggle('is-lose', !!l && l.result === 'lose');
        });
      }

      // ---------------------------------------------------------- 提示
      function paintHints() {
        hintEl.hidden = !ctx.hints;
        if (!ctx.hints) return;
        if (state.phase === 'decide') {
          const pe = poker.eval3(state.player);
          hintEl.innerHTML = `建議：<b>${shouldPlay(pe) ? '跟注 Play' : '棄牌 Fold'}</b> — ${strategyText(pe)}`;
        } else {
          hintEl.innerHTML = '提示：Pair Plus 優勢 2.32%、Ante/Play 3.37%。跟注門檻 <b>Q-6-4</b>；記得 <b>順子 > 同花</b>。';
        }
      }
      function strategyNode() {
        return el('div', [
          el('p', { html: '看牌後：<b>Q-6-4 以上跟注 Play</b>，否則棄牌。先比最大張（Q），再比第二張（6），再比第三張（4）。一對以上一律跟。' }),
          el('p', { html: `牌型排序：${T.ranking}` }),
          ui.table([['Pair Plus', '賠率'], ...T.ppTable.map(([z, e, o]) => [term(z, e), o])], { caption: '對子加注 Pair Plus（只看你的牌）' }),
          ui.table([['Ante Bonus', '賠率'], ...T.abTable.map(([z, e, o]) => [term(z, e), o])], { caption: 'Ante 獎金（有跟注就領，不論莊牌）' }),
          el('p.lg-muted', { text: '莊家優勢：Pair Plus 2.32%；Ante/Play 3.37%（照 Q-6-4）。' }),
        ]);
      }

      // ---------------------------------------------------------- 一局流程
      function startRound() {
        if (!ctx.alive()) return;
        state.phase = 'betting';
        state.decision = null;
        acts.set('fold', { hidden: true, disabled: true });
        acts.set('play', { hidden: true, disabled: true });
        paintHints();
        ctx.bettingWindow({ bets, onClose: onNoMoreBets, validate: preDealCheck });
      }
      function preDealCheck() {
        return bets.get('ante') > 0 || bets.get('pairPlus') > 0 ? true : T.needBet;
      }

      async function onNoMoreBets({ ok, validation }) {
        const own = ok ? preDealCheck() : validation.zh;
        if (own !== true) {
          bets.unlock();
          if (bets.total() > 0) ui.toast(own, { type: 'warn' });
          ctx.nextRound(startRound);
          return;
        }
        state.staked = bets.total();
        ctx.bank.debit(state.staked);
        state.phase = 'dealing';
        markSpots(null);
        await ctx.wait(500);                         // 讓「停止下注 No more bets」停留一下
        if (!ctx.alive()) return;
        ctx.dealer.say('發牌', 'Dealing');
        shoe.shuffle();
        if (state.forced) { shoe.stack(state.forced); state.forced = null; }
        const player = [], dealer = [];
        for (let i = 0; i < 3; i++) { player.push(shoe.draw()); dealer.push(shoe.draw()); }
        state.player = player; state.dealer = dealer;
        playerRank.innerHTML = ''; dealerRank.innerHTML = '';
        const pEls = renderHand(playerHand, player, true);
        renderHand(dealerHand, dealer, true);
        await ctx.wait(250);
        for (const e of pEls) { await ui.flip(e); if (!ctx.alive()) return; }
        playerRank.innerHTML = describe(poker.eval3(player));
        if (bets.get('ante') > 0) enterDecision();
        else { state.decision = null; state.phase = 'showdown'; await reveal(); }
      }

      function enterDecision() {
        state.phase = 'decide';
        const add = bets.get('ante');
        const can = ctx.bank.canAfford(add);
        acts.set('fold', { hidden: false, disabled: false });
        acts.set('play', { hidden: false, disabled: !can, label: can ? T.playBtn.zh : `${T.playBtn.zh}（${T.noPlayCash}）`, en: can ? `Play ${fmt(add)}` : '' });
        ctx.dealer.say(...T.decide);
        paintHints();
        if (ctx.isReal) {
          decideCd = ui.countdown(DECIDE_SECONDS, { onDone: () => { decideCd = null; if (ctx.alive() && state.phase === 'decide') { ui.toast(T.timeout, { type: 'warn' }); decide('fold', true); } } });
        }
      }

      async function decide(choice, auto = false) {
        if (state.phase !== 'decide') return;
        if (decideCd) { decideCd.cancel(); decideCd = null; }
        if (choice === 'play') {
          const add = bets.get('ante');
          if (!ctx.bank.canAfford(add)) { ui.toast(T.noPlayCash, { type: 'warn' }); return; }
          bets.set('play', add);
          ctx.bank.debit(add);
          state.staked = round2(state.staked + add);
          ctx.dealer.say('跟注', 'Play');
        } else {
          ctx.dealer.say(auto ? '時間到，棄牌' : '棄牌', 'Fold');
        }
        state.decision = choice;
        state.phase = 'showdown';
        acts.set('fold', { hidden: true, disabled: true });
        acts.set('play', { hidden: true, disabled: true });
        paintHints();
        await reveal();
      }

      async function reveal() {
        await ctx.wait(300);
        if (!ctx.alive()) return;
        for (const e of [...dealerHand.children]) { await ui.flip(e); if (!ctx.alive()) return; }
        dealerRank.innerHTML = describe(poker.eval3(state.dealer));
        finishRound();
      }

      function finishRound() {
        const r = settle({
          ante: bets.get('ante'), play: bets.get('play'), pairPlus: bets.get('pairPlus'),
          folded: state.decision === 'fold', player: state.player, dealer: state.dealer,
        });
        ctx.bank.credit(r.returned);
        state.staked = 0;
        state.last = r;
        markSpots(r.lines);
        const antePlayed = bets.get('ante') > 0 && !r.folded;
        ctx.dealer.say(r.folded ? '棄牌，收 Ante' : !antePlayed ? '派彩' : r.qualifies ? (r.cmp > 0 ? '你贏' : r.cmp < 0 ? '莊贏' : '平手') : '莊家不合格', 'Paying out');
        ctx.recordRound({ wagered: r.wagered, net: r.net, outcome: r.outcome });
        ctx.explain(explainOf(r));
        state.rounds += 1;
        state.phase = 'settled';
        bets.unlock();
        bets.clear();
        ctx.checkBroke();
        ctx.nextRound(startRound);
      }

      function explainOf(r) {
        const why = [];
        if (bets.get('ante') > 0) {
          const sp = shouldPlay(r.pe);
          const did = state.decision === 'play';
          why.push(`策略：${strategyText(r.pe)}。你選了<b>${did ? '跟注' : '棄牌'}</b>${sp === did ? ' ✓ 符合策略' : '，和策略不同'}。`);
          if (!r.folded && !r.qualifies) why.push('莊不合格時 Play 只退回，這是 Ante/Play 莊家優勢的來源。');
        }
        if (bets.get('pairPlus') > 0) why.push('Pair Plus 只看你的三張，和莊家、棄牌都無關。');
        if (r.pe.cat === 'STRAIGHT' || r.pe.cat === 'FLUSH') why.push(`三張牌時同花比順子容易出現，所以 <b>順子 > 同花</b>。`);
        return {
          hand: `你 <i class="en">You</i>：${labels(state.player)} → <b>${describe(r.pe)}</b><br>莊 <i class="en">Dealer</i>：${labels(state.dealer)} → <b>${describe(r.de)}</b>`,
          result: `① 莊是否合格：${r.steps.qualify}<br>② 比牌：${r.steps.compare}`,
          formula: `③ 每注計算：<br>${r.lines.map((l) => l.formula).join('<br>')}<br>淨 <b>${fmtSigned(r.net)}</b>（拿回 ${fmt(r.returned)} − 下注 ${fmt(r.wagered)}）`,
          why: why.join(''),
        };
      }

      // ---------------------------------------------------------- 教學用
      const demo = {
        ensureBetting() { if (state.phase === 'idle' || state.phase === 'settled') startRound(); },
        /** 下一局指定牌：player 3 張、dealer 3 張 */
        force(p, d) {
          const P = LG.cards.parseMany(p), D = LG.cards.parseMany(d);
          state.forced = [P[0], D[0], P[1], D[1], P[2], D[2]];
        },
        show(p, d, { reveal: rv = true } = {}) {
          if (['dealing', 'decide', 'showdown'].includes(state.phase)) return;
          renderHands(LG.cards.parseMany(p), LG.cards.parseMany(d), { revealDealer: rv });
        },
        say(zh, en) { ctx.dealer.say(zh, en); },
      };

      // ---------------------------------------------------------- 教學步驟（23 步）
      function tutorialSteps() {
        return [
          // ===== layout
          { id: 'layout-intro', section: 'layout', title: '這段你會學到：桌面',
            body: '<p>上方莊家三張、下方你三張，最下面三個下注格：Pair Plus、Ante、Play。</p>',
            highlight: ['.tcp-table'] },
          { id: 'layout-pairplus', section: 'layout', title: '對子加注 <i class="en">Pair Plus</i>',
            body: '<p>只看<b>你自己的三張</b>，有一對以上就賠，和莊家無關。</p>',
            highlight: ['[data-bet="pairPlus"]'] },
          { id: 'layout-ante', section: 'layout', title: '底注 <i class="en">Ante</i>',
            body: '<p>要和莊家比牌就押 Ante。Pair Plus 和 Ante 可以只押其中一個。</p>',
            highlight: ['[data-bet="ante"]'] },
          { id: 'layout-play', section: 'layout', title: '跟注 <i class="en">Play</i> 格',
            body: '<p>最靠近你的格子。看牌後要玩，就放<b>與 Ante 同額</b>；這格不用自己放籌碼。</p>',
            highlight: ['[data-bet="play"]'] },
          { id: 'layout-print', section: 'layout', title: '桌上印字與賠付表',
            body: '<p>印字 <b>DEALER PLAYS WITH QUEEN HIGH OR BETTER</b>：莊家 Q 高以上才合格。下面是兩張賠付表。</p>',
            highlight: ['.tcp-print'] },
          // ===== flow
          { id: 'flow-intro', section: 'flow', title: '這段你會學到：一局怎麼進行',

      return {
        bets, state, demo,
